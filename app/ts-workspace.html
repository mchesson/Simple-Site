function companyCard(nameQ){
  const o = findOrgByName(nameQ);
  if(!o){
    const near = S.orgs.map(x => x.name).slice(0, 6);
    say("I have no company matching **"+esc(nameQ)+"**." + (near.length ? " I do have these:" : ""), near.length ? near : null);
    return;
  }
  const cs = orgContacts(o.id), js = orgJobs(o.id).filter(j => j.status === "Open");
  push("as", "results", {
    q: o.name,
    lead: "**"+o.name+"** — "+cs.length+" contact"+(cs.length===1?"":"s")+", "+js.length+" open job"+(js.length===1?"":"s")+".",
    ids: { cons: cs.map(c => c.id), jobs: js.map(j => j.id), orgs: [o.id] }
  });
}
function doSearch(q){
  q = String(q).replace(/^\s*(?:candidates?|contacts?|accounts?|companies|clients?|jobs?|reqs?|placements?|people|talent)\s+(?:with|who know|knows|skilled in|using|in|at)\s+/i, "").trim() || q;
  const r = searchAll(q);
  const total = r.cands.length + r.cons.length + r.orgs.length + r.jobs.length;
  if(!total){
    say("Nothing matched **"+esc(q)+"**. Try a single skill or a city — or add the person with “add candidate "+esc(q)+"”.");
    return;
  }
  push("as", "results", {
    q,
    lead: total + " match" + (total === 1 ? "" : "es") + " for **"+q+"**",
    ids: {
      cands: r.cands.slice(0, 12).map(x => x.id),
      cons:  r.cons.slice(0, 8).map(x => x.id),
      jobs:  r.jobs.slice(0, 8).map(x => x.id),
      orgs:  r.orgs.slice(0, 6).map(x => x.id)
    }
  });
}

/* ---------- committing a draft ---------- */
function resolveOrg(name){
  const hit = findOrgByName(name);
  if(hit) return { org: hit, created: false };
  const o = { id: uid("o"), name: name.trim(), kind: "Client", status: "Active", notes: "", createdAt: nowISO() };
  S.orgs.push(o);
  return { org: o, created: true };
}
/* files the resume against the person, and sends the original to Resumes/ */
async function attachResumeDoc(f, pers){
  const rd = f && f._doc;
  if(!rd || !rd.text) return "";
  const doc = addDoc({ name: rd.name, kind: "Resume", size: rd.text.length,
    personId: pers.id, orgId: null, locationId: null, scope: "person", text: rd.text });
  logChange("doc", doc.id, doc.name, [{ f:"filed", from:"—", to:"Resumes · " + pers.name }]);
  const file = rd.ftok ? PENDING_FILES[rd.ftok] : null;
  if(rd.ftok) delete PENDING_FILES[rd.ftok];
  if(file && spCan(SP_TOOLS.upload) && spWriteState() !== "blocked" && S.sharepoint && S.sharepoint.driveId){
    if(file.size > SP_UPLOAD_CAP) return " The resume text is filed under **Resumes**; the original is over the 1 MB connector limit so it was not uploaded.";
    const up = await spUploadOriginal(file, { kind:"Resume" });
    if(up.ok){
      doc.link = up.webUrl || null; doc.spItemId = up.itemId || null;
      doc.spUri = up.uri || null; doc.spDriveId = S.sharepoint.driveId; doc.spPath = up.path || null;
      return " The resume is filed under **" + (up.path || "Resumes") + "** in SharePoint and linked to them.";
    }
    if(up.err) return " The resume text is filed under **Resumes**. I could not save the original: " + spErr(up.err).d;
    if(up.blockedPath) return " The resume text is filed under **Resumes** here. I could not create that folder in SharePoint — " + spWriteNote();
  }
  return " The resume is filed under **Resumes** and attached to them.";
}
async function commitDraft(id){
  const d = CHAT.drafts[id];
  if(!d) return;
  const f = d.fields;
  let created = null, extra = "";

  if(d.kind === "cand"){
    const dupe = findPersonByContact(f.email, f.phone) || findPersonByName(f.name);
    if(dupe){
      const wasRoles = personRoles(dupe).join(" and ").toLowerCase() || "a record";
      const added = grantRole(dupe, "candidate");
      const ch = fillBlanks(dupe, f);
      if(ch.length) logChange("person", dupe.id, dupe.name, ch);
      delete CHAT.drafts[id];
      CHAT.msgs = CHAT.msgs.filter(msg => !(msg.k === "draft" && msg.d.id === id));
      const rn1 = await attachResumeDoc(f, dupe);
      push("as", "saved", {
        text: "**" + dupe.name + "** was already here as " + wasRoles + "." +
              (added ? " I added the **candidate** role to that same record rather than creating a duplicate." : " No new record was needed.") +
              (ch.length ? " I also filled in " + ch.map(c => c.f).join(", ") + "." : "") +
              " Nothing was overwritten." + rn1,
        link: { type: "candidate", id: dupe.id, name: dupe.name, view: "cands" }
      });
      saveChat(); render(); save();
      return;
    }
    const p = { id: uid("p"), name: f.name, title: f.title || "", email: f.email || "", phone: f.phone || "",
      city: f.city || "", years: f.years == null ? null : +f.years, workAuth: f.workAuth || "",
      desiredPay: f.desiredPay == null ? null : +f.desiredPay, availFrom: null,
      skills: f.skills || [], notes: f.notes || "", isCandidate: true, isContact: false,
      orgId: null, lastContact: nowISO(), createdAt: nowISO() };
    S.people.push(p);
    logChange("person", p.id, p.name, [{ f: "created", from: "—", to: "candidate" }]);
    extra += await attachResumeDoc(f, p);
    created = { type: "candidate", id: p.id, name: p.name, view: "cands" };
  }
  else if(d.kind === "contact"){
    const { org: o, created: madeOrg } = resolveOrg(f.company);
    const dupe = findPersonByContact(f.email, f.phone) || findPersonByName(f.name);
    if(dupe){
      const wasRoles = personRoles(dupe).join(" and ").toLowerCase() || "a record";
      const added = grantRole(dupe, "contact", o.id);
      const ch = fillBlanks(dupe, Object.assign({}, f, { orgId: o.id }));
      if(ch.length) logChange("person", dupe.id, dupe.name, ch);
      delete CHAT.drafts[id];
      CHAT.msgs = CHAT.msgs.filter(msg => !(msg.k === "draft" && msg.d.id === id));
      push("as", "saved", {
        text: "**" + dupe.name + "** was already here as " + wasRoles + "." +
              (added ? " I added the **contact** role at **" + o.name + "** to that same record — a hiring manager who is also a candidate stays one person." : "") +
              (madeOrg ? " I created the account **" + o.name + "** too." : "") +
              " Nothing was overwritten.",
        link: { type: "contact", id: dupe.id, name: dupe.name, view: "orgs" }
      });
      saveChat(); render(); save();
      return;
    }
    const p = { id: uid("p"), name: f.name, title: f.title || "", email: f.email || "", phone: f.phone || "",
      orgId: o.id, notes: f.notes || "", isContact: true, isCandidate: false, skills: [],
      lastContact: nowISO(), createdAt: nowISO() };
    S.people.push(p);
    logChange("person", p.id, p.name, [{ f: "created", from: "—", to: "contact at " + o.name }]);
    created = { type: "contact", id: p.id, name: p.name + " at " + o.name, view: "orgs" };
    if(madeOrg) extra = " I also created the company **"+o.name+"**.";
  }
  else if(d.kind === "company"){
    const o = { id: uid("o"), name: f.name, kind: f.kind || "Client", status: "Active", notes: f.notes || "", createdAt: nowISO() };
    S.orgs.push(o);
    created = { type: "company", id: o.id, name: o.name, view: "orgs" };
  }
  else if(d.kind === "job"){
    const { org: o, created: madeOrg } = resolveOrg(f.company);
    const j = { id: uid("j"), orgId: o.id, endClientOrgId: null, title: f.title,
      type: f.jobType || "Contract", status: "Open", openings: 1, city: f.city || "",
      billMax: f.billMax == null ? null : +f.billMax, payMax: f.payMax == null ? null : +f.payMax,
      salaryMin: f.salaryMin == null ? null : +f.salaryMin, salaryMax: f.salaryMax == null ? null : +f.salaryMax,
      hmId: null, owner: "me", notes: f.notes || "", createdAt: nowISO() };
    S.jobs.push(j);
    created = { type: "job", id: j.id, name: j.title + " at " + o.name, view: "jobs" };
    if(madeOrg) extra = " I also created the company **"+o.name+"**.";
  }
  delete CHAT.drafts[id];
  CHAT.msgs = CHAT.msgs.filter(msg => !(msg.k === "draft" && msg.d.id === id));
  push("as", "saved", { text: "Saved **"+created.name+"**." + extra, link: created });
  saveChat();
  render();
  save();
}
function discardDraft(id){
  delete CHAT.drafts[id];
  CHAT.msgs = CHAT.msgs.filter(msg => !(msg.k === "draft" && msg.d.id === id));
  say("Discarded.");
  finishTurn();
}
function editDraft(id){
  const d = CHAT.drafts[id];
  if(!d) return;
  const f = d.fields;
  if(d.kind === "cand") modal("cand", { prefill: f, fromDraft: id });
  else if(d.kind === "company") modal("org", { prefill: { name: f.name }, fromDraft: id });
  else if(d.kind === "contact"){
    const { org: o } = resolveOrg(f.company);
    modal("contact", { prefill: Object.assign({}, f, { orgId: o.id }), orgId: o.id, fromDraft: id });
  }
  else if(d.kind === "job"){
    const { org: o } = resolveOrg(f.company);
    modal("job", { prefill: Object.assign({}, f, { orgId: o.id, type: f.jobType }), orgId: o.id, type: f.jobType, fromDraft: id });
  }
}

/* ---------- resume intake ---------- */
async function intakeFiles(files){
  const list = Array.from(files || []).slice(0, 5);
  if(!list.length) return;
  UI.view = "ask"; saveUI();
  for(const file of list){
    heard("📄 " + file.name);
    if(file.size > 8 * 1024 * 1024){
      say("**"+esc(file.name)+"** is larger than 8 MB — that is too big to read here.");
      continue;
    }
    say("Reading **"+esc(file.name)+"**…");
    render();
    let text = "";
    try{ text = await fileToText(file); }
    catch(err){
      if(String(err.message) === "legacy-doc")
        say("**"+esc(file.name)+"** is an old .doc file, which I cannot open. Save it as .docx or PDF, or paste the text instead.", ["Paste resume text"]);
      else
        say("I could not read **"+esc(file.name)+"**. Paste the text instead and I will parse it.", ["Paste resume text"]);
      CHAT.msgs = CHAT.msgs.filter(m => !(m.k === "text" && m.d.text.indexOf("Reading **") === 0));
      finishTurn();
      continue;
    }
    CHAT.msgs = CHAT.msgs.filter(m => !(m.k === "text" && m.d.text.indexOf("Reading **") === 0));
    if(textQuality(text) < 0.4 || text.replace(/\s/g, "").length < 60){
      say("I opened **"+esc(file.name)+"** but could not get clean text out of it — it is probably a scan or uses embedded fonts. Paste the text and I will parse it.", ["Paste resume text"]);
      finishTurn();
      continue;
    }
    const kindGuess = detectDocKind(text, file.name);
    const parsedTry = parseResume(text, file.name);
    if(kindGuess === "Resume" || looksLikeResume(text, parsedTry)){
      const rtok = uid("f");
      PENDING_FILES[rtok] = file;
      ingestResumeText(text, file.name, rtok);
    }else{
      if(stateBytes() > STATE_SOFT_CAP){
        say("This workspace is getting large, so I did not store the text of **"+esc(file.name)+"**. Keep the original in SharePoint and paste its link on the document record instead.");
        finishTurn();
        continue;
      }
      const ftok = uid("f");
      PENDING_FILES[ftok] = file;
      askWhereToFile({ name:file.name, kind:kindGuess, size:file.size, text:text, ftok:ftok });
      finishTurn();
    }
  }
}
function ingestResumeText(text, filename, ftok){
  const f = parseResume(text, filename || "pasted text");
  f._doc = { name: filename || "pasted resume.txt", kind: "Resume", text: text, ftok: ftok || null };
  f.notes = "Imported from " + (filename || "pasted text") + ".";
  const found = [];
  if(f.name) found.push("name");
  if(f.email) found.push("email");
  if(f.phone) found.push("phone");
  if(f.title) found.push("title");
  if(f.city) found.push("location");
  if(f.years) found.push("experience");
  if((f.skills||[]).length) found.push((f.skills.length)+" skills");
  say("I read that and found " + (found.length ? found.join(", ") : "very little") + ". Check it over before saving:");
  startAdd("cand", f);
  finishTurn();
}

/* ============================================================
   NATURAL-LANGUAGE LIST QUERIES
   "list of accounts", "my accounts", "unassigned accounts",
   "open jobs in dallas", "candidates with java", "my placements"
   ============================================================ */
const ENTITIES = [
  [/\b(placements?|assignments?|on assignment|billing)\b/, "placements"],
  [/\b(submissions?|submittals?|pipelines?)\b/, "subs"],
  [/\b(accounts?|companies|company|clients?|orgs?|organi[sz]ations?|prospects?)\b/, "orgs"],
  [/\b(contacts?|hiring managers?|managers?|decision makers?)\b/, "cons"],
  [/\b(candidates?|talent|consultants?|applicants?|people|resumes?)\b/, "cands"],
  [/\b(jobs?|reqs?|requisitions?|roles?|openings?|positions?|orders?)\b/, "jobs"]
];
const ENTITY_LABEL = { orgs:"accounts", cands:"candidates", cons:"contacts", jobs:"jobs", placements:"placements", subs:"submissions" };
const ENTITY_ONE   = { orgs:"account", cands:"candidate", cons:"contact", jobs:"job", placements:"placement", subs:"submission" };
const entityLabel = (e, n) => (n === 1 ? ENTITY_ONE[e] : ENTITY_LABEL[e]);
const ENTITY_VIEW  = { orgs:"orgs", cands:"cands", cons:"orgs", jobs:"jobs", placements:"place", subs:"jobs" };

function detectEntity(low){
  for(const [rx, e] of ENTITIES) if(rx.test(low)) return e;
  return null;
}
function isListish(low){
  if(/^(list|lists|show|show me|give me|get me|pull(?: up)?|display|what are|whats|what's|who are|how many|count)\b/.test(low)) return true;
  if(/\blist of\b/.test(low)) return true;
  if(/^(my|all|every|unassigned|unowned|open|active|stalled|dormant)\b/.test(low)) return true;
  /* "candidates with kubernetes", "accounts", "open jobs in dallas" — starting with the
     thing you want is the most natural way to ask for a list. */
  for(const [rx] of ENTITIES) if(new RegExp("^\\s*(?:my |all |every )?" + rx.source.replace(/^\\b|\\b$/g, "")).test(low)) return true;
  return false;
}
function parseFilters(low){
  const f = {};
  if(/\b(my|mine|assigned to me|i own|my own)\b/.test(low)) f.mine = true;
  if(/\b(unassigned|unowned|no owner|nobody owns|without an owner|orphan(?:ed)?|up for grabs)\b/.test(low)) f.unassigned = true;
  if(/\bopen\b/.test(low)) f.status = "Open";
  if(/\bon hold\b/.test(low)) f.status = "On hold";
  if(/\bfilled\b/.test(low)) f.status = "Filled";
  if(/\bclosed\b/.test(low)) f.status = "Closed";
  if(/\blost\b/.test(low)) f.status = "Lost";
  if(/\bactive\b/.test(low)) f.active = true;
  if(/\bended|ending|expiring|rolling off|finishing\b/.test(low)) f.ending = true;
  if(/\bstalled|stuck|no movement|needs? attention|aging|old\b/.test(low)) f.stale = true;
  if(/\bdormant\b/.test(low)) f.orgStatus = "Dormant";
  if(/\bprospects?\b/.test(low)) f.orgKind = "Prospect";
  if(/\b(msp|vms)\b/.test(low)) f.orgKind = "MSP / VMS";
  if(/\bcontract to hire|contract-to-hire|c2h\b/.test(low)) f.jobType = "Contract-to-hire";
  else if(/\bdirect hire|perm\b/.test(low)) f.jobType = "Direct hire";
  else if(/\bsow|project\b/.test(low)) f.jobType = "SOW / project";
  else if(/\bcontract\b/.test(low)) f.jobType = "Contract";
  const city = low.match(/\b(?:in|near|around|based in)\s+([a-z][a-z.\-' ]{2,30}?)(?:\s+(?:with|who|that|for|and)\b|[,.]|$)/);
  if(city) f.city = city[1].trim();
  const kw = low.match(/\b(?:with|knows?|skilled in|who know|using)\s+([a-z0-9+#.\-\s]{2,40})$/);
  if(kw) f.keyword = kw[1].trim();
  return f;
}
function applyFilters(entity, f){
  const cityHit = (v) => !f.city || String(v||"").toLowerCase().includes(f.city);
  if(entity === "orgs"){
    let l = S.orgs.slice();
    if(f.mine) l = l.filter(ownedByMe);
    if(f.unassigned) l = l.filter(o => !orgOwners(o).length);
    if(f.orgKind) l = l.filter(o => o.kind === f.orgKind);
    if(f.orgStatus) l = l.filter(o => (o.status||"Active") === f.orgStatus);
    if(f.active) l = l.filter(o => (o.status||"Active") === "Active");
    if(f.keyword) l = l.filter(o => (o.name+" "+(o.notes||"")).toLowerCase().includes(f.keyword));
    return l;
  }
  if(entity === "jobs"){
    let l = S.jobs.slice();
    if(f.status) l = l.filter(j => j.status === f.status);
    else if(f.active) l = l.filter(j => j.status === "Open");
    if(f.jobType) l = l.filter(j => j.type === f.jobType);
    if(f.mine) l = l.filter(j => { const o = org(j.orgId); return !!(o && ownedByMe(o)); });
    if(f.unassigned) l = l.filter(j => { const o = org(j.orgId); return !(o && orgOwners(o).length); });
    if(f.city) l = l.filter(j => cityHit(j.city));
    if(f.keyword) l = l.filter(j => (j.title+" "+(j.notes||"")).toLowerCase().includes(f.keyword));
    return l;
  }
  if(entity === "cands"){
    let l = candidates();
    if(f.city) l = l.filter(p => cityHit(p.city));
    if(f.keyword) l = l.filter(p => (p.name+" "+(p.title||"")+" "+(p.skills||[]).join(" ")+" "+(p.notes||"")).toLowerCase().includes(f.keyword));
    if(f.active) l = l.filter(p => personSubs(p.id).some(s => isOpenStage(s.stage)));
    return l;
  }
  if(entity === "cons"){
    let l = contacts();
    if(f.mine) l = l.filter(p => { const o = org(p.orgId); return o && ownedByMe(o); });
    if(f.unassigned) l = l.filter(p => { const o = org(p.orgId); return !(o && orgOwners(o).length); });
    if(f.keyword) l = l.filter(p => (p.name+" "+(p.title||"")+" "+orgName(p.orgId)).toLowerCase().includes(f.keyword));
    return l;
  }
  if(entity === "placements"){
    let l = S.placements.slice();
    if(f.active || f.status === "Open") l = l.filter(p => p.status === "Active");
    if(f.ending) l = l.filter(p => p.endsOn && daysUntil(p.endsOn) != null && daysUntil(p.endsOn) <= 30 && p.status === "Active");
    if(f.mine) l = l.filter(p => { const s = sub(p.subId), j = s?job(s.jobId):null, o = j?org(j.orgId):null; return o && ownedByMe(o); });
    return l;
  }
  if(entity === "subs"){
    let l = S.subs.filter(s => isOpenStage(s.stage));
    if(f.stale) l = l.filter(s => s.stage !== "Sourced" && daysAgo(s.stageSince) >= 5);
    if(f.mine) l = l.filter(s => { const j = job(s.jobId), o = j?org(j.orgId):null; return o && ownedByMe(o); });
    return l;
  }
  return [];
}
function describeFilters(entity, f){
  const bits = [];
  if(f.mine) bits.push("owned by " + (ME || "me"));
  if(f.unassigned) bits.push("with no owner");
  if(f.status) bits.push(f.status.toLowerCase());
  else if(f.active) bits.push("active");
  if(f.ending) bits.push("ending within 30 days");
  if(f.stale) bits.push("with no movement in 5+ days");
  if(f.orgKind) bits.push(f.orgKind.toLowerCase());
  if(f.orgStatus) bits.push(f.orgStatus.toLowerCase());
  if(f.jobType) bits.push(f.jobType.toLowerCase());
  if(f.city) bits.push("in " + f.city);
  if(f.keyword) bits.push("matching “" + f.keyword + "”");
  return bits.length ? " " + bits.join(", ") : "";
}
function tryListQuery(text){
  const low = text.toLowerCase().trim();
  const entity = detectEntity(low);
  if(!entity) return false;
  if(!isListish(low) && !/\?$/.test(low)) return false;

  const f = parseFilters(low);

  if(f.mine && !ME){
    CHAT.pending = { kind: "identity", fields: {}, slot: "name", replay: text };
    say("Before I can show what is **yours**, what is your name? I will remember it on this device.");
    return true;
  }

  const rows = applyFilters(entity, f);
  const label = entityLabel(entity, rows.length);
  const desc = describeFilters(entity, f);

  if(/^(how many|count)\b/.test(low)){
    say("**" + rows.length + "** " + label + desc + ".");
    return true;
  }
  if(!rows.length){
    say("No " + label + desc + " right now.",
        entity === "orgs" ? ["list of accounts", "unassigned accounts"] : null);
    return true;
  }
  const ids = {};
  ids[entity] = rows.slice(0, 25).map(r => r.id);
  push("as", "results", {
    q: label + desc,
    lead: "**" + rows.length + "** " + label + desc + (rows.length > 25 ? " — first 25 shown" : ""),
    ids,
    openView: ENTITY_VIEW[entity]
  });
  return true;
}

function tryIdentity(text){
  let m = text.match(/^\s*(?:i am|i'm|im|my name is|call me|this is)\s+([A-Za-z][\w.'\- ]{1,40})\s*$/i);
  if(m){ setMe(titleCaseName(m[1].trim())); say("Noted — you are **" + ME + "**. Now “my accounts” will work."); return true; }
  if(/^\s*who am i\s*\??$/i.test(text)){
    say(ME ? "You are **" + ME + "** on this device." : "I do not know yet — tell me with “I am Matt”.");
    return true;
  }
  return false;
}

/* ============================================================
   NON-DESTRUCTIVE EDITS
   Nothing overwrites silently and nothing is deleted. Every
   change appends to an audit trail; removal is archival.
   ============================================================ */
function fmtVal(v){
  if(v == null || v === "") return "—";
  if(Array.isArray(v)) return v.length ? v.join(", ") : "—";
  return String(v);
}
function logChange(entity, id, name, changes){
  if(!changes || !changes.length) return;
  S.audit = S.audit || [];
  S.audit.push({ at: nowISO(), by: ME || "someone", entity, id, name, changes });
  if(S.audit.length > 1500) S.audit = S.audit.slice(-1500);
}
/* applies patch to obj, returns the list of what actually changed */
function applyPatch(obj, patch, labels){
  const changes = [];
  Object.keys(patch).forEach(k => {
    const from = obj[k], to = patch[k];
    const same = Array.isArray(from) || Array.isArray(to)
      ? (from||[]).join("|") === (to||[]).join("|")
      : String(from == null ? "" : from) === String(to == null ? "" : to);
    if(!same){
      changes.push({ f: (labels && labels[k]) || k, from: fmtVal(from), to: fmtVal(to) });
      obj[k] = to;
    }
  });
  return changes;
}
function historyFor(id){
  return (S.audit || []).filter(a => a.id === id).slice().reverse().slice(0, 12);
}
function archiveRecord(entity, id){
  const rec = entity === "person" ? person(id) : entity === "org" ? org(id) : job(id);
  if(!rec) return;
  rec.archived = true;
  logChange(entity, id, rec.name || rec.title, [{ f: "archived", from: "no", to: "yes" }]);
}
function restoreRecord(entity, id){
  const rec = entity === "person" ? person(id) : entity === "org" ? org(id) : job(id);
  if(!rec) return;
  rec.archived = false;
  logChange(entity, id, rec.name || rec.title, [{ f: "archived", from: "yes", to: "no" }]);
}

/* ============================================================
   DOCUMENTS — resumes, MSAs, Exhibit A, SOWs.
   The extracted TEXT is stored and searchable. Originals stay
   in SharePoint/Drive; we keep the link.
   ============================================================ */
const DOC_KINDS = ["Resume","MSA","Exhibit","SOW","NDA","Rate sheet","PO","RTR","Other"];
const DOC_TEXT_CAP = 60000;
const STATE_SOFT_CAP = 5.5 * 1024 * 1024;

function detectDocKind(text, filename){
  const t = (String(filename||"") + " " + String(text||"").slice(0, 4000)).toLowerCase();
  if(/master\s+service/.test(t) || /\bmsa\b/.test(t)) return "MSA";
  if(/\bexhibit\s+[a-z]\b/.test(t)) return "Exhibit";
  if(/statement\s+of\s+work/.test(t) || /\bsow\b/.test(t)) return "SOW";
  if(/non-?disclosure/.test(t) || /\bnda\b/.test(t)) return "NDA";
  if(/rate\s+(sheet|card)|pricing\s+schedule/.test(t)) return "Rate sheet";
  if(/purchase\s+order/.test(t)) return "PO";
  if(/right\s+to\s+represent/.test(t) || /\brtr\b/.test(t)) return "RTR";
  if(/curriculum\s+vitae|professional\s+summary|work\s+experience|employment\s+history/.test(t) || /resume|\bcv\b/.test(t)) return "Resume";
  return "Other";
}
function looksLikeResume(text, f){
  if(detectDocKind(text, "") === "Resume") return true;
  return !!(f.email || f.phone) && (f.skills || []).length >= 2;
}
function stateBytes(){
  try{ return JSON.stringify(S).length; }catch(e){ return 0; }
}
function addDoc(rec){
  S.docs = S.docs || [];
  const d = Object.assign({ id: uid("doc"), at: nowISO(), by: ME || "someone" }, rec);
  if(d.text && d.text.length > DOC_TEXT_CAP){
    d.text = d.text.slice(0, DOC_TEXT_CAP);
    d.truncated = true;
  }
  S.docs.push(d);
  return d;
}
function docsFor(id){ return (S.docs || []).filter(d => d.orgId === id || d.personId === id || d.jobId === id); }
function docTarget(d){
  if(d.orgId) return orgName(d.orgId);
  if(d.personId){ const p = person(d.personId); return p ? p.name : "—"; }
  if(d.jobId){ const j = job(d.jobId); return j ? j.title : "—"; }
  return "unfiled";
}
function searchDocs(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const out = [];
  (S.docs || []).forEach(d => {
    const hay = ((d.text||"") + " " + d.name + " " + d.kind + " " + docTarget(d)).toLowerCase();
    if(!terms.every(t => hay.includes(t))) return;
    let snip = "";
    const body = d.text || "";
    const i = body.toLowerCase().indexOf(terms[0]);
    if(i >= 0) snip = (i > 40 ? "…" : "") + body.slice(Math.max(0, i - 40), i + 160).replace(/\s+/g, " ") + "…";
    out.push({ d, snip });
  });
  return out;
}
function tryDocSearch(text){
  const m = text.match(/^\s*(?:search|find|look\s+in|grep)\s+(?:the\s+)?(?:docs?|documents?|files?|msas?|contracts?|agreements?|resumes?|exhibits?|sows?)\s*(?:for|containing|with|mentioning)?\s+(.+)$/i);
  if(!m) return false;
  const q = m[1].trim().replace(/^["']|["']$/g, "");
  const hits = searchDocs(q);
  if(!hits.length){ say("No stored document mentions **" + esc(q) + "**."); return true; }
  push("as", "docresults", { q, lead: "**" + hits.length + "** document" + (hits.length===1?"":"s") + " mention" + (hits.length===1?"s":"") + " “" + q + "”", ids: hits.map(h => h.d.id), snips: hits.map(h => h.snip) });
  return true;
}
function tryDocList(text){
  const low = text.toLowerCase();
  if(!/\b(docs?|documents?|files?|msas?|agreements?|contracts?|exhibits?|paperwork)\b/.test(low)) return false;
  if(!isListish(low)) return false;
  let l = (S.docs || []).slice();
  const kind = DOC_KINDS.find(k => low.includes(k.toLowerCase()));
  if(kind) l = l.filter(d => d.kind === kind);
  const at = low.match(/\b(?:at|for)\s+(.+)$/);
  if(at){ const o = findOrgByName(at[1]); if(o) l = l.filter(d => d.orgId === o.id); }
  if(!l.length){ say("No documents stored" + (kind ? " of kind " + kind : "") + " yet. Drop a file anywhere on the page to file one."); return true; }
  push("as", "docresults", { q: "documents", lead: "**" + l.length + "** document" + (l.length===1?"":"s") + (kind ? " · " + kind : ""), ids: l.slice(0,25).map(d => d.id), snips: [] });
  return true;
}

/* ---------- filing a non-resume document ---------- */
function askWhereToFile(doc){
  CHAT.pending = { kind: "fileDoc", fields: { doc }, slot: "account" };
  say("That reads like a **" + doc.kind + "**. Which account should I file it against?",
      S.orgs.filter(o => !o.archived).slice(0, 6).map(o => o.name));
}
async function fileDocToOrg(doc, o, loc, createdOrg){
  const d = addDoc({ name: doc.name, kind: doc.kind, size: doc.size, text: doc.text,
    orgId: o.id, locationId: loc ? loc.id : null, scope: loc ? "location" : "account" });
  CHAT.pending = null;

  /* put the original in SharePoint if a destination is set and writes are possible */
  let upNote = "";
  const file = doc.ftok ? PENDING_FILES[doc.ftok] : null;
  if(doc.ftok) delete PENDING_FILES[doc.ftok];
  if(file && spCan(SP_TOOLS.upload) && spWriteState() !== "blocked"){
    if(!S.sharepoint || !S.sharepoint.driveId){
      upNote = " I did not save the original anywhere — tell me where with “set the sharepoint folder to <name>”.";
    }else if(file.size > SP_UPLOAD_CAP){
      upNote = " The original is over 1 MB, which is this connector's limit, so only the text is here. Put the file in **" +
               S.sharepoint.name + "** yourself and I can link it.";
    }else{
      const up = await spUploadOriginal(file, { kind:d.kind, orgName:o.name });
      if(up.ok){
        d.link = up.webUrl || d.link;
        d.spItemId = up.itemId || null;
        d.spUri = up.uri || null;
        d.spDriveId = S.sharepoint.driveId;
        d.spPath = up.path || null;
        upNote = " The original is saved in **" + S.sharepoint.name + "/" + (up.path || "") + "** and linked here.";
      }else if(up.err){
        upNote = " I could not save the original: " + spErr(up.err).d;
      }else if(up.blockedPath){
        upNote = " The original is not saved: I could not create the **" + up.blockedPath + "** folder. " + spWriteNote();
      }
    }
  }else if(file){
    upNote = " It belongs in **" + spPlannedPath(d.kind, o.name) + "**. Only the text is stored here — the original stays on your machine. " + spWriteNote();
  }else{
    upNote = " It is filed under **" + spPlannedPath(d.kind, o.name) + "**.";
  }
  push("as", "saved", {
    text: "Filed **" + d.name + "** (" + d.kind + ") against **" + o.name + "**" +
          (loc ? ", scoped to the **" + loc.name + "** location" : " as an **account-wide** agreement") + "." +
          (createdOrg ? " I created that account too." : "") +
          " Its text is searchable now — try “search documents for termination”." +
          (d.truncated ? " Only the first 60,000 characters were kept." : "") + upNote,
    link: { type: "company", id: o.id, name: o.name, view: "orgs" }
  });
  saveChat(); render(); save();
}

/* ============================================================
   ACCOUNTS: many owners, many locations, and agreements that
   are either account-wide or tied to one location.
   ============================================================ */
function migrateState(){
  S.locations = S.locations || [];
  S.docs = S.docs || [];
  S.audit = S.audit || [];
  (S.orgs || []).forEach(o => {
    if(!Array.isArray(o.owners)) o.owners = o.owner ? [o.owner] : [];
    delete o.owner;
  });
  (S.docs || []).forEach(d => { if(!d.scope) d.scope = d.locationId ? "location" : "account"; });
}
const orgOwners = o => (o && Array.isArray(o.owners)) ? o.owners : [];
const orgLocations = oid => (S.locations || []).filter(l => l.orgId === oid && !l.archived);
const locById = id => (S.locations || []).find(l => l.id === id) || null;
function locLabel(id){ const l = locById(id); return l ? l.name : "—"; }
function locLine(l){
  return [l.address, [l.city, l.state].filter(Boolean).join(", "), l.zip].filter(Boolean).join(" · ");
}
const docsForOrg = oid => (S.docs || []).filter(d => d.orgId === oid);
const docsAccountWide = oid => docsForOrg(oid).filter(d => !d.locationId);
const docsForLocation = lid => (S.docs || []).filter(d => d.locationId === lid);

function addOwner(o, name){
  const n = String(name || "").trim();
  if(!n) return false;
  o.owners = orgOwners(o);
  if(o.owners.some(x => x.toLowerCase() === n.toLowerCase())) return false;
  const before = o.owners.join(", ") || "—";
  o.owners = o.owners.concat([n]);
  logChange("org", o.id, o.name, [{ f: "owners", from: before, to: o.owners.join(", ") }]);
  return true;
}
function removeOwner(o, name){
  const n = String(name || "").trim().toLowerCase();
  o.owners = orgOwners(o);
  const before = o.owners.join(", ") || "—";
  const next = o.owners.filter(x => x.toLowerCase() !== n);
  if(next.length === o.owners.length) return false;
  o.owners = next;
  logChange("org", o.id, o.name, [{ f: "owners", from: before, to: o.owners.join(", ") || "—" }]);
  return true;
}

/* ---------- assistant: ownership on many-owner accounts ---------- */
function tryOwnership(text){
  let m = text.match(/^\s*(?:assign|add|give)\s+(.+?)\s+(?:to|as owner of|as an owner of)\s+(me|myself|[A-Za-z][\w.'\- ]{1,40})\s*$/i);
  if(m && /^(?:a\s+|an\s+)?(?:location|site|branch|office|facility|candidate|contact|manager|hiring manager|job|req|requisition|role|opening|position|company|client|account|org)\b/i.test(m[1].trim())) m = null;
  if(m){
    const o = findOrgByName(m[1]);
    if(!o){ say("I have no account called **" + esc(m[1].trim()) + "**."); return true; }
    let to = m[2].trim();
    if(/^(me|myself)$/i.test(to)){
      if(!ME){ CHAT.pending = { kind:"identity", fields:{}, slot:"name", replay:text };
        say("What is your name? I will remember it on this device."); return true; }
      to = ME;
    }
    const added = addOwner(o, to);
    say(added ? "**" + to + "** now owns **" + o.name + "** — it has " + orgOwners(o).length + " owner" + (orgOwners(o).length===1?"":"s") + ": " + orgOwners(o).join(", ") + "."
              : "**" + to + "** already owns **" + o.name + "**.");
    render(); if(added) save();
    return true;
  }
  m = text.match(/^\s*(?:unassign|remove)\s+(?:me|myself|([A-Za-z][\w.'\- ]{1,40}))\s+(?:from|as owner of)\s+(.+?)\s*$/i);
  if(m){
    const o = findOrgByName(m[2]);
    if(!o){ say("I have no account called **" + esc(m[2].trim()) + "**."); return true; }
    const target = m[1] ? m[1].trim() : ME;
    if(!target){ say("Tell me who to remove, or set your name first with “I am Matt”."); return true; }
    const gone = removeOwner(o, target);
    say(gone ? "**" + target + "** no longer owns **" + o.name + "**" + (orgOwners(o).length ? " — still owned by " + orgOwners(o).join(", ") + "." : " — it has no owner now.")
             : "**" + target + "** was not an owner of **" + o.name + "**.");
    render(); if(gone) save();
    return true;
  }
  m = text.match(/^\s*who\s+owns\s+(.+?)\s*\??$/i);
  if(m){
    const o = findOrgByName(m[1]);
    if(!o){ say("I have no account called **" + esc(m[1].trim()) + "**."); return true; }
    const ow = orgOwners(o);
    say(ow.length ? "**" + o.name + "** is owned by " + ow.map(x => "**"+x+"**").join(" and ") + "."
                  : "**" + o.name + "** has no owner. Say “assign " + o.name + " to me” to take it.");
    return true;
  }
  return false;
}

/* ---------- assistant: locations ---------- */
function tryLocations(text){
  let m = text.match(/^\s*(?:add|new|create)\s+(?:a\s+)?(?:location|site|branch|office|facility)\b[\s:,-]*(.+)$/i);
  if(m){
    let rest = m[1].trim();
    let orgQ = null;
    const at = rest.match(/\s+(?:to|for|under|at)\s+([^,]+)$/i);
    if(at){ orgQ = at[1].trim(); rest = rest.slice(0, at.index).trim(); }
    const parts = rest.split(",").map(x => x.trim()).filter(Boolean);
    const f = { name: parts[0] || "", address: parts[1] || "" };
    const ct = rest.match(RX_CITY);
    if(ct){ f.city = ct[1].trim(); f.state = ct[2]; }
    if(!orgQ){
      CHAT.pending = { kind: "locOrg", fields: f, slot: "account" };
      say("Which account is the location **" + esc(f.name || "you are adding") + "** under?",
          S.orgs.filter(o => !o.archived).slice(0, 6).map(o => o.name));
      return true;
    }
    const { org: o, created } = resolveOrg(orgQ);
    if(!f.name){
      CHAT.pending = { kind: "locName", fields: Object.assign(f, { orgId: o.id }), slot: "name" };
      say("What should I call that location at **" + o.name + "**? For example “Chicago HQ”.");
      return true;
    }
    createLocation(o, f, created);
    return true;
  }
  m = text.match(/^\s*(?:list|show|what)\s+(?:are\s+the\s+)?(?:the\s+)?locations?\s+(?:for|at|of|under)\s+(.+?)\s*\??$/i);
  if(m){
    const o = findOrgByName(m[1]);
    if(!o){ say("I have no account called **" + esc(m[1].trim()) + "**."); return true; }
    const ls = orgLocations(o.id);
    if(!ls.length){ say("**" + o.name + "** has no locations yet. Try “add location Chicago HQ to " + o.name + "”."); return true; }
    push("as", "locresults", { lead: "**" + o.name + "** has " + ls.length + " location" + (ls.length===1?"":"s"), ids: ls.map(l => l.id), orgId: o.id });
    return true;
  }
  if(/^\s*(?:list|show)\s+(?:all\s+)?locations?\s*\??$/i.test(text)){
    const ls = (S.locations || []).filter(l => !l.archived);
    if(!ls.length){ say("No locations stored yet."); return true; }
    push("as", "locresults", { lead: "**" + ls.length + "** location" + (ls.length===1?"":"s") + " across all accounts", ids: ls.map(l => l.id) });
    return true;
  }
  return false;
}
function createLocation(o, f, madeOrg){
  const l = { id: uid("loc"), orgId: o.id, name: f.name, address: f.address || "",
    city: f.city || "", state: f.state || "", zip: f.zip || "", roe: f.roe || "", notes: "",
    archived: false, createdAt: nowISO() };
  S.locations = S.locations || [];
  S.locations.push(l);
  logChange("location", l.id, l.name, [{ f: "created", from: "—", to: o.name }]);

  push("as", "saved", {

          " You can give it its own address, rules of engagement and agreements.",

/* ============================================================
   ONE PERSON, MANY ROLES
   A hiring manager can also be a candidate. There is a single
   person record; "candidate" and "contact" are roles on it.
   ============================================================ */
function personRoles(p){
  const r = [];
  if(p.isCandidate) r.push("Candidate");
  if(p.isContact) r.push("Contact");
  return r;
}
function findPersonByContact(email, phone){
  const e = normEmail(email), d = digits(phone);
  if(e){ const hit = S.people.find(p => normEmail(p.email) === e); if(hit) return hit; }
  if(d && d.length >= 10){ const hit = S.people.find(p => digits(p.phone) === d); if(hit) return hit; }
  return null;
}
function findPersonByName(name){
  const n = String(name || "").trim().toLowerCase();
  if(n.length < 4) return null;
  const hits = S.people.filter(p => String(p.name || "").trim().toLowerCase() === n);
  return hits.length === 1 ? hits[0] : null;
}
/* fills only the fields that are currently empty — never overwrites */
function fillBlanks(p, f, labels){
  const patch = {};
  ["title","email","phone","city","years","workAuth","desiredPay","orgId"].forEach(k => {
    const cur = p[k];
    const empty = cur == null || cur === "";
    if(empty && f[k] != null && f[k] !== "") patch[k] = f[k];
  });
  if((!p.skills || !p.skills.length) && (f.skills || []).length) patch.skills = f.skills;
  const changes = applyPatch(p, patch, labels);
  if(f.notes){
    const stamp = "[" + fmtDate(todayISO()) + "] " + f.notes;
    p.notes = p.notes ? stamp + "\n" + p.notes : stamp;
  }
  return changes;
}
function grantRole(p, role, orgId){
  const changes = [];
  if(role === "candidate" && !p.isCandidate){
    p.isCandidate = true;
    changes.push({ f: "role", from: personRoles(p).filter(r => r !== "Candidate").join(", ") || "—", to: personRoles(p).join(", ") });
  }
  if(role === "contact" && !p.isContact){
    p.isContact = true;
    if(orgId && !p.orgId) p.orgId = orgId;
    changes.push({ f: "role", from: personRoles(p).filter(r => r !== "Contact").join(", ") || "—", to: personRoles(p).join(", ") });
  }
  if(changes.length) logChange("person", p.id, p.name, changes);
  return changes.length > 0;
}
function tryRoles(text){
  let m = text.match(/^\s*(?:make|mark|also track|treat)\s+(.+?)\s+(?:as\s+)?(?:a\s+)?(candidate|contact|hiring manager|manager)\b(?:\s+(?:at|for)\s+(.+))?\s*$/i);
  if(!m) return false;
  const p = findPersonByName(m[1]) || S.people.find(x => String(x.name||"").toLowerCase().includes(m[1].trim().toLowerCase()));
  if(!p){ say("I have nobody called **" + esc(m[1].trim()) + "**."); return true; }
  const role = /candidate/i.test(m[2]) ? "candidate" : "contact";
  let oid = null;
  if(role === "contact"){
    if(m[3]){ oid = resolveOrg(m[3]).org.id; }
    else if(!p.orgId){
      say("Which company is **" + p.name + "** a contact at?", S.orgs.filter(o => !o.archived).slice(0,6).map(o => o.name));
      CHAT.pending = { kind: "roleOrg", fields: { personId: p.id }, slot: "account" };
      return true;
    }
  }
  const did = grantRole(p, role, oid);
  say(did ? "**" + p.name + "** is now tracked as " + personRoles(p).map(r => "**"+r.toLowerCase()+"**").join(" and ") +
            " — one record, both roles, so the history stays together."
          : "**" + p.name + "** is already a " + role + ".");
  render(); if(did) save();
  return true;
}

/* ============================================================
   ROLE-AWARE ACTIVITY LOG
   The same person may be a hiring manager at one account and a
   candidate for another. Every interaction is logged against
   the role we were actually dealing with, plus the account it
   concerned — inferred from context, and only asked about when
   genuinely ambiguous. One person record throughout.
   ============================================================ */
const ACT_KINDS = ["Call","Email","Text","Meeting","Interview","Submission","Stage change","Placement","Note"];

function logActivity(personId, ctx, kind, note){
  S.activity = S.activity || [];
  const a = {
    id: uid("act"), personId,
    role: ctx && ctx.role ? ctx.role : null,
    orgId: ctx && ctx.orgId ? ctx.orgId : null,
    jobId: ctx && ctx.jobId ? ctx.jobId : null,
    subId: ctx && ctx.subId ? ctx.subId : null,
    kind: kind || "Note", note: note || "",
    at: nowISO(), by: ME || "someone"
  };
  S.activity.push(a);
  if(S.activity.length > 3000) S.activity = S.activity.slice(-3000);
  const p = person(personId);
  if(p) p.lastContact = a.at;
  return a;
}
function activityFor(pid){ return (S.activity || []).filter(a => a.personId === pid).slice().reverse(); }

/* Which hat were we wearing? Derived from where the interaction happened. */
function inferContext(p, hint){
  hint = hint || {};
  if(hint.subId){
    const s = sub(hint.subId), j = s ? job(s.jobId) : null;
    if(s && j) return { role:"candidate", orgId:j.orgId, jobId:j.id, subId:s.id, why:"you were working their pipeline for " + j.title };
  }
  if(hint.jobId){
    const j = job(hint.jobId);
    if(j) return { role:"candidate", orgId:j.orgId, jobId:j.id, why:"you were on the " + j.title + " job" };
  }
  if(hint.orgId && p.isContact && p.orgId === hint.orgId)
    return { role:"contact", orgId:hint.orgId, why:"you were on their employer's account" };

  const open = personSubs(p.id).filter(s => isOpenStage(s.stage));
  if(p.isCandidate && !p.isContact){
    const j = open.length === 1 ? job(open[0].jobId) : null;
    return { role:"candidate", orgId:j ? j.orgId : null, jobId:j ? j.id : null, subId:open.length===1?open[0].id:null,
             why:"they are only a candidate here" };
  }
  if(p.isContact && !p.isCandidate)
    return { role:"contact", orgId:p.orgId, why:"they are only a contact here" };

  /* both roles — decide only if one side is obviously live */
  if(p.isCandidate && p.isContact){
    if(open.length === 1){
      const j = job(open[0].jobId);
      return { role:"candidate", orgId:j?j.orgId:null, jobId:j?j.id:null, subId:open[0].id, ambiguous:true,
               why:"they are live in one pipeline (" + (j?j.title:"a job") + ")" };
    }
    return null;
  }
  return { role:null, orgId:p.orgId || null, why:"no role set yet" };
}
function contextChoices(p){
  const out = [];
  personSubs(p.id).filter(s => isOpenStage(s.stage)).forEach(s => {
    const j = job(s.jobId);
    if(j) out.push({ label:"As a candidate for " + j.title + " (" + orgName(j.orgId) + ")", role:"candidate", orgId:j.orgId, jobId:j.id, subId:s.id });
  });
  if(p.isCandidate && !out.length) out.push({ label:"As a candidate", role:"candidate", orgId:null });
  if(p.isContact) out.push({ label:"As the hiring manager at " + orgName(p.orgId), role:"contact", orgId:p.orgId });
  return out;
}
function roleChip(a){
  if(a.role === "candidate") return '<span class="pill a">as candidate</span>';
  if(a.role === "contact") return '<span class="pill m">as manager</span>';
  return '<span class="pill n">no role</span>';
}

/* ---------- assistant: logging an interaction ---------- */
function tryLogActivity(text){
  const m = text.match(/^\s*log\s+(?:a\s+)?(call|email|text|meeting|interview|note|conversation|chat)?\s*(?:with|to|for)?\s*([A-Za-z][\w.'\- ]{1,40}?)\s*(?:\babout\b\s*(.+))?$/i);
  if(!m) return false;
  const kindRaw = (m[1] || "note").toLowerCase();
  const kind = kindRaw === "conversation" || kindRaw === "chat" ? "Call" : kindRaw[0].toUpperCase() + kindRaw.slice(1);
  const nameQ = m[2].trim();
  const note = (m[3] || "").trim();
  const p = findPersonByName(nameQ) || S.people.find(x => String(x.name||"").toLowerCase().includes(nameQ.toLowerCase()));
  if(!p){ say("I have nobody called **" + esc(nameQ) + "**. Add them first, or check the spelling."); return true; }

  let ctx = inferContext(p, {});
  if(note){
    const o = findOrgByName(note);
    if(o){
      if(p.isContact && p.orgId === o.id) ctx = { role:"contact", orgId:o.id, why:"the note names their employer" };
      else {
        const s = personSubs(p.id).find(x => { const j = job(x.jobId); return j && j.orgId === o.id; });
        if(s){ const j = job(s.jobId); ctx = { role:"candidate", orgId:o.id, jobId:j.id, subId:s.id, why:"the note names an account they are submitted to" }; }
      }
    }
  }
  if(!ctx){
    CHAT.pending = { kind:"actRole", fields:{ personId:p.id, actKind:kind, note }, slot:"role" };
    say("**" + p.name + "** is both a candidate and a hiring manager here. Which were you dealing with?",
        contextChoices(p).map(c => c.label));
    return true;
  }
  const a = logActivity(p.id, ctx, kind, note);
  say("Logged a **" + kind.toLowerCase() + "** with **" + p.name + "** " +
      (a.role === "candidate" ? "as a **candidate**" : a.role === "contact" ? "as the **hiring manager**" : "") +
      (a.orgId ? " on **" + orgName(a.orgId) + "**" : "") + "." +
      (ctx.why ? " _I worked that out because " + ctx.why + "._" : ""));
  render(); save();
  return true;
}

/* ---------- lightweight markdown for assistant copy ---------- */
function md(t){
  return esc(t)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])_([^_]+)_/g, "$1<em>$2</em>")
    .replace(/\n/g, "<br>");
}

function resultsCard(d){

  const sec = (title, ids, fn) => {

  out += sec("Placements", d.ids.placements, id => { const pl = byId(S.placements, id); if(!pl) return "";

/* ============================================================
   SHAREPOINT (Microsoft 365 connector)
   Calls run with the VIEWER's own credentials — this page never
   sees a token. Reading and searching are verified against the
   live tenant. Writing needs Files.ReadWrite.All, which an
   administrator must consent to; until then the write path
   reports exactly that instead of failing silently.
   ============================================================ */
const SP_SERVER = "Microsoft 365";
const SP_TOOLS = { search:"sharepoint_search", folders:"sharepoint_folder_search",
                   read:"read_resource", upload:"sharepoint_upload_file",
                   create:"sharepoint_create_folder" };
const SP_TEXT_CAP = 60000;
const SP_UPLOAD_CAP = 1048576;   /* the connector's hard limit */

let MCP = null;
let SP = { probed:false, status:"unknown", tools:[] };
let SPUI = { busy:false, err:null, note:null };
/* dropped File objects, held in memory only until the record is filed */
let PENDING_FILES = {};

let mcpPromise = null;
function getMcp(){
  if(!mcpPromise) mcpPromise = (window.claude && window.claude.use) ? window.claude.use("mcp") : Promise.resolve(null);
  return mcpPromise;
}
async function initSharePoint(){
  try{ MCP = await getMcp(); }catch(e){ MCP = null; }
  if(!MCP){ SP.status = "unavailable"; SP.probed = true; render(); return; }
  try{
    const r = await MCP.listTools();
    const srv = (r.servers || []).find(s => s.server === SP_SERVER);
    if(!srv){ SP.status = "not_connected"; }
    else{
      SP.tools = (srv.tools || []).map(t => t.name);
      SP.status = srv.authStatus === "needs_reauth" ? "needs_reauth"
                : SP.tools.length ? "connected" : "not_connected";
    }
  }catch(e){
    const c = e && e.code;
    SP.status = (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") ? "unavailable"
              : c === "needs_reauth" ? "needs_reauth"
              : c === "server_not_connected" ? "not_connected"
              : c === "selection_required" ? "choose"
              : "error";
    SP.err = e;
  }
  SP.probed = true;
  render();
}
const spCan = t => SP.status === "connected" && SP.tools.indexOf(t) >= 0;

/* Each error code has a different fix. Never collapse them into one banner. */
function spErr(e){
  const code = e && e.code;
  switch(code){
    case "needs_reauth":
      return { t:"Microsoft 365 needs reconnecting", d:"Reconnect it under claude.ai Settings → Connectors, then try again." };
    case "server_not_connected":
      return { t:"Microsoft 365 is not connected", d:"Add the Microsoft 365 connector under claude.ai Settings → Connectors." };
    case "selection_required":
      return { t:"Choose a Microsoft 365 account", d:"You have more than one connected. Pick one when prompted, then try again." };
    case "server_not_found":
      return { t:"That connector no longer exists", d:"Re-add Microsoft 365 under claude.ai Settings → Connectors." };
    case "blocked_by_policy":
      return { t:"Your organisation blocks this tool", d:"An administrator has disallowed it for your account." };
    case "approval_required":
      return { t:"This call needs approval", d:"Your organisation requires per-call approval, which a page cannot request yet." };
    case "not_in_manifest":
      return { t:"This page may not call that tool", d:"It is outside the access you approved for this page." };
    case "tool_error":
      return { t:"SharePoint refused the request", d:spToolErrorDetail(e) };
    case "server_unavailable":
      return { t:"SharePoint did not answer", d:"That is usually temporary. Try once more." };
    case "rate_limited":
      return { t:"Too many requests", d:"Wait a few seconds, then try again." };
    case "cancelled":
      return { t:"Cancelled", d:"The request was stopped. It may or may not have completed." };
    case "not_granted": case "capability_disabled": case "capability_removed":
      return { t:"Connectors are unavailable in this view", d:"Open the published page in claude.ai to reach SharePoint." };
    default:
      return { t:"SharePoint request failed", d:(e && e.message) || "Unknown error." };
  }
}
function spToolErrorDetail(e){
  let blob = (e && e.message) || "";
  try{ blob += " " + JSON.stringify(e && e.result); }catch(x){}
  if(/Files\.ReadWrite\.All|accessDenied|FORBIDDEN/i.test(blob)){
    return "Saving files into SharePoint needs the Files.ReadWrite.All permission, which a Microsoft 365 administrator has to consent to for the Claude connector. " +
           "Searching and reading work without it — so the text is indexed and searchable either way.";
  }
  if(/nameAlreadyExists|already exists/i.test(blob)) return "A file with that name is already there.";
  if(/quota/i.test(blob)) return "The document library is out of storage.";
  return (e && e.message) || "SharePoint reported a failure.";
}
const spRetryable = e => !!(e && e.retryable);

/* "untested" | "ok" | "blocked" — learned from real attempts, never assumed.
   A tool appearing in listTools() only means the connector exposes it; Graph
   can still refuse it for lack of an admin-consented permission. */
function spWriteState(){ return (S.sharepoint && S.sharepoint.writeState) || "untested"; }
function setSpWriteState(v){
  S.sharepoint = S.sharepoint || {};
  if(S.sharepoint.writeState !== v){
    S.sharepoint.writeState = v;
    logChange("settings", "sharepoint", "SharePoint saving", [{ f:"write access", from:"unknown", to:v }]);
  }
}
function spWriteNote(){
  const st = spWriteState();
  if(!spCan(SP_TOOLS.upload)) return "Saving files into SharePoint is not offered by this connector.";
  if(st === "ok") return "Saving originals into SharePoint works.";
  if(st === "blocked") return "Saving originals is blocked: it needs the Files.ReadWrite.All permission, which a Microsoft 365 administrator has to consent to. Reading and searching work without it.";
  return "Saving originals has not been tried yet. Many tenants block it until an administrator consents to Files.ReadWrite.All — the first attempt will tell us. Reading and searching work either way.";
}

/* The connector answers with several JSON objects one after another, not one
   array, so result.payload arrives as a string. Pull the objects out of it. */
function parseJsonStream(payload){
  if(payload == null) return [];
  if(Array.isArray(payload)) return payload;
  if(typeof payload === "object") return [payload];
  const s = String(payload);
  const out = [];
  let depth = 0, start = -1, inStr = false, esc = false;
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(inStr){
      if(esc) esc = false;
      else if(c === "\\") esc = true;
      else if(c === '"') inStr = false;
      continue;
    }
    if(c === '"'){ inStr = true; continue; }
    if(c === "{"){ if(!depth) start = i; depth++; }
    else if(c === "}"){
      depth--;
      if(depth === 0 && start >= 0){
        try{ out.push(JSON.parse(s.slice(start, i + 1))); }catch(x){}
        start = -1;
      }
    }
  }
  return out;
}
/* search snippets come back with <c0> highlight tags and <ddd/> ellipses */
function spClean(t){
  return String(t || "")
    .replace(/<ddd\/>/g, " … ")
    .replace(/<\/?c\d+>/g, "")
    .replace(/<[^>]+>/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function spPath(webUrl){
  try{
    const u = decodeURIComponent(String(webUrl || ""));
    const m = u.match(/sharepoint\.com\/(?:sites\/[^/]+\/)?(.*)$/);
    let p = m ? m[1] : u;
    p = p.replace(/^Shared%20Documents\//, "").replace(/^Shared Documents\//, "");
    const parts = p.split("/");
    parts.pop();
    return parts.join(" / ");
  }catch(e){ return ""; }
}

/* ---------- searching ---------- */
async function spSearchFor(query, orgId, opts){
  opts = opts || {};
  if(!spCan(SP_TOOLS.search)){
    const c = spErr({ code: SP.status === "not_connected" ? "server_not_connected"
                          : SP.status === "needs_reauth" ? "needs_reauth"
                          : SP.status === "unavailable" ? "not_granted" : "upstream_error" });
    say("**" + c.t + ".** " + c.d);
    return finishTurn();
  }
  SPUI.busy = true; SPUI.err = null;
  say("Searching SharePoint for **" + esc(query) + "**…");
  render();
  const input = { query: query, limit: opts.limit || 8 };
  if(opts.fileType) input.fileType = opts.fileType;
  let res = null, err = null;
  try{
    res = await MCP.callTool(SP_SERVER, SP_TOOLS.search, input, { cache:{ staleTime:60000 } });
  }catch(e1){
    if(spRetryable(e1)){
      await new Promise(r => setTimeout(r, 600 + Math.floor(Math.random() * 400)));
      try{ res = await MCP.callTool(SP_SERVER, SP_TOOLS.search, input); }catch(e2){ err = e2; }
    } else err = e1;
  }
  SPUI.busy = false;
  CHAT.msgs = CHAT.msgs.filter(m => !(m.k === "text" && m.d.text.indexOf("Searching SharePoint for") === 0));
  if(err){
    const c = spErr(err);
    say("**" + c.t + ".** " + c.d);
    return finishTurn();
  }
  const rows = parseJsonStream(res && res.payload)
    .filter(r => r && r.name && r.uri)
    .map(r => ({
      rid: uid("sp"), name: r.name, uri: r.uri, driveId: r.driveId, itemId: r.id,
      webUrl: r.webUrl, snippet: spClean(r.content || r.summary), modified: r.lastModifiedDateTime,
      orgId: orgId || null
    }));
  if(!rows.length){
    say("Nothing in SharePoint matched **" + esc(query) + "**.");
    return finishTurn();
  }
  CHAT.sp = CHAT.sp || {};
  rows.forEach(r => { CHAT.sp[r.rid] = r; });
  const stamp = res && res.cache && res.cache.storedAt;
  push("as", "spresults", {
    q: query, orgId: orgId || null,
    lead: "**" + rows.length + "** file" + (rows.length === 1 ? "" : "s") + " in SharePoint matching “" + query + "”" +
          (stamp ? " · from a cached read" : ""),
    rids: rows.map(r => r.rid)
  });
  finishTurn();
}

/* ---------- attaching a SharePoint file to an account ---------- */
async function spAttach(rid, alsoIndex){
  const row = (CHAT.sp || {})[rid];
  if(!row) return;
  let orgId = row.orgId;
  if(!orgId){
    CHAT.pending = { kind:"spOrg", fields:{ rid, alsoIndex:alsoIndex !== false }, slot:"account" };
    say("Which account should **" + esc(row.name) + "** be filed against?",
        S.orgs.filter(o => !o.archived).slice(0, 6).map(o => o.name));
    return finishTurn();
  }
  await spAttachTo(row, orgId, alsoIndex !== false, false);
}
async function spAttachTo(row, orgId, alsoIndex, createdOrg){
  const o = org(orgId);
  const existing = (S.docs || []).find(d => d.spItemId && d.spItemId === row.itemId && d.orgId === orgId);
  if(existing){
    say("**" + esc(row.name) + "** is already filed against **" + o.name + "**.");
    return finishTurn();
  }
  const kind = detectDocKind(row.snippet || "", row.name);
  const d = addDoc({
    name: row.name, kind, size: null, orgId: orgId, locationId: null, scope: "account",
    link: row.webUrl, spUri: row.uri, spDriveId: row.driveId, spItemId: row.itemId,
    text: row.snippet || "", source: "SharePoint"
  });
  logChange("doc", d.id, d.name, [{ f:"linked from SharePoint", from:"—", to:o.name }]);
  let indexed = false, indexErr = null;
  if(alsoIndex && spCan(SP_TOOLS.read)){
    try{
      const r = await MCP.callTool(SP_SERVER, SP_TOOLS.read, { uri: row.uri, startPage: 1, endPage: 6 },
        { cache:{ staleTime:60000 } });
      let txt = r && r.payload;
      if(txt && typeof txt === "object") txt = JSON.stringify(txt);
      txt = String(txt || "").replace(/\[pages[^\]]*\]\s*$/, "").trim();
      if(txt.length > 40){
        d.text = txt.slice(0, SP_TEXT_CAP);
        d.truncated = txt.length > SP_TEXT_CAP;
        indexed = true;
      }
    }catch(e){ indexErr = e; }
  }
  push("as", "saved", {
    text: "Filed **" + d.name + "** (" + d.kind + ") against **" + o.name + "**, linked to the original in SharePoint." +
          (createdOrg ? " I created that account too." : "") +
          (indexed ? " Its full text is indexed — try “search documents for termination”."
                   : indexErr ? " I could not read its text (" + spErr(indexErr).t.toLowerCase() + "), so only the search snippet is stored."
                   : " Only the search snippet is stored as text."),
    link: { type:"company", id:o.id, name:o.name, view:"orgs" }
  });
  saveChat(); render(); save();
}

/* ---------- sending an original up to SharePoint ---------- */
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("read failed"));
    fr.onload = () => {
      const s = String(fr.result || "");
      const i = s.indexOf(",");
      resolve(i >= 0 ? s.slice(i + 1) : s);
    };
    fr.readAsDataURL(file);
  });
}
/* Returns {ok,webUrl} | {skipped:reason} | {err}. The success path has not been
   exercised against a live tenant: this connector's writes require
   Files.ReadWrite.All, which was denied when built. */
async function spUploadOriginal(file, ctx){
  ctx = ctx || {};
  if(!spCan(SP_TOOLS.upload)) return { skipped:"unavailable" };
  if(!S.sharepoint || !S.sharepoint.driveId) return { skipped:"no-target" };
  if(file.size > SP_UPLOAD_CAP) return { skipped:"too-big" };
  let b64;
  try{ b64 = await fileToBase64(file); }catch(e){ return { skipped:"unreadable" }; }

  /* put it in the folder for its type, creating the path if needed */
  const path = spPlannedPath(ctx.kind || "Other", ctx.orgName || null);
  let target = { driveId:S.sharepoint.driveId, itemId:S.sharepoint.itemId || null, name:S.sharepoint.name };
  let pathNote = "";
  const ep = await spEnsurePath(path);
  if(ep.folder){ target = ep.folder; pathNote = path; }
  else if(ep.err) return { err:ep.err, wanted:path };
  else return { blockedPath:path, reason:ep.blocked };

  try{
    const r = await MCP.callTool(SP_SERVER, SP_TOOLS.upload, {
      driveId: target.driveId,
      parentItemId: target.itemId || null,
      filename: file.name,
      contentBase64: b64,
      conflictBehavior: "rename"
    });
    const p = parseJsonStream(r && r.payload)[0] || {};
    setSpWriteState("ok");
    return { ok:true, webUrl:p.webUrl || null, itemId:p.id || null, uri:p.uri || null, path:pathNote };
  }catch(e){
    let blob = (e && e.message) || "";
    try{ blob += " " + JSON.stringify(e && e.result); }catch(x){}
    if(e && e.code === "tool_error" && /Files\.ReadWrite\.All|accessDenied|FORBIDDEN/i.test(blob)) setSpWriteState("blocked");
    return { err:e };
  }
}

/* ---------- assistant intents ---------- */
function trySharePoint(text){
  let m = text.match(/^\s*(?:search|find|look\s+in|check)\s+(?:in\s+)?(?:sharepoint|share\s?point|onedrive)\s*(?:for|:)?\s*(.+)$/i);
  if(m){ spSearchFor(m[1].trim(), null, {}); return true; }

  m = text.match(/^\s*(?:find|pull|get|fetch|import)\s+(?:the\s+)?(?:agreements?|msas?|contracts?|documents?|paperwork|files?|sows?|exhibits?)\s+(?:for|at|from)\s+(.+?)\s*$/i);
  if(m){
    const nameQ = m[1].trim().replace(/\s+(?:in|from)\s+share\s?point$/i, "");
    const o = findOrgByName(nameQ);
    if(!o){
      say("I have no account called **" + esc(nameQ) + "**. Add it first, then I can file SharePoint documents against it.");
      return true;
    }
    spSearchFor(o.name, o.id, { limit:10 });
    return true;
  }
  if(/^\s*(?:set\s*up|create|make|build)\s+(?:the\s+)?(?:sharepoint\s+)?(?:document\s+)?folders?\b/i.test(text)){
    spSetUpFolders(); return true;
  }
  m = text.match(/^\s*(?:set|choose|pick)\s+(?:the\s+)?(?:sharepoint\s+)?(?:folder|destination|upload folder)\s*(?:to|:)?\s*(.+)$/i);
  if(m){ spPickFolder(m[1].trim()); return true; }

  if(/^\s*(?:sharepoint|share\s?point)\s+status\s*\??$/i.test(text)){
    const s = SP.status;
    const line = s === "connected" ? "Connected. I can search SharePoint and read document text. " + spWriteNote()
      : s === "not_connected" ? "Not connected. Add the Microsoft 365 connector under claude.ai Settings → Connectors."
      : s === "needs_reauth" ? "Connected but the sign-in lapsed. Reconnect it under claude.ai Settings → Connectors."
      : s === "choose" ? "You have more than one Microsoft 365 connector. Pick one when prompted."
      : s === "unavailable" ? "Connectors are not available in this view. Open the published page in claude.ai."
      : "I could not work out the connector state.";
    say("**Microsoft 365 / SharePoint:** " + line +
        (S.sharepoint ? "\n\nOriginals are set to save to **" + S.sharepoint.name + "**." : ""));
    return true;
  }
  return false;
}

/* ============================================================
   DOCUMENT FILING
   One folder per document type. Account paperwork also gets an
   account subfolder; resumes sit in one Resumes folder.

     Resumes/
     MSAs/<Account>/            Exhibits/<Account>/
     SOWs/<Account>/            NDAs/<Account>/
     Right to Represent/<Account>/
     Rate Sheets/<Account>/     Purchase Orders/<Account>/
     Other Documents/<Account>/

   Creating these needs write access to SharePoint. Until an
   administrator consents to Files.ReadWrite.All the scheme still
   governs how documents are organised inside the workspace, and
   folder creation reports exactly what is blocking it.
   ============================================================ */
const SP_FOLDER = {
  "Resume":"Resumes", "MSA":"MSAs", "SOW":"SOWs", "Exhibit":"Exhibits",
  "NDA":"NDAs", "RTR":"Right to Represent", "Rate sheet":"Rate Sheets",
  "PO":"Purchase Orders", "Other":"Other Documents"
};
const spFolderFor = kind => SP_FOLDER[kind] || SP_FOLDER.Other;
/* resumes are about a person, not an account, so they do not get an account subfolder */
const spNeedsAccountFolder = kind => kind !== "Resume";
function spPlannedPath(kind, orgNm){
  const top = spFolderFor(kind);
  return (spNeedsAccountFolder(kind) && orgNm) ? top + "/" + orgNm : top;
}

/* Find an existing child folder by name under a known parent, using the
   folder search (clean JSON) rather than parsing a folder listing — that
   listing is a display string with no delimiter between entries. */
async function spFindChildFolder(name, parent){
  if(!spCan(SP_TOOLS.folders)) return null;
  let res;
  try{
    res = await MCP.callTool(SP_SERVER, SP_TOOLS.folders, { name:name, limit:25 }, { cache:{ staleTime:30000 } });
  }catch(e){ return null; }
  const wantBase = String(parent.webUrl || "").replace(/\/+$/, "");
  const rows = parseJsonStream(res && res.payload).filter(r => r && r.name && r.driveId);
  return rows.find(r =>
    r.driveId === parent.driveId &&
    String(r.name).toLowerCase() === String(name).toLowerCase() &&
    (!wantBase || String(r.webUrl || "").replace(/\/+$/, "").toLowerCase() === (wantBase + "/" + name).toLowerCase())
  ) || null;
}
/* Resolve (and create when missing) one level. Returns {folder} | {err} | {blocked} */
async function spEnsureFolder(name, parent){
  const found = await spFindChildFolder(name, parent);
  if(found) return { folder:{ driveId:found.driveId, itemId:found.id, name:found.name, webUrl:found.webUrl }, created:false };
  if(!spCan(SP_TOOLS.create)) return { blocked:"no-tool" };
  if(spWriteState() === "blocked") return { blocked:"permission" };
  try{
    const r = await MCP.callTool(SP_SERVER, SP_TOOLS.create, {
      driveId: parent.driveId, parentItemId: parent.itemId || null, name: name, conflictBehavior: "rename"
    });
    const p = parseJsonStream(r && r.payload)[0] || {};
    setSpWriteState("ok");
    return { folder:{ driveId: p.driveId || parent.driveId, itemId: p.id || null, name: p.name || name, webUrl: p.webUrl || null }, created:true };
  }catch(e){
    let blob = (e && e.message) || "";
    try{ blob += " " + JSON.stringify(e && e.result); }catch(x){}
    if(e && e.code === "tool_error" && /Files\.ReadWrite\.All|accessDenied|FORBIDDEN/i.test(blob)) setSpWriteState("blocked");
    return { err:e };
  }
}
/* Walk a slash-separated path from the destination root. */
async function spEnsurePath(path){
  if(!S.sharepoint || !S.sharepoint.driveId) return { blocked:"no-target" };
  let parent = { driveId:S.sharepoint.driveId, itemId:S.sharepoint.itemId || null,
                 name:S.sharepoint.name, webUrl:S.sharepoint.webUrl };
  const made = [];
  for(const seg of String(path).split("/").filter(Boolean)){
    const r = await spEnsureFolder(seg, parent);
    if(r.blocked) return { blocked:r.blocked, reached:parent, remaining:seg };
    if(r.err) return { err:r.err, reached:parent, remaining:seg };
    if(r.created) made.push(r.folder.name);
    parent = r.folder;
  }
  return { folder:parent, made:made };
}

/* Create the whole scheme up front. Reports precisely what blocked it. */
async function spSetUpFolders(){
  if(!S.sharepoint || !S.sharepoint.driveId){
    say("Tell me where first — “set the sharepoint folder to <name>”, then I can build the structure inside it.");
    return finishTurn();
  }
  const wanted = [];
  Object.keys(SP_FOLDER).forEach(k => { const f = SP_FOLDER[k]; if(wanted.indexOf(f) < 0) wanted.push(f); });
  say("Setting up document folders in **" + esc(S.sharepoint.name) + "**…");
  render();
  const made = [], existed = [], failed = [];
  let blockErr = null;
  for(const name of wanted){
    const r = await spEnsurePath(name);
    if(r.folder && r.made && r.made.length) made.push(name);
    else if(r.folder) existed.push(name);
    else { failed.push(name); blockErr = blockErr || r; }
  }
  CHAT.msgs = CHAT.msgs.filter(m => !(m.k === "text" && m.d.text.indexOf("Setting up document folders") === 0));
  let out = "";
  if(made.length)   out += "Created " + made.map(n => "**"+n+"**").join(", ") + ". ";
  if(existed.length) out += "Already there: " + existed.map(n => "**"+n+"**").join(", ") + ". ";
  if(failed.length){
    const why = blockErr && blockErr.err ? spErr(blockErr.err).d
      : blockErr && blockErr.blocked === "permission"
        ? "Creating folders needs the Files.ReadWrite.All permission, which a Microsoft 365 administrator has to consent to for the Claude connector."
      : blockErr && blockErr.blocked === "no-tool"
        ? "This connector does not offer folder creation."
      : "I could not create them.";
    out += "\n\nI could not create " + failed.length + " folder" + (failed.length===1?"":"s") + " — " + why +
           "\n\nThe scheme still applies inside this workspace: every document is filed by type, and the type each one belongs to is shown against it. " +
           "You can also create these by hand in **" + S.sharepoint.name + "** and I will use them:\n\n" +
           failed.map(n => "· " + n).join("\n");
  }
  say(out || "Nothing to do.");
  render(); save();
}

function renderDoc(state){

  const src = document.getElementById("app-src").textContent;
  const json = JSON.stringify(state)
    .replace(/</g, "\\u003c")
    .replace(/\u2028/g, "\\u2028")
    .replace(/\u2029/g, "\\u2029");
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<title>TS Workspace</title>'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">'+
