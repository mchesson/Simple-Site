  home: "Desk", accounts: "Accounts", account: "Account", location: "Site",
  contacts: "Contacts", contact: "Contact", projects: "Projects", project: "Project",
  documents: "Documents", pos: "Purchase orders", timesheet: "My week",
  approvals: "Approvals", invoices: "Invoices", invoice: "Invoice",
  unlocks: "Unlock requests", audit: "Audit trail",
  pipeline: "Pipeline", submission: "Submission", interviews: "Interviews",
};

const UI = { view: "home", sel: null, week: null, who: null,
             auditFilter: {}, drawer: false, desk: null };

function section(title, kids) {
  const body = kids.flat().filter(Boolean).filter((n) => {
    const tb = n.querySelector ? n.querySelector("tbody") : null;
    return !tb || tb.children.length > 0;
  });
  if (!body.length) return null;
  return el("div", { style: "margin:18px 0" },
    el("div", { class: "navsec", style: "padding-left:0" }, title), ...body);
}
const roleChips = (c) => contactRoles(c).map((r) =>
  el("span", { class: "pill", style: "margin-right:5px" }, r));
const cell = (k, v, sub, neg) => el("div", {},
  el("div", { class: "k" }, k),
  el("div", { class: "v" + (neg ? " neg" : "") }, v),
  sub ? el("div", { class: "meta", style: "font-size:11.5px" }, sub) : null);

/* -------------------------------------------------------------------- home
 *
 * The desk. Sales and recruiting are the two jobs that bring work in and find
 * the people to do it, so this page is written for them: not a dashboard of
 * totals, but a short list of things that need a human today, each one a click
 * from the record and from logging what you did about it.
 */

const SALES_ROLES = ["account_manager", "admin"];

function homeView() {
  const me = actingUser();
  const desk = UI.desk || (SALES_ROLES.includes(me.role) ? "sales" : "recruiting");
  // An admin runs the whole business, so they see everything by default. Everyone
  // else starts with their own and can widen.
  const mineOnly = UI.scope === undefined || UI.scope === null
    ? me.role !== "admin" : UI.scope === "mine";

  const seg = (items, current, set) => el("div", { class: "deskswitch" },
    ...items.map(([k, label]) => el("button",
      { class: "seg" + (current === k ? " on" : ""), onclick: () => { set(k); render(); } },
      label)));

  return el("div", { class: "pane" },
    el("div", { class: "deskhead" },
      el("div", {},
        el("h2", { class: "dtitle" },
          desk === "sales" ? "Accounts" : "Your desk"),
        el("p", { class: "dsub" },
          `${me.name} · ` + (desk === "sales"
            ? "what needs a call, and what is at risk"
            : "seats to fill, people to chase, and who is coming free"))),
      el("div", { class: "segs" },
        seg([["mine", "Mine"], ["all", "Everyone"]], mineOnly ? "mine" : "all",
            (k) => { UI.scope = k; }),
        seg([["recruiting", "Recruiting"], ["sales", "Sales"]], desk,
            (k) => { UI.desk = k; }))),
    desk === "sales" ? salesDesk(me, mineOnly) : recruitingDesk(me, mineOnly),
    el("details", { class: "tourbox" },
      el("summary", {}, "How the whole cycle works, end to end"),
      tourSteps()));
}

/* A row that a person can act on: what it is, why it matters now, and a way to
 * record what you did. */
function actionRow(cells, opts = {}) {
  return el("tr", { class: opts.urgent ? "urgent" : null,
                    style: opts.onclick ? "cursor:pointer" : null,
                    onclick: opts.onclick || null }, ...cells);
}

function logButton(label, { contactId, accountId = null, projectId = null,
                            kind = "call", prompt: question }) {
  return el("button", { class: "linkbtn", onclick: (e) => {
    e.stopPropagation();
    const body = prompt(question || "What happened?");
    if (!body) return;
    try { logActivity({ contactId, accountId, projectId, kind, body }); commit(); render(); }
    catch (err) { alert(err.message); }
  } }, label);
}

const ageChip = (n, warnAt, unit = "d") => {
  if (n === null || n === undefined) return el("span", { class: "pill bad" }, "never");
  return el("span", { class: "pill" + (n >= warnAt ? " bad" : n >= warnAt / 2 ? " warn" : "") },
    n + unit);
};

/* ------------------------------------------------------------- recruiting */

function recruitingDesk(me, mineOnly) {
  const who = mineOnly ? me.id : null;
  const seats = seatsToFill(who);
  const waiting = waitingOnClient(who);
  const cold = goingCold(14, who);
  const off = rollingOff(60).filter((r) => !mineOnly ||
    r.placement.recruiterId === me.id);
  const pipes = mineOnly ? myPipelines(me.id)
    : S.pipelines.map((pl) => myPipelines(pl.ownerId)).flat()
        .filter((pl, i, a) => a.findIndex((x) => x.id === pl.id) === i);
  const noSubs = seats.filter((r) => r.submitted === 0);
  const nothing = !seats.length && !waiting.length && !cold.length && !off.length;

  const coming = upcomingInterviews(14, who);
  const noWriteUp = interviewsAwaitingFeedback(who);

  const kpi = (k, v, sub, tone, onclick) => el(onclick ? "button" : "div",
    { class: "kpi" + (tone ? " " + tone : "") + (onclick ? " clickable" : ""),
      onclick: onclick || null },
    el("div", { class: "k" }, k), el("div", { class: "v" }, v),
    sub ? el("div", { class: "meta", style: "font-size:11.5px" }, sub) : null);

  return el("div", {},
    el("div", { class: "kpis" },
      kpi("Seats to fill", sum(seats, (r) => r.open),
          `${seats.length} project${seats.length === 1 ? "" : "s"}`),
      kpi("Nobody submitted", noSubs.length, "no candidate out yet",
          noSubs.length ? "alarm" : null),
      kpi("With the client", waiting.length,
          waiting.length ? `oldest ${waiting[0].waiting} days` : "nothing out",
          null, () => go("pipeline")),
      kpi("Interviews booked", coming.length,
          coming.length ? "next " + new Date(coming[0].scheduledAt).toLocaleDateString(
            undefined, { month: "short", day: "numeric" }) : "none this fortnight",
          null, () => go("interviews")),
      kpi("No write-up", noWriteUp.length, "interviews with no outcome",
          noWriteUp.length ? "alarm" : null, () => go("interviews")),
      kpi("Going quiet", cold.length, "no contact in 14 days",
          cold.length ? "alarm" : null),
      kpi("Coming free", off.length, "within 60 days")),

    noWriteUp.length
      ? deskSection("Interviews nobody has written up",
          "Until somebody records what was said, the submission cannot move. This is " +
          "the quietest way a placement is lost.",
          el("table", { class: "grid" },
            el("thead", {},
              el("tr", {}, ...["Candidate", "Where", "When", "Waiting", ""]
                .map((h) => el("th", {}, h)))),
            el("tbody", {}, ...noWriteUp.map((r) => actionRow([
              el("td", {}, el("strong", {}, r.sub.contact.fullName)),
              el("td", { class: "muted" },
                `${r.sub.account ? r.sub.account.name : ""} · ${r.sub.project.name}`),
              el("td", { class: "muted" }, new Date(r.scheduledAt).toLocaleDateString(
                undefined, { weekday: "short", month: "short", day: "numeric" })),
              el("td", {}, ageChip(r.daysAgo, 3)),
              el("td", {}, el("button", { class: "linkbtn", onclick: (e) => {
                e.stopPropagation(); outcomeFlow(r.id);
              } }, "Record it")),
            ], { urgent: r.daysAgo >= 3,
                 onclick: () => go("submission", r.sub.id) })))))
      : null,

    nothing && mineOnly
      ? el("div", { class: "banner" },
          el("b", {}, "Nothing on your desk. "),
          "That may be because these records are owned by somebody else — " +
          "switch to Everyone above to see the whole business.")
      : null,

    deskSection("Seats to fill", "Least covered first — no submissions is the " +
      "one that loses the req.", seats.length
      ? el("table", { class: "grid" },
          el("thead", {}, el("tr", {}, ...["Project", "Account", "Open", "Out",
            "Delivery", ""].map((h) => el("th", {}, h)))),
          el("tbody", {}, ...seats.map((r) => actionRow([
            el("td", {}, el("strong", {}, r.project.name)),
            el("td", { class: "muted" }, r.account ? r.account.name : "—"),
            el("td", { class: "num" }, r.open),
            el("td", {}, r.submitted
              ? el("span", { class: "num" }, r.submitted)
              : el("span", { class: "pill bad" }, "none")),
            el("td", { class: "muted" }, r.project.deliveryType.replace(/_/g, " ")),
            el("td", { class: "muted" }, (r.project.skills || []).slice(0, 3).join(", ")),
          ], { urgent: r.submitted === 0,
               onclick: () => go("project", r.project.id) })))
        )
      : el("p", { class: "muted" }, "Every open seat has a consultant on it.")),

    deskSection("Waiting on the client",
      "Days since the stage last moved. The old ones need a phone call, not an email.",
      waiting.length
      ? el("table", { class: "grid" },
          el("thead", {}, el("tr", {}, ...["Candidate", "Project", "Stage", "Waiting",
            "Rate", ""].map((h) => el("th", {}, h)))),
          el("tbody", {}, ...waiting.map((r) => actionRow([
            el("td", {}, el("strong", {}, r.contact.fullName)),
            el("td", { class: "muted" },
              `${r.account ? r.account.name : ""} · ${r.project.name}`),
            el("td", {}, el("span", { class: "pill" }, STAGE_LABEL[r.stage] || r.stage)),
            el("td", {}, ageChip(r.waiting, 7)),
            el("td", { class: "num" }, r.billRate ? money2(r.billRate) : "—"),
            el("td", {}, logButton("Log a chase", { contactId: r.contact.id,
              projectId: r.project.id,
              prompt: `What did ${r.account ? r.account.name : "the client"} say about ` +
                      `${r.contact.fullName}?` })),
          ], { urgent: r.waiting >= 7,
               onclick: () => go("contact", r.contact.id) })))
        )
      : el("p", { class: "muted" }, "Nothing is sitting with a client.")),

    deskSection("Going quiet",
      "In play — submitted or on a shortlist — and nobody has spoken to them.",
      cold.length
      ? el("table", { class: "grid" },
          el("thead", {}, el("tr", {}, ...["Candidate", "Headline", "Last contact",
            "Recruiter", ""].map((h) => el("th", {}, h)))),
          el("tbody", {}, ...cold.map((r) => actionRow([
            el("td", {}, el("strong", {}, r.contact.fullName),
              r.contact.onPayroll
                ? el("span", { class: "pill good", style: "margin-left:6px" },
                    "on payroll") : null),
            el("td", { class: "muted" }, r.contact.headline || ""),
            el("td", {}, ageChip(r.quiet, 21)),
            el("td", { class: "muted" },
              (byId("users", r.contact.recruiterId) || {}).name || "house"),
            el("td", {}, logButton("Log a call", { contactId: r.contact.id,
              prompt: `What did ${r.contact.fullName} say?` })),
          ], { urgent: (r.quiet ?? 999) >= 21,
               onclick: () => go("contact", r.contact.id) })))
        )
      : el("p", { class: "muted" }, "Everyone in play has been spoken to recently.")),

    deskSection("Coming free",
      "Assignments ending. Each one is a redeployment now and a gap on the " +
      "account if nobody moves.", off.length
      ? el("table", { class: "grid" },
          el("thead", {}, el("tr", {}, ...["Consultant", "Leaving", "Ends", "Days",
            ""].map((h) => el("th", {}, h)))),
          el("tbody", {}, ...off.map((r) => actionRow([
            el("td", {}, el("strong", {}, r.contact.fullName)),
            el("td", { class: "muted" },
              `${r.account ? r.account.name : ""} · ${r.project.name}`),
            el("td", { class: "muted" }, day(r.placement.endDate)),
            el("td", {}, ageChip(r.left, 30)),
            el("td", {}, logButton("Log a redeployment call",
              { contactId: r.contact.id,
                prompt: `What is ${r.contact.fullName} looking for next?` })),
          ], { urgent: r.left <= 30, onclick: () => go("contact", r.contact.id) })))
        )
      : el("p", { class: "muted" }, "Nobody rolls off in the next two months.")),

    deskSection("Your pipelines",
      "People you have set aside, so you do not search for them twice.",
      pipes.length
      ? el("div", { class: "pipegrid" }, ...pipes.map((pl) =>
          el("div", { class: "card" },
            el("h3", {}, pl.name,
              !mineOnly && pl.ownerId !== me.id
                ? el("span", { class: "muted", style: "font-weight:400" },
                    " · " + ((byId("users", pl.ownerId) || {}).name || ""))
                : null),
            pl.notes ? el("div", { class: "meta" }, pl.notes) : null,
            el("div", { class: "pipemembers" }, ...pl.members.map((m) =>
              el("button", { class: "chip",
                onclick: () => go("contact", m.contact.id) },
                m.contact.fullName,
                m.note ? el("span", {}, " · " + m.note) : null))))))
      : el("p", { class: "muted" },
          "You have no pipelines yet. Tag people from a contact record.")));
}

/* ----------------------------------------------------------------- sales */

function salesDesk(me, mineOnly) {
  const scope = mineOnly ? ownedBy(me.id) : activeAccounts();
  const scopeIds = new Set(scope.map((a) => a.id));
  const inScope = (accountId) => scopeIds.has(accountId);

  const quiet = quietAccounts(21).filter((q) => inScope(q.account.id));
  const gaps = agreementGaps().filter((g) => inScope(g.account.id));
  const expiringPos = poBurndown().filter((p) => {
    const project = byId("projects", p.projectId);
    return project && inScope(project.accountId) &&
      p.daysRemaining !== null && p.daysRemaining <= 90;
  });
  const off = rollingOff(60).filter((r) => r.account && inScope(r.account.id));
  const unstaffed = seatsToFill().filter((r) =>
    r.submitted === 0 && r.account && inScope(r.account.id));
  const prospects = activeAccounts().filter((a) => inScope(a.id) &&
    (a.status === "prospect" || !where("accountOwners", (o) => o.accountId === a.id).length));

  /* One merged list, because a salesperson does not think in categories - they
   * think about who to ring and why. */
  const calls = [
    ...quiet.map((q) => ({
      why: "Gone quiet", detail: `no contact for ${q.quiet ?? "ever"} days` +
        (q.openProjects ? ` · ${q.openProjects} open project(s)` : ""),
      account: q.account, urgency: (q.quiet ?? 999), urgent: (q.quiet ?? 999) >= 30 })),
    ...gaps.map((g) => ({
      why: g.expired ? "Agreement lapsed" : "No agreement",
      detail: g.expired
        ? `MSA ran out ${day(g.msa.effectiveTo)}` +
          (g.openProjects ? ` and there ${g.openProjects === 1 ? "is" : "are"} ` +
            `${g.openProjects} open project(s)` : "")
        : "nothing signed, so we cannot staff it",
      account: g.account, urgency: 500 + g.openProjects * 100, urgent: true })),
    ...expiringPos.map((p) => ({
      why: p.projectedRemaining < 0 ? "PO over-committed" : "PO expiring",
      detail: `${p.poNumber} · ${money(p.remaining)} left · ` +
        `${p.daysRemaining} days` +
        (p.projectedRemaining < 0
          ? ` · already ${money(Math.abs(p.projectedRemaining))} past it` : ""),
      account: byId("accounts", (byId("projects", p.projectId) || {}).accountId),
      projectId: p.projectId,
      urgency: 400 - p.daysRemaining, urgent: p.daysRemaining <= 45 ||
        p.projectedRemaining < 0 })),
    ...off.map((r) => ({
      why: "Assignment ending", detail: `${r.contact.fullName} on ${r.project.name} ` +
        `ends ${day(r.placement.endDate)} · ${r.left} days`,
      account: r.account, contactId: r.contact.id, projectId: r.project.id,
      urgency: 300 - r.left, urgent: r.left <= 30 })),
  ].filter((c) => c.account).sort((a, b) => b.urgency - a.urgency);

  const weekly = sum(scope, (a) => runRate(a.id));
  const kpi = (k, v, sub, tone) => el("div", { class: "kpi" + (tone ? " " + tone : "") },
    el("div", { class: "k" }, k), el("div", { class: "v" }, v),
    sub ? el("div", { class: "meta", style: "font-size:11.5px" }, sub) : null);

  return el("div", {},
    el("div", { class: "kpis" },
      kpi(mineOnly ? "Your accounts" : "Accounts", scope.length,
          `${scope.filter((a) => a.status === "active").length} active`),
      kpi("Margin a week", money(weekly), "at today's rates"),
      kpi("Reasons to call", calls.length,
          calls.filter((c) => c.urgent).length + " urgent",
          calls.some((c) => c.urgent) ? "alarm" : null),
      kpi("Paperwork gaps", gaps.length, "cannot staff without it",
          gaps.length ? "alarm" : null),
      kpi("Unstaffed projects", unstaffed.length, "nobody submitted",
          unstaffed.length ? "alarm" : null)),

    !scope.length
      ? el("div", { class: "banner" },
          el("b", {}, "You do not own any accounts. "),
          "Switch to Everyone above to work the whole book.")
      : null,

    deskSection("Reasons to call", "Ranked by how much it costs to leave it.",
      calls.length
      ? el("table", { class: "grid" },
          el("thead", {}, el("tr", {}, ...["Account", "Why now", "Detail", ""]
            .map((h) => el("th", {}, h)))),
          el("tbody", {}, ...calls.map((c) => {
            const manager = where("contacts", (x) => x.accountId === c.account.id &&
              x.isManager && !x.archivedAt)[0];
            return actionRow([
              el("td", {}, el("strong", {}, c.account.name)),
              el("td", {}, el("span", { class: "pill" + (c.urgent ? " bad" : " warn") },
                c.why)),
              el("td", { class: "muted" }, c.detail),
              el("td", {}, manager
                ? logButton("Log a call", { contactId: c.contactId || manager.id,
                    accountId: c.account.id, projectId: c.projectId || null,
                    prompt: `What did ${manager.fullName} at ${c.account.name} say?` })
                : el("span", { class: "muted" }, "no contact on file")),
            ], { urgent: c.urgent, onclick: () => go("account", c.account.id) });
          }))
        )
      : el("p", { class: "muted" }, "Nothing needs chasing today.")),

    deskSection("Projects nobody is working on",
      "Open on your accounts with no candidate submitted. This is how an account " +
      "quietly goes elsewhere.", unstaffed.length
      ? el("table", { class: "grid" },
          el("thead", {}, el("tr", {}, ...["Project", "Account", "Seats", "Delivery",
            "Skills"].map((h) => el("th", {}, h)))),
          el("tbody", {}, ...unstaffed.map((r) => actionRow([
            el("td", {}, el("strong", {}, r.project.name)),
            el("td", { class: "muted" }, r.account.name),
            el("td", { class: "num" }, r.open),
            el("td", { class: "muted" }, r.project.deliveryType.replace(/_/g, " ")),
            el("td", { class: "muted" }, (r.project.skills || []).join(", ")),
          ], { urgent: true, onclick: () => go("project", r.project.id) })))
        )
      : el("p", { class: "muted" }, "Every open project has a resource out for it.")),

    deskSection("Where the money is",
      "Live consultants and what each account is worth a week in gross margin.",
      el("table", { class: "grid" },
        el("thead", {}, el("tr", {}, ...["Account", "Status", "Open projects",
          "Working", "Margin a week"].map((h) => el("th", {}, h)))),
        el("tbody", {}, ...scope.map((a) => {
          const projects = projectsOf(a.id);
          const working = sum(projects, (p) => activePlacements(p.id).length);
          return actionRow([
            el("td", {}, el("strong", {}, a.name)),
            el("td", {}, el("span", { class: "pill" }, a.status.replace(/_/g, " "))),
            el("td", { class: "num" },
              projects.filter((p) => p.status === "open").length),
            el("td", { class: "num" }, working),
            el("td", { class: "num" }, money(runRate(a.id))),
          ], { onclick: () => go("account", a.id) });
        }))
      )),

    prospects.length
      ? deskSection("Prospects to work",
          "No owner, or no agreement yet.",
          el("table", { class: "grid" }, el("tbody", {},
            ...prospects.map((a) => actionRow([
              el("td", {}, el("strong", {}, a.name)),
              el("td", { class: "muted" }, a.industry || ""),
              el("td", {}, where("accountOwners", (o) => o.accountId === a.id).length
                ? el("span", { class: "muted" }, "owned")
                : el("span", { class: "pill warn" }, "unassigned")),
            ], { onclick: () => go("account", a.id) })))))
      : null);
}

function deskSection(title, blurb, body) {
  if (!body) return null;
  return el("div", { class: "desksec" },
    el("div", { class: "navsec", style: "padding-left:0" }, title),
    blurb ? el("p", { class: "secblurb" }, blurb) : null,
    body);
}

/* The cycle walkthrough, kept but folded away - it is for learning the product,
 * not for running a desk. */
function tourSteps() {
  const step = (title, body, label, go2) => el("li", {},
    el("b", {}, title), el("span", {}, body),
    label ? el("button", { onclick: go2 }, label) : null);
  return el("div", {},
    el("p", { class: "muted", style: "margin:10px 0 14px" },
      "Everything Technical Source does is project-based work. Here is the whole " +
      "chain, from a resource need to money in the bank."),
    el("ol", { class: "steps-list" },
      step("Fill in a week and split a day",
        "Marcus is on two Globex projects, so his Tuesday splits between them.",
        "Open my week", () => go("timesheet")),
      step("Submit it, and see it fork",
        "One approval packet per project, each routed to that project's manager.",
        "Open approvals", () => go("approvals")),
      step("Approve one part and send the other back",
        "Approving freezes those days at the bill rate in force on each one.",
        "Open approvals", () => go("approvals")),
      step("Try to change an approved day",
        "You can't — it is locked, for everyone. The rejected part still is not.",
        "Open my week", () => go("timesheet")),
      step("Unlock it properly",
        "Request an unlock, then switch to an admin in the top left and grant it.",
        "Open unlock requests", () => go("unlocks")),
      step("Bill it and watch the PO",
        "A draft does not burn the purchase order. Issuing it does.",
        "Open purchase orders", () => go("pos")),
      step("Check the trail",
        "Every step you just took is recorded, with who did it.",
        "Open the audit trail", () => go("audit"))));
}

/* ---------------------------------------------------------------- accounts */

function accountsView() {
  const list = activeAccounts();
  return el("div", { class: "pane" },
    el("table", { class: "grid" },
      el("thead", {}, el("tr", {},
        ...["Account", "Status", "Owners", "Sites", "Managers", "Open projects"]
          .map((h) => el("th", {}, h)))),
      el("tbody", {}, ...list.map((a) => {
        const owners = ownersOf(a.id);
        return el("tr", { style: "cursor:pointer", onclick: () => go("account", a.id) },
          el("td", {}, el("strong", {}, a.name)),
          el("td", {}, el("span", { class: "pill" }, a.status.replace(/_/g, " "))),
          el("td", {}, owners.length
            ? owners.map((o) => `${o.name} ${o.splitPct}%`).join(", ")
            : el("span", { class: "muted" }, "unassigned")),
          el("td", { class: "num" }, locationsOf(a.id).length),
          el("td", { class: "num" }, contactsOf(a.id).filter((c) => c.isManager).length),
          el("td", { class: "num" },
            projectsOf(a.id).filter((p) => p.status === "open").length));
      }))));
}

function accountView(id) {
  const a = byId("accounts", id);
  if (!a) return el("div", { class: "pane muted" }, "That account is not on file.");
  const owners = ownersOf(id);
  return el("div", { class: "pane" },

/* ---------------------------------------------------------------- pipeline
 *
 * Submissions: putting a resource forward, moving them through, booking the
 * conversations, and the handover to payroll when it comes off.
 *
 * Every operation here refuses the same things the server refuses, and for the
 * same reasons. A page cannot enforce a rule the way a database can - anyone can
 * open the console - but a rule that is only in a screen is a rule that gets
 * forgotten by the next screen, so they live in one place here too.
 */

const submissionsOf = (contactId) => where("submissions", (s) => s.contactId === contactId);
const interviewsOf = (submissionId) => where("interviews", (i) => i.submissionId === submissionId)
  .sort((a, b) => a.round - b.round);
const historyOf = (submissionId) => where("submissionEvents",
  (e) => e.submissionId === submissionId).sort((a, b) => a.at.localeCompare(b.at));

/* The one number a recruiter needs before they commit to a rate. */
function marginOf(payRate, billRate, burdenPct) {
  const pay = num(payRate), bill = num(billRate), burden = num(burdenPct);
  if (!payRate || !billRate) return { gm: null, gmPct: null };
  const gm = bill - pay - (pay * burden / 100);
  return { gm, gmPct: bill ? (gm / bill) * 100 : null };
}

/* A submission, with everything a screen wants to say about it in one object. */
function submissionRow(s) {
  const project = byId("projects", s.projectId);
  const contact = byId("contacts", s.contactId);
  const account = project ? byId("accounts", project.accountId) : null;
  const st = stageOf(s.stage) || { label: s.stage, sort: 99 };
  const ivs = interviewsOf(s.id);
  const nextIv = ivs.filter((i) => i.status === "scheduled" &&
    new Date(i.scheduledAt).getTime() >= Date.now() - 2 * DAY)
    .sort((a, b) => a.scheduledAt.localeCompare(b.scheduledAt))[0] || null;
  return {
    ...s, project, contact, account, stageLabel: st.label, stageSort: st.sort,
    isOpen: !!st.open, isWon: !!st.won,
    daysInStage: daysSince(s.stageSince) ?? 0,
    daysSinceSubmitted: daysSince(s.createdAt) ?? 0,
    ...marginOf(s.payRate, s.billRate, s.burdenPct),
    interviews: ivs, nextInterview: nextIv,
    lastTouch: lastTouch(s.contactId),
    loss: s.lossReasonCode ? lossReason(s.lossReasonCode) : null,
  };
}

function board({ ownerId = null, projectId = null, accountId = null,
                 contactId = null, openOnly = true } = {}) {
  return where("submissions", (s) =>
      (!projectId || s.projectId === projectId) &&
      (!contactId || s.contactId === contactId))
    .map(submissionRow)
    .filter((r) => r.project && r.contact)
    .filter((r) => !accountId || r.project.accountId === accountId)
    .filter((r) => !openOnly || r.isOpen)
    .filter((r) => !ownerId || r.submittedBy === ownerId || r.project.ownerId === ownerId)
    .sort((a, b) => (a.stageSort - b.stageSort) || (b.daysInStage - a.daysInStage));
}

/* ------------------------------------------------------------- operations */

/* Putting a resource forward. Refuses what the server refuses, in the same words,
 * and hands back advisories rather than blocking on a thin margin - a rate
 * decision belongs to the person making it, they just should not make it blind. */
function submitCandidate({ projectId, contactId, payRate = null, billRate = null,
                           burdenPct = 22, notes = null }) {
  const project = byId("projects", projectId);
  if (!project) throw new Error("that project is not on file");
  if (project.archivedAt) throw new Error("that project is archived");
  if (!["open", "draft"].includes(project.status)) {
    throw new Error(`that project is ${project.status} — reopen it before submitting anybody`);
  }
  const contact = byId("contacts", contactId);
  if (!contact) throw new Error("that person is not on file");
  if (!contact.isCandidate) {
    throw new Error(`${contact.fullName} is not marked as a candidate — mark them as one ` +
      "on their record first, which is a change to the person we already have, " +
      "not a second record");
  }
  if (where("submissions", (s) => s.projectId === projectId &&
                                  s.contactId === contactId).length) {
    throw new Error(`${contact.fullName} has already been put forward for this project`);
  }

  /* Two recruiters working the same person into the same client is the call
   * nobody wants to make. The same recruiter putting them up for a second role
   * at that client is ordinary work, so only a different one is stopped. */
  const me = actingUser();
  const clash = where("submissions", (s) => s.contactId === contactId &&
      stageIsOpen(s.stage) && s.submittedBy && s.submittedBy !== me.id)
    .map(submissionRow)
    .find((r) => r.project && r.project.accountId === project.accountId);
  if (clash) {
    const who = (byId("users", clash.submittedBy) || {}).name || "somebody";
    throw new Error(`${contact.fullName} is already out to ` +
      `${clash.account ? clash.account.name : "this client"} — ${who} submitted them ` +
      `for ${clash.project.name} on ${day(iso(clash.createdAt))}. ` +
      "Speak to them before going round it.");
  }

  const now = new Date().toISOString();
  const row = insert("submissions", {
    projectId, contactId, stage: "submitted", stageSince: now, createdAt: now,
    submittedBy: me.id, payRate, billRate, burdenPct, lossReasonCode: null, notes,
  }, "submitted a candidate");
  insert("submissionEvents", {
    submissionId: row.id, fromStage: null, toStage: "submitted", reason: null,
    actorId: me.id, at: now,
  }, "submission history");

  const account = byId("accounts", project.accountId);
  logActivity({ contactId, accountId: project.accountId, projectId, kind: "submission",
    body: `Submitted to ${account ? account.name : "the client"} for ${project.name}` +
      (billRate ? ` at ${money2(billRate)} an hour` : "") });

  const m = marginOf(payRate, billRate, burdenPct);
  const advisories = [];
  if (billRate && project.billRateMax && num(billRate) > num(project.billRateMax)) {
    advisories.push(`that bill rate is above the ${money2(project.billRateMax)} ceiling ` +
      "on this project");
  }
  if (billRate && project.billRateMin && num(billRate) < num(project.billRateMin)) {
    advisories.push(`that bill rate is below the ${money2(project.billRateMin)} floor ` +
      "on this project");
  }
  if (m.gmPct !== null && m.gmPct < 15) {
    advisories.push(`that leaves ${m.gmPct.toFixed(1)}% gross margin`);
  }
  return { ...row, ...m, advisories };
}

/* Moving a stage. The machine decides, not the caller. */
function advanceSubmission(submissionId, toStage, reason = null, lossReasonCode = null) {
  const s = byId("submissions", submissionId);
  if (!s) throw new Error("that submission is not on file");
  if (s.stage === toStage) throw new Error(`it is already at ${STAGE_LABEL[toStage]}`);

  const move = FLOW.find((f) => f.from === s.stage && f.to === toStage);
  if (!move) {
    const legal = movesFrom(s.stage).map((f) => f.label).join(", ");
    throw new Error(`a submission at ${STAGE_LABEL[s.stage]} cannot go to ` +
      `${STAGE_LABEL[toStage] || toStage}. From here you can: ` +
      (legal || "nothing — it is finished"));
  }
  if (move.needsReason && !(reason || "").trim()) {
    throw new Error(`moving this to ${STAGE_LABEL[toStage]} needs a reason`);
  }
  const target = stageOf(toStage);
  if (!target.open && !target.won && !lossReasonCode) {
    throw new Error("say why we lost this one — a loss nobody wrote down teaches " +
      "the desk nothing");
  }
  /* "Placed" is a claim that a consultant is starting work, and the placement is
   * what payroll and billing hang off. The word cannot get ahead of the record. */
  if (target.won && !where("placements", (p) => p.submissionId === submissionId).length) {
    throw new Error("create the placement first — a submission is not placed until " +
      "the consultant has a start date");
  }

  const me = actingUser();
  const now = new Date().toISOString();
  const row = update("submissions", submissionId, {
    stage: toStage, stageSince: now,
    // Back in play means the old explanation of how it died no longer applies.
    lossReasonCode: target.open ? null : (lossReasonCode || s.lossReasonCode),
  }, reason || `moved to ${STAGE_LABEL[toStage]}`);
  insert("submissionEvents", {
    submissionId, fromStage: s.stage, toStage, reason: reason || null,
    actorId: me.id, at: now,
  }, "submission history");
  return row;
}

/* Booking the conversation. This is what puts a submission in the interview
 * stage - nobody has to remember two steps - and it never drags a stage
 * backwards, so a second round while an offer is out leaves the offer alone. */
function scheduleInterview({ submissionId, scheduledAt, durationMins = 60, mode = "video",
                             whereText = null, interviewers = null, prepNotes = null }) {
  const s = byId("submissions", submissionId);
  if (!s) throw new Error("that submission is not on file");
  if (!scheduledAt) throw new Error("an interview needs a date and a time");
  if (!stageIsOpen(s.stage)) {
    throw new Error(`that submission is closed (${STAGE_LABEL[s.stage]}) — ` +
      "reopen it before booking anything");
  }
  const round = interviewsOf(submissionId).reduce((n, i) => Math.max(n, i.round), 0) + 1;
  const me = actingUser();
  const row = insert("interviews", {
    submissionId, round, scheduledAt, durationMins: num(durationMins) || 60, mode,
    whereText, interviewers, prepNotes, status: "scheduled", outcome: "pending",
    feedback: null, arrangedBy: me.id, createdAt: new Date().toISOString(),
  }, `booked interview round ${round}`);

  if ((stageOf(s.stage).sort) < stageOf("interview").sort) {
    advanceSubmission(submissionId, "interview", "interview booked");
  }
  const project = byId("projects", s.projectId);
  const account = project ? byId("accounts", project.accountId) : null;
  logActivity({ contactId: s.contactId, projectId: s.projectId,
    accountId: project ? project.accountId : null, kind: "interview",
    body: `Round ${round} ${mode} interview with ${account ? account.name : "the client"} ` +
      `booked for ${new Date(scheduledAt).toLocaleString()}` });
  return row;
}

/* What the client said. Deliberately does not move the stage: the next move is a
 * decision a person makes with a reason attached. */
function recordInterviewOutcome(interviewId, { status = "completed", outcome = null,
                                               feedback = null }) {
  const iv = byId("interviews", interviewId);
  if (!iv) throw new Error("that interview is not on file");
  return update("interviews", interviewId, {
    status, outcome: outcome || iv.outcome, feedback: feedback || iv.feedback,
  }, "recorded what happened at the interview");
}

/* The handover to payroll and billing: the placement, its opening rate, and only
 * then the word "placed". */
function placeSubmission({ submissionId, startDate, endDate = null, payRate = null,
                           billRate = null, burdenPct = null }) {
  const s = byId("submissions", submissionId);
  if (!s) throw new Error("that submission is not on file");
  if (!startDate) throw new Error("a placement needs a start date");
  if (where("placements", (p) => p.submissionId === submissionId).length) {
    throw new Error("that submission already has a placement");
  }
  const pay = payRate ?? s.payRate;
  const bill = billRate ?? s.billRate;
  const burden = burdenPct ?? s.burdenPct ?? 0;
  if (pay === null || pay === undefined || pay === "" ||
      bill === null || bill === undefined || bill === "") {
    throw new Error("a placement needs a pay rate and a bill rate — they are what " +
      "payroll and the invoice are built from");
  }
  const placement = insert("placements", {
    projectId: s.projectId, contactId: s.contactId, submissionId,
    // A start date that has already arrived means the assignment is running.
    // Deriving this beats a status somebody has to remember to change.
    status: startDate <= iso(new Date()) ? "active" : "pending",
    startDate, endDate,
    recruiterId: s.submittedBy || actingUser().id,
  }, "placed a submission");
  insert("rates", {
    placementId: placement.id, rateType: "standard", unit: "hour",
    payRate: num(pay), billRate: num(bill), burdenPct: num(burden),
    effectiveFrom: startDate, effectiveTo: null, supersedesId: null,
  }, "opening rate for a new placement");
  advanceSubmission(submissionId, "placed", "placed");

  const contact = byId("contacts", s.contactId);
  if (contact && !contact.onPayroll) {
    update("contacts", contact.id, { onPayroll: true },
      "started an assignment, so on our payroll from today");
  }
  return { placement, submission: byId("submissions", submissionId) };
}

/* ------------------------------------------------------------ the numbers */

/* How many submissions ever reached each stage, read off the history rather than
 * the current stage - so a candidate who was later rejected still counts towards
 * the interviews they got. That is the difference between a funnel and a
 * snapshot, and it is the difference between "we do not get interviews" and
 * "we get interviews and lose them". */
function funnel(ownerId = null) {
  const mine = (subId) => {
    if (!ownerId) return true;
    const s = byId("submissions", subId);
    if (!s) return false;
    const p = byId("projects", s.projectId);
    return s.submittedBy === ownerId || (p && p.ownerId === ownerId);
  };
  return STAGES.filter((st) => st.open || st.won).map((st) => ({
    ...st,
    reached: new Set(where("submissionEvents",
      (e) => e.toStage === st.code && mine(e.submissionId))
      .map((e) => e.submissionId)).size,
    sittingHere: where("submissions", (s) => s.stage === st.code && mine(s.id)).length,
  }));
}

function lossBreakdown(days = 90, ownerId = null) {
  const cutoff = Date.now() - days * DAY;
  const out = new Map();
  for (const s of where("submissions", (x) => x.lossReasonCode &&
      new Date(x.stageSince).getTime() >= cutoff)) {
    const p = byId("projects", s.projectId);
    if (ownerId && s.submittedBy !== ownerId && !(p && p.ownerId === ownerId)) continue;
    const lr = lossReason(s.lossReasonCode);
    if (!lr) continue;
    const cur = out.get(lr.code) || { ...lr, losses: 0, days: [] };
    cur.losses += 1;
    cur.days.push(Math.max(0, daysSince(s.createdAt) - daysSince(s.stageSince)));
    out.set(lr.code, cur);
  }
  return [...out.values()]
    .map((r) => ({ ...r, avgDays: r.days.length
      ? Math.round(r.days.reduce((a, b) => a + b, 0) / r.days.length) : null }))
    .sort((a, b) => b.losses - a.losses);
}

/* Interviews coming up, and separately the ones that happened where nobody has
 * written down the answer. The second list is how a submission dies quietly. */
function upcomingInterviews(days = 14, ownerId = null) {
  const now = Date.now();
  return where("interviews", (i) => i.status === "scheduled")
    .map((i) => ({ ...i, sub: submissionRow(byId("submissions", i.submissionId) || {}) }))
    .filter((r) => r.sub && r.sub.contact &&
      new Date(r.scheduledAt).getTime() >= now - 2 * DAY &&
      new Date(r.scheduledAt).getTime() <= now + days * DAY &&
      (!ownerId || r.sub.submittedBy === ownerId ||
        (r.sub.project && r.sub.project.ownerId === ownerId)))
    .sort((a, b) => a.scheduledAt.localeCompare(b.scheduledAt));
}

function interviewsAwaitingFeedback(ownerId = null) {
  return where("interviews", (i) => i.outcome === "pending" &&
      ["scheduled", "completed"].includes(i.status) &&
      new Date(i.scheduledAt).getTime() < Date.now())
    .map((i) => ({ ...i, sub: submissionRow(byId("submissions", i.submissionId) || {}),
                   daysAgo: daysSince(i.scheduledAt) }))
    .filter((r) => r.sub && r.sub.contact && r.sub.isOpen &&
      (!ownerId || r.sub.submittedBy === ownerId ||
        (r.sub.project && r.sub.project.ownerId === ownerId)))
    .sort((a, b) => b.daysAgo - a.daysAgo);
}
/* ------------------------------------------------------- forms and dialogs
 *
 * A browser prompt takes one line of text, which is fine for "what did they
 * say" and useless for a rate and a start date. This is the smallest thing that
 * is not that: a field list in, an object out, Escape closes it.
 */
function askFor(title, fields, { submitLabel = "Save", note = null, onChange = null } = {}) {
  return new Promise((resolve) => {
    const inputs = {};
    const readAll = () => Object.fromEntries(
      Object.entries(inputs).map(([k, node]) => [k, node.value]));
    const live = el("div", { class: "livenote" });

    const refresh = () => {
      if (!onChange) return;
      const out = onChange(readAll());
      live.replaceChildren(out ? (out.nodeType ? out : document.createTextNode(out)) : "");
    };

    const rows = fields.map((f) => {
      let node;
      if (f.type === "select") {
        node = el("select", { class: "fi" }, ...(f.options || []).map((o) =>
          el("option", { value: o.value,
                         selected: String(o.value) === String(f.value ?? "") ? "" : null },
             o.label)));
      } else if (f.type === "textarea") {
        node = el("textarea", { class: "fi", rows: f.rows || 3,
                                placeholder: f.placeholder || "" }, f.value || "");
      } else {
        node = el("input", { class: "fi", type: f.type || "text",
                             value: f.value ?? "", step: f.step || null,
                             min: f.min ?? null, placeholder: f.placeholder || "" });
      }
      node.addEventListener("input", refresh);
      node.addEventListener("change", refresh);
      inputs[f.name] = node;
      return el("label", { class: "field" + (f.wide ? " wide" : "") },
        el("span", { class: "flab" }, f.label),
        node,
        f.hint ? el("span", { class: "fhint" }, f.hint) : null);
    });

    const dlg = el("dialog", { class: "ask" },
      el("form", { method: "dialog", onsubmit: (e) => {
        e.preventDefault();
        dlg.close();
        resolve(readAll());
      } },
        el("h3", {}, title),
        note ? el("p", { class: "askmeta" }, note) : null,
        el("div", { class: "fields" }, ...rows),
        onChange ? live : null,
        el("div", { class: "askbtns" },
          el("button", { type: "button", class: "ghost",
                         onclick: () => { dlg.close(); resolve(null); } }, "Cancel"),
          el("button", { type: "submit", class: "send" }, submitLabel))));

    dlg.addEventListener("close", () => { dlg.remove(); });
    dlg.addEventListener("cancel", () => resolve(null));
    document.body.append(dlg);
    dlg.showModal();
    refresh();
    const first = Object.values(inputs)[0];
    if (first) first.focus();
  });
}

/* Every write from a screen funnels through here so a refusal always lands the
 * same way: the message the rule gave, in front of the person who tried. */
function attempt(fn) {
  try { const out = fn(); commit(); render(); return out; }
  catch (e) { alert(e.message); return null; }
}

/* Our own consultants come first. Somebody already on the payroll being put
 * against a new project is a redeployment: no onboarding, no screening, and
 * they are already earning. It is the cheapest seat there is to fill, so the
 * list should not bury them under a hundred strangers. */
const candidateOptions = () => where("contacts", (c) => c.isCandidate && !c.archivedAt)
  .sort((a, b) => (Number(!!b.onPayroll) - Number(!!a.onPayroll)) ||
                  a.fullName.localeCompare(b.fullName))
  .map((c) => ({ value: c.id,
                 label: c.fullName + (c.onPayroll ? " (our consultant)" : "") +
                        (c.headline ? ` — ${c.headline}` : "") }));

const openProjectOptions = () => where("projects", (p) => !p.archivedAt &&
    ["open", "draft"].includes(p.status))
  .map((p) => ({ value: p.id, label: `${(byId("accounts", p.accountId) || {}).name} — ${p.name}` }))
  .sort((a, b) => a.label.localeCompare(b.label));

/* ----------------------------------------------------------- submit a person */

async function submitFlow({ projectId = null, contactId = null } = {}) {
  const project = projectId ? byId("projects", projectId) : null;
  const contact = contactId ? byId("contacts", contactId) : null;
  const fields = [];
  if (!contactId) {
    fields.push({ name: "contactId", label: "Resource", type: "select",
                  options: candidateOptions(), wide: true,
                  hint: "somebody already on our payroll is a redeployment, "
                        + "which is the cheapest seat you will fill all month" });
  }
  if (!projectId) {
    fields.push({ name: "projectId", label: "For which project", type: "select",
                  options: openProjectOptions(), wide: true });
  }
  const hint = project && (project.billRateMin || project.billRateMax)
    ? `this project is scoped ${project.billRateMin ? money2(project.billRateMin) : "—"}` +
      ` to ${project.billRateMax ? money2(project.billRateMax) : "—"}`
    : null;
  fields.push(
    { name: "payRate", label: "Pay rate", type: "number", step: "0.01", min: "0",
      value: project && project.payRateMax ? project.payRateMax : "",
      hint: "what we pay them, per hour" },
    { name: "billRate", label: "Bill rate", type: "number", step: "0.01", min: "0",
      value: project && project.billRateMin ? project.billRateMin : "",
      hint: hint || "what the client pays us, per hour" },
    { name: "burdenPct", label: "Burden", type: "number", step: "0.5", min: "0",
      value: 22, hint: "as a percentage of pay" },
    { name: "notes", label: "Why this person", type: "textarea", wide: true,
      placeholder: "For whoever reads this next — the account manager, or you in " +
                   "three weeks." });

  const answer = await askFor(
    contact ? `Put ${contact.fullName} forward` : "Submit a resource", fields,
    { submitLabel: "Submit",
      note: project
        ? `${(byId("accounts", project.accountId) || {}).name} · ${project.name}`
        : null,
      onChange: (v) => {
        const m = marginOf(v.payRate, v.billRate, v.burdenPct);
        if (m.gmPct === null) return "Fill in both rates to see what it leaves.";
        const wrap = el("span", {},
          `Gross margin ${money2(m.gm)} an hour, `,
          el("b", { class: m.gmPct < 15 ? "err" : "" }, m.gmPct.toFixed(1) + "%"));
        if (m.gmPct < 15) wrap.append(" — thin for the desk.");
        return wrap;
      } });
  if (!answer) return;

  const out = attempt(() => submitCandidate({
    projectId: projectId || answer.projectId,
    contactId: contactId || answer.contactId,
    payRate: answer.payRate === "" ? null : Number(answer.payRate),
    billRate: answer.billRate === "" ? null : Number(answer.billRate),
    burdenPct: answer.burdenPct === "" ? 0 : Number(answer.burdenPct),
    notes: answer.notes || null,
  }));
  if (out && out.advisories && out.advisories.length) {
    noteSaving("Submitted — " + out.advisories.join("; "), "warn");
  } else if (out) {
    noteSaving("Submitted.", "good");
  }
  if (out) go("submission", out.id);
}

/* ------------------------------------------------------------- move a stage */

async function moveFlow(submissionId, move) {
  const r = submissionRow(byId("submissions", submissionId));
  const target = stageOf(move.to);
  const isLoss = !target.open && !target.won;
  const fields = [];
  if (isLoss) {
    fields.push({ name: "lossReasonCode", label: "Why did we lose it", type: "select",
      wide: true,
      options: LOSS_REASONS.map((l) => ({ value: l.code,
        label: `${l.label} (${l.side === "us" ? "on us" : l.side})` })) });
  }
  if (move.needsReason || isLoss) {
    fields.push({ name: "reason", label: "In your own words", type: "textarea", wide: true,
      placeholder: isLoss
        ? "What the client or the candidate actually said."
        : "Why this is moving. Whoever picks this up next will read it." });
  }

  if (!fields.length) {
    attempt(() => advanceSubmission(submissionId, move.to));
    return;
  }
  const answer = await askFor(`${move.label} — ${r.contact.fullName}`, fields,
    { submitLabel: move.label,
      note: `${r.account ? r.account.name : ""} · ${r.project.name} · ` +
            `at ${r.stageLabel} for ${r.daysInStage} days` });
  if (!answer) return;
  attempt(() => advanceSubmission(submissionId, move.to,
    answer.reason || null, answer.lossReasonCode || null));
}

async function interviewFlow(submissionId) {
  const r = submissionRow(byId("submissions", submissionId));
  const soon = new Date(Date.now() + 2 * DAY);
  // Skip the weekend rather than proposing a Sunday interview.
  while (soon.getDay() === 0 || soon.getDay() === 6) soon.setDate(soon.getDate() + 1);
  const answer = await askFor(`Book an interview — ${r.contact.fullName}`, [
    { name: "date", label: "Date", type: "date", value: iso(soon) },
    { name: "time", label: "Time", type: "time", value: "10:00" },
    { name: "durationMins", label: "Minutes", type: "number", min: "15", value: 60 },
    { name: "mode", label: "How", type: "select", value: "video",
      options: [["video", "Video"], ["phone", "Phone"], ["onsite", "On site"],
                ["panel", "Panel"]].map(([value, label]) => ({ value, label })) },
    { name: "whereText", label: "Where", type: "text", wide: true,
      placeholder: "A link, a room, or the site address and who to ask for." },
    { name: "interviewers", label: "Who from the client", type: "text", wide: true,
      placeholder: "Names and titles, so the candidate knows the room." },
    { name: "prepNotes", label: "What they should know", type: "textarea", wide: true,
      placeholder: "The prep that makes the difference." },
  ], { submitLabel: "Book it",
       note: `${r.account ? r.account.name : ""} · ${r.project.name}` });
  if (!answer) return;
  if (!answer.date) { alert("An interview needs a date."); return; }
  attempt(() => scheduleInterview({
    submissionId, scheduledAt: `${answer.date}T${answer.time || "10:00"}:00`,
    durationMins: Number(answer.durationMins) || 60, mode: answer.mode,
    whereText: answer.whereText || null, interviewers: answer.interviewers || null,
    prepNotes: answer.prepNotes || null,
  }));
}

async function outcomeFlow(interviewId) {
  const iv = byId("interviews", interviewId);
  const r = submissionRow(byId("submissions", iv.submissionId));
  const answer = await askFor(`Round ${iv.round} — what happened`, [
    { name: "status", label: "Did it happen", type: "select", value: "completed",
      options: [["completed", "Yes, it happened"], ["no_show", "Somebody did not show"],
                ["cancelled", "Cancelled"], ["rescheduled", "Being rescheduled"]]
        .map(([value, label]) => ({ value, label })) },
    { name: "outcome", label: "Where it leaves us", type: "select", value: "advance",
      options: [["advance", "They want to go on"], ["reject", "They passed"],
                ["hold", "On hold"], ["pending", "No word yet"]]
        .map(([value, label]) => ({ value, label })) },
    { name: "feedback", label: "What they actually said", type: "textarea", wide: true,
      rows: 4, placeholder: "Their words, not your summary — it is worth more later." },
  ], { submitLabel: "Record it",
       note: `${r.contact.fullName} · ${r.account ? r.account.name : ""} · ${r.project.name}. ` +
             "Recording this does not move the submission — that is your call, below." });
  if (!answer) return;
  attempt(() => recordInterviewOutcome(interviewId, {
    status: answer.status, outcome: answer.outcome, feedback: answer.feedback || null,
  }));
}

async function placeFlow(submissionId) {
  const r = submissionRow(byId("submissions", submissionId));
  const today = iso(new Date());
  const projectStart = r.project && r.project.startDate ? r.project.startDate : null;
  const answer = await askFor(`Place ${r.contact.fullName}`, [
    { name: "startDate", label: "Start date", type: "date",
      // Never default into the past: a placement that started weeks ago would
      // accept time for weeks nobody worked.
      value: projectStart && projectStart > today ? projectStart : today,
      hint: projectStart && projectStart <= today
        ? "the project started " + day(projectStart) + " - this is a later start"
        : null },
    { name: "endDate", label: "End date", type: "date",
      value: r.project && r.project.endDate ? r.project.endDate : "",
      hint: "leave empty if it is open ended" },
    { name: "payRate", label: "Pay rate", type: "number", step: "0.01",
      value: r.payRate ?? "" },
    { name: "billRate", label: "Bill rate", type: "number", step: "0.01",
      value: r.billRate ?? "" },
    { name: "burdenPct", label: "Burden", type: "number", step: "0.5",
      value: r.burdenPct ?? 22 },
  ], { submitLabel: "Place them",
       note: "This creates the placement and its opening rate, then marks the " +
             "submission placed. From here the assignment is real: time can be " +
             "entered against it and it can be invoiced.",
       onChange: (v) => {
         const m = marginOf(v.payRate, v.billRate, v.burdenPct);
         return m.gmPct === null ? "Both rates are needed."
           : `Gross margin ${money2(m.gm)} an hour, ${m.gmPct.toFixed(1)}%.`;
       } });
  if (!answer) return;
  const out = attempt(() => placeSubmission({
    submissionId, startDate: answer.startDate, endDate: answer.endDate || null,
    payRate: answer.payRate === "" ? null : Number(answer.payRate),
    billRate: answer.billRate === "" ? null : Number(answer.billRate),
    burdenPct: answer.burdenPct === "" ? 0 : Number(answer.burdenPct),
  }));
  if (out) noteSaving("Placed. The assignment can take time from its start date.", "good");
}

/* ------------------------------------------------------------- the board */

const gmChip = (gmPct) => gmPct === null || gmPct === undefined
  ? el("span", { class: "muted" }, "no rate")
  : el("span", { class: "pill" + (gmPct < 15 ? " bad" : gmPct < 22 ? " warn" : " good") },
      gmPct.toFixed(1) + "%");

function subCard(r) {
  const nextIv = r.nextInterview;
  const waiting = r.interviews.some((i) => i.outcome === "pending" &&
    new Date(i.scheduledAt).getTime() < Date.now());
  return el("button", { class: "subcard" + (r.daysInStage >= 7 && r.isOpen ? " stale" : ""),
                        onclick: () => go("submission", r.id) },
    el("div", { class: "sctop" },
      el("strong", {}, r.contact.fullName),
      ageChip(r.daysInStage, 7)),
    el("div", { class: "scmeta" },
      `${r.account ? r.account.name : ""} · ${r.project.name}`),
    el("div", { class: "scfoot" },
      gmChip(r.gmPct),
      r.billRate ? el("span", { class: "muted" }, money2(r.billRate) + " an hour") : null),
    nextIv
      ? el("div", { class: "scnote" },
          `${nextIv.mode} interview ${new Date(nextIv.scheduledAt).toLocaleDateString(
            undefined, { weekday: "short", month: "short", day: "numeric" })}`)
      : waiting
        ? el("div", { class: "scnote warnnote" }, "interview done, no feedback recorded")
        : null,
    r.loss ? el("div", { class: "scnote" }, r.loss.label) : null);
}

function pipelineView() {
  const me = actingUser();
  const mineOnly = UI.pipeScope === undefined || UI.pipeScope === null
    ? me.role !== "admin" : UI.pipeScope === "mine";
  const showClosed = !!UI.pipeClosed;
  const rows = board({ ownerId: mineOnly ? me.id : null, openOnly: !showClosed });
  const stages = STAGES.filter((st) => showClosed || st.open);
  const f = funnel(mineOnly ? me.id : null);
  const losses = lossBreakdown(120, mineOnly ? me.id : null);

  const seg = (items, current, set) => el("div", { class: "deskswitch" },
    ...items.map(([k, label]) => el("button",
      { class: "seg" + (current === k ? " on" : ""), onclick: () => { set(k); render(); } },
      label)));

  return el("div", { class: "pane" },
    el("div", { class: "deskhead" },
      el("div", {},
        el("h2", { class: "dtitle" }, "Pipeline"),
        el("p", { class: "dsub" },
          "Everybody we have out, and how long they have been sitting there. " +
          "The buttons on a submission are the moves the rules allow from where it is.")),
      el("div", { class: "segs" },
        seg([["mine", "Mine"], ["all", "Everyone"]], mineOnly ? "mine" : "all",
            (k) => { UI.pipeScope = k; }),
        seg([["open", "In play"], ["all", "Everything"]], showClosed ? "all" : "open",

/* --------------------------------------------------------- purchase orders */

const leg = (tone, label, amount, opacity) => el("span", {},
  el("i", { style: `background:var(--${tone});opacity:${opacity ?? 1}` }),
  `${label} ${money(amount)}`);

function poCard(po, opts = {}) {
  const amt = num(po.amount) || 1;
  const pct = (n) => Math.max(0, Math.min(100, num(n) / amt * 100));
  const paid = pct(po.paid);
  const billedUnpaid = Math.max(0, pct(po.invoiced) - paid);
  const drafted = pct(po.drafted);
  const earned = pct(po.approvedUnbilled);
  const over = po.projectedRemaining < 0;
  const soon = po.daysRemaining !== null && po.daysRemaining <= 90;

  return el("div", { class: "card" },
    el("h3", {}, po.poNumber),
    el("div", { class: "meta" },
      `${money(po.amount)} committed` +
      (po.daysRemaining !== null
        ? ` · expires ${day(po.endDate)} (${po.daysRemaining} days)` : "")),

    el("div", { class: "stack", style: "margin:11px 0 0" },
      el("i", { class: "paid", style: `width:${paid}%` }),
      el("i", { class: "billed", style: `width:${billedUnpaid}%` }),
      el("i", { class: "draft", style: `width:${drafted}%` }),
      el("i", { class: "earned", style: `width:${earned}%` })),

    num(po.invoiced) || drafted || earned
      ? el("div", { class: "legend" },
          num(po.paid) ? leg("good", "Paid", po.paid) : null,
          num(po.invoiced) - num(po.paid)
            ? leg("accent", "Billed, unpaid", num(po.invoiced) - num(po.paid)) : null,
          drafted ? leg("accent", "Drafted, not sent", po.drafted, .42) : null,
          earned ? leg("warn", "Approved, not billed", po.approvedUnbilled) : null)
      : el("div", { class: "legend" },
          el("span", { class: "muted" }, "Nothing billed against this one yet")),

    el("div", { class: "money" },
      cell("Invoiced", money(po.invoiced),
           `${po.pctInvoiced}% of the PO — this is the burn`),
      cell("Approved, unbilled", money(po.approvedUnbilled),
           "earned, sitting in our queue"),
      cell("Submitted, pending", money(po.submittedPending),
           "not approved, not earned"),
      cell("Remaining", money(po.remaining), "against invoiced"),
      cell("Projected remaining", money(po.projectedRemaining),
           "once the backlog is billed", over)),

    over ? el("p", { class: "pill bad", style: "margin-top:11px" },
      `Already over-committed by ${money(Math.abs(po.projectedRemaining))}`) : null,
    !over && soon ? el("p", { class: "pill warn", style: "margin-top:11px" },
      po.daysRemaining <= 30 ? "Expires within a month" : "Expires within 90 days") : null,

    opts.actions === false ? null
      : el("div", { style: "margin-top:13px;display:flex;gap:8px;flex-wrap:wrap" },
          num(po.approvedUnbilled) > 0
            ? el("button", { class: "send", onclick: () => {
                const r = draftInvoice({ purchaseOrderId: po.id });
                if (r.nothingToBill) return alert(r.message);
                commit(); go("invoice", r.id);
              } }, `Draft an invoice for ${money(po.approvedUnbilled)}`)
            : null,
          el("button", { class: "ghost", onclick: () => go("invoices") }, "Invoices")));
}

  const list = poBurndown();

/* ------------------------------------------------------------- my week */

function timesheetView() {
  const consultants = where("contacts", (c) => c.onPayroll && !c.archivedAt);
  const who = UI.who || (consultants[0] && consultants[0].id);
  if (!who) {
    return el("div", { class: "pane muted" },
      "Nobody is on payroll yet, so there is no week to fill in.");
  }
  const we = UI.week || iso(weekEndingOf());
  const ts = getOrCreateTimesheet(who, we);
  const targets = allocationTargets(who, we);
  const dates = daysOfWeek(we);
  const editable = ["draft", "rejected"].includes(ts.status);
  const locked = lockedProjectsFor(ts.id);
  const entries = where("entries", (e) => e.timesheetId === ts.id);

  const key = (t) => `${t.placementId}|${t.purchaseOrderId || ""}`;
  const rows = new Map();
  for (const t of targets) rows.set(key(t), { target: t, hours: {} });
  for (const e of entries) {
    const k = `${e.placementId}|${e.purchaseOrderId || ""}`;
    if (!rows.has(k)) {
      const project = byId("projects", e.projectId);
      const account = byId("accounts", project.accountId);
      rows.set(k, { target: { placementId: e.placementId,
        purchaseOrderId: e.purchaseOrderId, projectId: e.projectId,
        projectName: project.name, accountName: account.name,
        poNumber: e.purchaseOrderId ? (byId("pos", e.purchaseOrderId) || {}).poNumber : null },
        hours: {} });
    }
    rows.get(k).hours[e.workDate] = num(e.hours);
  }
  if (!UI.shownRows || UI.shownWeek !== we || UI.shownWho !== who) {
    UI.shownRows = new Set([...rows.entries()]
      .filter(([, r]) => Object.values(r.hours).some((h) => h > 0)).map(([k]) => k));
    if (!UI.shownRows.size && rows.size) UI.shownRows.add([...rows.keys()][0]);
    UI.shownWeek = we; UI.shownWho = who;
  }
  const shown = UI.shownRows;

  const table = el("table", { class: "wk" });
  const dayCards = el("div", { class: "daycards" });
  const totalOut = el("span", { class: "muted" }, "");

  const totals = () => {
    const perDay = {}, perRow = {};
    for (const k of shown) {
      const r = rows.get(k);
      if (!r) continue;
      perRow[k] = 0;
      for (const d of dates) {
        const h = num(r.hours[d.date]);
        perDay[d.date] = (perDay[d.date] || 0) + h;
        perRow[k] += h;
      }
    }
    return { perDay, perRow, week: sum(Object.values(perDay), (x) => x) };
  };

  /* Two layouts over one set of numbers: a grid on a desktop, a card per day on
   * a phone. Both are built once; a keystroke only updates the totals, because
   * rebuilding from inside an input's handler tears out the element that is
   * mid-edit and loses the caret. */
  const rowTotalCells = new Map();
  const dayTotalCells = new Map();
  const dayCardTotals = new Map();
  let weekTotalCell = null;
  let weekCardTotal = null;

  function refreshTotals() {
    const { perDay, perRow, week } = totals();
    for (const [k, td] of rowTotalCells) td.textContent = perRow[k] || "";
    for (const [d, td] of dayTotalCells) {
      td.textContent = perDay[d] || "";
      td.classList.toggle("over", num(perDay[d]) > 24);
    }
    for (const [d, node] of dayCardTotals) {
      const t = perDay[d] || 0;
      node.textContent = t || "";
      node.classList.toggle("over", t > 24);
      const card = node.closest(".daycard");
      if (card) card.classList.toggle("blank", !t);
    }
    if (weekTotalCell) weekTotalCell.textContent = week || "";
    if (weekCardTotal) weekCardTotal.textContent = (week || 0) + " hours";
    totalOut.textContent = week ? `${week} hours this week` : "Nothing entered yet";
  }

  const hourInput = (r, date, label) => {
    const isLocked = locked.has(r.target.projectId);
    const v = r.hours[date] || 0;
    return el("input", {
      class: "h" + (v ? "" : " zero"), type: "number", min: "0", max: "24",
      step: "0.25", inputmode: "decimal", value: v || "",
      "aria-label": label,
      disabled: (!editable || isLocked) ? "" : null,
      oninput: (e) => {
        r.hours[date] = num(e.target.value);
        e.target.classList.toggle("zero", !num(e.target.value));
        refreshTotals();
      },
    });
  };

  const shownRows = () => [...shown].map((k) => ({ k, r: rows.get(k) }))
    .filter((x) => x.r);

  function drawGrid() {
    rowTotalCells.clear(); dayTotalCells.clear();
    table.replaceChildren(
      el("thead", {}, el("tr", {},
        el("th", { class: "tgt" }, "Charged to"),
        ...dates.map((d) => el("th", {}, d.label,
          el("div", { class: "muted", style: "font-weight:400" },
            new Date(d.date + "T12:00:00").toLocaleDateString(undefined,
              { day: "numeric", month: "short" })))),
        el("th", {}, "Total"))),
      el("tbody", {}, ...shownRows().map(({ k, r }) => {
        const isLocked = locked.has(r.target.projectId);
        const rowTotal = el("td", { class: "rowtot" });
        rowTotalCells.set(k, rowTotal);
        return el("tr", {},
          el("td", { class: "tgt" },
            el("strong", {}, r.target.projectName),
            el("span", {},
              [r.target.accountName, r.target.poNumber || "no PO"]
                .filter(Boolean).join(" · "),
              isLocked ? " · approved and locked" : "")),
          ...dates.map((d) => el("td", {},
            hourInput(r, d.date, `${r.target.projectName}, ${d.label}`))),
          rowTotal);
      })),
      el("tfoot", {}, el("tr", {},
        el("td", { class: "tgt" }, "Total"),
        ...dates.map((d) => {
          const td = el("td", { class: "rowtot" });
          dayTotalCells.set(d.date, td);
          return td;
        }),
        weekTotalCell = el("td", { class: "rowtot" }))));
    refreshTotals();
  }

  /* On a phone a week reads as one card per day. Eight columns of number inputs
   * is a spreadsheet, not something you fill in on a train. */
  function drawDayCards() {
    dayCardTotals.clear();
    dayCards.replaceChildren(
      ...dates.map((d) => {
        const dt = el("span", { class: "dt" });
        dayCardTotals.set(d.date, dt);
        return el("div", { class: "daycard" },
          el("div", { class: "dh" },
            el("b", {}, d.label),
            el("span", { class: "dd" },
              new Date(d.date + "T12:00:00").toLocaleDateString(undefined,
                { day: "numeric", month: "short" })),
            dt),
          ...shownRows().map(({ r }) => {
            const isLocked = locked.has(r.target.projectId);
            return el("div", { class: "alloc" },
              el("div", { class: "what" },
                el("strong", {}, r.target.projectName),
                el("span", {}, [r.target.poNumber || "no PO",
                  isLocked ? "approved and locked" : null]
                  .filter(Boolean).join(" · "))),
              hourInput(r, d.date, `${r.target.projectName}, ${d.label}`));
          }));
      }),
      el("div", { class: "weektot" }, "Week total",
        weekCardTotal = el("span", { class: "n" })));
    refreshTotals();
  }

  const narrow = isNarrow();
  if (narrow) drawDayCards(); else drawGrid();

  const unused = targets.filter((t) => !shown.has(key(t)));
  const addRow = el("select", { class: "ghost", onchange: (e) => {
    if (!e.target.value) return;
    shown.add(e.target.value);
    render();
  } }, el("option", { value: "" }, "Charge to another project…"),
     ...unused.map((t) => el("option", { value: key(t) },
       `${t.projectName}${t.poNumber ? " · " + t.poNumber : ""}`)));

  function save(thenSubmit) {
    const out = [];
    for (const k of shown) {
      const r = rows.get(k);
      if (!r || locked.has(r.target.projectId)) continue;
      for (const d of dates) {
        const h = num(r.hours[d.date]);
        if (!h) continue;
        out.push({ placementId: r.target.placementId,
                   purchaseOrderId: r.target.purchaseOrderId || null,
                   workDate: d.date, hours: h });
      }
    }
    try {
      saveTimesheet(ts.id, out);
      if (thenSubmit) {
        const packets = submitTimesheet(ts.id);
        const unrouted = packets.filter((p) => !p.approverContactId);
        if (unrouted.length) {
          alert(`Submitted, but ${unrouted.length} project has no approving manager ` +
                `on file. Somebody has to name one before that part can be approved.`);
        }
      }
      commit();
      UI.shownRows = null;
      render();
    } catch (e) { alert(e.message); }
  }

  const shift = (n) => {
    const d = new Date(we + "T12:00:00");
    d.setDate(d.getDate() + n * 7);
    UI.week = iso(d); UI.shownRows = null; render();
  };

  const packets = where("approvals", (a) => a.timesheetId === ts.id);

  return el("div", { class: "pane" },
    el("div", { class: "wkbar" },
      el("button", { class: "ghost", onclick: () => shift(-1) }, "← Previous"),
      el("strong", {}, "Week ending " +
        new Date(we + "T12:00:00").toLocaleDateString(undefined,
          { day: "numeric", month: "long", year: "numeric" })),
      el("button", { class: "ghost", onclick: () => shift(1) }, "Next →"),
      consultants.length > 1
        ? el("select", { class: "ghost", onchange: (e) => {
            UI.who = e.target.value; UI.shownRows = null; render(); } },
            ...consultants.map((c) => el("option",
              { value: c.id, selected: c.id === who ? "" : null }, c.fullName)))
        : el("span", { class: "muted" }, consultants[0].fullName),
      el("span", { class: "pill" }, ts.status.replace(/_/g, " ")),
      el("span", { class: "grow" }), totalOut),

    narrow ? dayCards : table,

    el("div", { class: "wkbar", style: "margin-top:16px" },
      editable && unused.length ? addRow : null,
      el("span", { class: "grow" }),
      editable ? el("button", { class: "ghost", onclick: () => save(false) },
        "Save draft") : null,
      editable
        ? el("button", { class: "send", onclick: () => save(true) },
            "Submit for approval")
        : el("span", { class: "muted" },
            ts.status === "submitted"
              ? "Waiting on the client. It cannot be changed while it is out."
              : "This week has been decided.")),

    packets.length
      ? section("Approval", packets.map((a) => {
          const project = byId("projects", a.projectId);
          const rowEntries = where("entries",
            (e) => e.timesheetId === ts.id && e.projectId === a.projectId);
          const approver = a.approverContactId
            ? byId("contacts", a.approverContactId) : null;
          return el("div", { class: "packet" },
            el("div", { class: "hd" },
              el("h3", {}, project.name),
              el("span", { class: "pill " + (a.status === "approved" ? "good"
                : a.status === "rejected" ? "bad" : "warn") }, a.status),
              el("span", { class: "muted" },
                `${sum(rowEntries, (e) => num(e.hours) + num(e.otHours))} hours · ` +
                money(sum(rowEntries, entryValue))),
              el("span", { class: "grow" }),
              el("span", { class: "muted" },
                a.decidedBy ? "decided by " + a.decidedBy
                  : approver ? "with " + approver.fullName

            a.note ? el("p", { style: "margin:8px 0 0" }, a.note) : null,
            a.status === "approved"
              ? el("p", { class: "muted", style: "margin:8px 0 0" },
                  "These days are locked. Changing them needs an admin unlock.")
              : null);
        }))

    ts.status === "rejected"
