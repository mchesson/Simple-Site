<title>TS Workspace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style id="app-css">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#F0EEE9; --surface-3:#E7E4DC;
  --glass:rgba(245,244,241,.82);
  --ink:#15140F; --ink-2:#3A3833; --muted:#6C6862; --faint:#9C978E;
  --line:#E7E4DC; --line-soft:#F0EEE9; --line-strong:#D8D4CA;
  --accent:#2B4BFF; --accent-2:#1B37DB; --accent-ink:#FFFFFF; --accent-soft:#EBEEFF;
  --pos:#047857; --pos-soft:#E2F4EC;
  --warn:#B45309; --warn-soft:#FBEEDC;
  --neg:#BE123C; --neg-soft:#FBE7EC;
  --sh-xs:0 1px 2px rgba(21,20,15,.05);
  --sh-sm:0 1px 2px rgba(21,20,15,.04),0 2px 6px rgba(21,20,15,.04);
  --sh-md:0 2px 6px rgba(21,20,15,.06),0 12px 32px rgba(21,20,15,.10);
  --sh-pri:0 1px 2px rgba(43,75,255,.22),0 4px 14px rgba(43,75,255,.20);
  --av1:#EBEEFF; --av1i:#2439C4; --av2:#E4F3EC; --av2i:#0A6A4A;
  --av3:#FCEAE1; --av3i:#A44A16; --av4:#F3E9FB; --av4i:#6B33A6;
  --av5:#FDE8EE; --av5i:#A81643; --av6:#E3F1F8; --av6i:#12607F;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E11; --surface:#17171B; --surface-2:#1F1F24; --surface-3:#292930;
    --glass:rgba(14,14,17,.82);
    --ink:#F3F2EF; --ink-2:#D2D0CB; --muted:#9A9791; --faint:#6E6B66;
    --line:#26262C; --line-soft:#1F1F24; --line-strong:#33333B;
    --accent:#8092FF; --accent-2:#9AA8FF; --accent-ink:#0B0D1F; --accent-soft:#1A1E33;
    --pos:#34D399; --pos-soft:#10241D;
    --warn:#F0B354; --warn-soft:#2A2114;
    --neg:#FB7185; --neg-soft:#2E1720;
    --sh-xs:0 1px 2px rgba(0,0,0,.5);
    --sh-sm:0 1px 2px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
    --sh-md:0 2px 8px rgba(0,0,0,.55),0 16px 40px rgba(0,0,0,.5);
    --sh-pri:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(128,146,255,.22);
    --av1:#1C2140; --av1i:#A9B5FF; --av2:#12291F; --av2i:#5BD6A4;
    --av3:#33210F; --av3i:#F0AE72; --av4:#271A38; --av4i:#C39BEE;
    --av5:#331521; --av5i:#F58BA6; --av6:#122733; --av6i:#77C6E8;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E11; --surface:#17171B; --surface-2:#1F1F24; --surface-3:#292930;
  --glass:rgba(14,14,17,.82);
  --ink:#F3F2EF; --ink-2:#D2D0CB; --muted:#9A9791; --faint:#6E6B66;
  --line:#26262C; --line-soft:#1F1F24; --line-strong:#33333B;
  --accent:#8092FF; --accent-2:#9AA8FF; --accent-ink:#0B0D1F; --accent-soft:#1A1E33;
  --pos:#34D399; --pos-soft:#10241D;
  --warn:#F0B354; --warn-soft:#2A2114;
  --neg:#FB7185; --neg-soft:#2E1720;
  --sh-xs:0 1px 2px rgba(0,0,0,.5);
  --sh-sm:0 1px 2px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --sh-md:0 2px 8px rgba(0,0,0,.55),0 16px 40px rgba(0,0,0,.5);
  --sh-pri:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(128,146,255,.22);
  --av1:#1C2140; --av1i:#A9B5FF; --av2:#12291F; --av2i:#5BD6A4;
  --av3:#33210F; --av3i:#F0AE72; --av4:#271A38; --av4i:#C39BEE;
  --av5:#331521; --av5i:#F58BA6; --av6:#122733; --av6i:#77C6E8;
}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
}
.mono,.num,td.num,th.num{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
button{font-family:inherit; font-size:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- app shell ---------- */
.app{display:grid; grid-template-columns:15.5rem minmax(0,1fr); min-height:100vh}
.side{
  background:var(--surface); border-right:1px solid var(--line);
  padding:1.35rem 1rem; position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; gap:1.6rem;
}
.brand{display:flex; align-items:center; gap:.7rem; padding:0 .3rem}
.brand .mark{
  width:36px; height:36px; border-radius:11px; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; font-weight:800; font-size:.875rem; letter-spacing:-.03em;
  box-shadow:var(--sh-pri); flex-shrink:0;
}
.brand .nm{min-width:0}
.brand b{display:block; font-size:1.0625rem; font-weight:700; letter-spacing:-.03em; line-height:1.2}
.brand small{display:block; font-size:.75rem; color:var(--faint); font-weight:500}
nav.tabs{display:flex; flex-direction:column; gap:.15rem}
nav.tabs button{
  display:flex; align-items:center; gap:.7rem; width:100%; text-align:left;
  padding:.55rem .7rem; border:0; background:transparent; border-radius:10px;
  color:var(--muted); font-weight:600; font-size:.9375rem; letter-spacing:-.01em;
  transition:background .13s ease, color .13s ease;
}
nav.tabs button svg{width:18px; height:18px; flex-shrink:0; opacity:.9}
nav.tabs button:hover{background:var(--surface-2); color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--accent); color:var(--accent-ink); box-shadow:var(--sh-pri)}
nav.tabs button[aria-current="page"] svg{opacity:1}
nav.tabs .cnt{margin-left:auto; font-size:.75rem; font-weight:700; opacity:.72; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums}
.sidefoot{margin-top:auto; display:grid; gap:.5rem}
.status{font-size:.75rem; color:var(--muted); min-height:1.1em; padding:0 .3rem}
.status.busy{color:var(--accent)}
.status.bad{color:var(--neg)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{
    position:sticky; top:0; height:auto; flex-direction:row; align-items:center;
    gap:1rem; border-right:0; border-bottom:1px solid var(--line);
    padding:.7rem .9rem; overflow-x:auto; z-index:50;
  }
  .brand small{display:none}
  nav.tabs{flex-direction:row; gap:.2rem}
  nav.tabs button{white-space:nowrap; padding:.45rem .65rem}
  nav.tabs button span.lbl{display:none}
  nav.tabs button[aria-current="page"] span.lbl{display:inline}
  .sidefoot{display:none}
}

/* ---------- page header + body ---------- */
main{min-width:0; display:flex; flex-direction:column}
.wrap{padding:1.6rem clamp(1rem,3vw,2.25rem) 5rem; max-width:1440px; width:100%}
.ph{display:flex; align-items:center; gap:1rem; margin:0 0 1.4rem; flex-wrap:wrap}
.ph h1{font-size:1.75rem; font-weight:700; letter-spacing:-.035em; margin:0; line-height:1.15}
.ph .sub{color:var(--muted); font-size:.9375rem; font-weight:500}
.ph .sp{margin-left:auto; display:flex; gap:.55rem; flex-wrap:wrap; align-items:center}
.back{
  display:inline-flex; align-items:center; gap:.4rem; border:0; background:transparent;
  color:var(--muted); padding:.25rem .5rem .25rem 0; margin-bottom:.5rem;
  font-size:.875rem; font-weight:600; border-radius:8px;
}
.back:hover{color:var(--accent)}
.eyebrow{font-size:.75rem; font-weight:600; color:var(--faint); letter-spacing:0}

/* ---------- notices ---------- */
.banner{
  display:flex; gap:.9rem; align-items:center; background:var(--accent-soft);
  border:1px solid transparent; padding:.85rem 1rem; margin-bottom:1.4rem;
  border-radius:12px; font-size:.9375rem; color:var(--ink-2);
}
.banner p{margin:0}
.banner b{color:var(--ink); font-weight:700}
.banner .sp{margin-left:auto; flex-shrink:0}
.ro-note{
  background:var(--surface); border:1px solid var(--line); padding:.85rem 1rem;
  border-radius:12px; font-size:.9375rem; color:var(--muted); margin-bottom:1.4rem;
  box-shadow:var(--sh-xs);
}
.ro-note b{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  padding:.5rem .9rem; border-radius:10px; font-weight:600; font-size:.875rem;
  white-space:nowrap; box-shadow:var(--sh-xs); letter-spacing:-.01em;
  transition:background .13s ease, border-color .13s ease, transform .08s ease;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent); border-color:transparent; color:var(--accent-ink); box-shadow:var(--sh-pri)}
.btn.pri:hover{background:var(--accent-2)}
.btn.sm{padding:.3rem .6rem; font-size:.8125rem; border-radius:8px}
.btn.dgr{color:var(--neg)}
.btn.dgr:hover{background:var(--neg-soft)}
.btn.gh{border-color:transparent; background:transparent; box-shadow:none; color:var(--muted)}
.btn.gh:hover{background:var(--surface-2); color:var(--ink)}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ---------- cards ---------- */
.grid{display:grid; gap:1.1rem}
.cols2{display:grid; gap:1.1rem; grid-template-columns:minmax(0,1fr); align-items:start}
@media (min-width:1040px){.cols2{grid-template-columns:1.4fr 1fr}}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--sh-sm); overflow:hidden;
}
.card-h{padding:1.05rem 1.15rem .85rem; display:flex; align-items:center; gap:.7rem}
.card-h h2{font-size:1.0625rem; font-weight:700; margin:0; letter-spacing:-.025em}
.card-h .sp{margin-left:auto; display:flex; gap:.45rem; align-items:center}
.card-b{padding:0 1.15rem 1.15rem}
.card-b.flush{padding:0}
.card-b.flush thead th{border-top:1px solid var(--line)}

/* ---------- stat tiles ---------- */
.tiles{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); margin-bottom:1.4rem}
.tile{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:1.05rem 1.15rem; box-shadow:var(--sh-sm);
}
.tile .lab{display:block; font-size:.8125rem; font-weight:600; color:var(--muted); margin-bottom:.45rem}
.tile .val{
  display:block; font-size:2.125rem; font-weight:700; letter-spacing:-.04em; line-height:1;
  font-variant-numeric:tabular-nums; font-family:"Plus Jakarta Sans",system-ui,sans-serif;
}
.tile .val.mv{color:var(--pos)}
.tile .foot{font-size:.8125rem; color:var(--faint); margin-top:.5rem; font-weight:500}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.9375rem}
th,td{text-align:left; padding:.8rem 1.15rem; vertical-align:middle}
thead th{
  font-size:.8125rem; font-weight:600; color:var(--muted); white-space:nowrap;
  border-bottom:1px solid var(--line); background:transparent; letter-spacing:-.005em;
}
tbody td{border-bottom:1px solid var(--line-soft)}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer; transition:background .1s ease}
tbody tr.clk:hover{background:var(--surface-2)}
td.num,th.num{text-align:right; white-space:nowrap}
td .nm{font-weight:700; letter-spacing:-.015em}
td .sec{color:var(--muted); font-size:.875rem; font-weight:500}
.who{display:flex; align-items:center; gap:.7rem; min-width:0}
.who .t{min-width:0}
.empty{padding:2.75rem 1.25rem; text-align:center; color:var(--muted); font-size:.9375rem}
.empty b{display:block; color:var(--ink); font-weight:700; margin-bottom:.35rem; font-size:1.0625rem; letter-spacing:-.02em}

/* ---------- avatars ---------- */
.av{
  width:34px; height:34px; border-radius:11px; display:grid; place-items:center;
  font-size:.8125rem; font-weight:700; flex-shrink:0; letter-spacing:-.02em;
}
.av.s{width:26px; height:26px; border-radius:8px; font-size:.6875rem}
.av1{background:var(--av1); color:var(--av1i)} .av2{background:var(--av2); color:var(--av2i)}
.av3{background:var(--av3); color:var(--av3i)} .av4{background:var(--av4); color:var(--av4i)}
.av5{background:var(--av5); color:var(--av5i)} .av6{background:var(--av6); color:var(--av6i)}

/* ---------- pills / chips ---------- */
.pill{
  display:inline-flex; align-items:center; gap:.3rem; padding:.2rem .6rem;
  border-radius:999px; font-size:.8125rem; font-weight:600; white-space:nowrap;
  letter-spacing:-.01em;
}
.pill.n{background:var(--surface-2); color:var(--muted)}
.pill.a{background:var(--accent-soft); color:var(--accent)}
.pill.g{background:var(--pos-soft); color:var(--pos)}
.pill.w{background:var(--warn-soft); color:var(--warn)}
.pill.r{background:var(--neg-soft); color:var(--neg)}
.pill.m{background:var(--accent-soft); color:var(--accent)}
.chips{display:flex; flex-wrap:wrap; gap:.35rem}
.chip{
  display:inline-flex; align-items:center; gap:.35rem;
  background:var(--surface-2); color:var(--ink-2); padding:.2rem .55rem;
  border-radius:999px; font-size:.8125rem; font-weight:500; white-space:nowrap;
}

/* ---------- pipeline board ---------- */
.board{display:grid; gap:.7rem; grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.lane{background:var(--surface-2); border-radius:12px; min-height:96px; display:flex; flex-direction:column}
.lane-h{
  padding:.6rem .7rem .4rem; display:flex; gap:.4rem; align-items:center;
  font-size:.8125rem; font-weight:700; color:var(--ink-2); letter-spacing:-.01em;
}
.lane-h .c{
  margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:.75rem;
  color:var(--faint); font-variant-numeric:tabular-nums; font-weight:500;
}
.lane-b{padding:.35rem .5rem .55rem; display:flex; flex-direction:column; gap:.45rem}
.pcard{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:.6rem .65rem; font-size:.875rem; box-shadow:var(--sh-xs);
}
.pcard .top{display:flex; align-items:center; gap:.5rem; min-width:0}
.pcard .nm{font-weight:700; line-height:1.25; letter-spacing:-.015em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pcard .mt{display:block; color:var(--muted); font-size:.8125rem; margin-top:.3rem; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums}
.pcard .acts{display:flex; gap:.3rem; margin-top:.5rem; flex-wrap:wrap}
.pcard .acts button{
  border:1px solid var(--line-strong); background:var(--surface-2); border-radius:7px;
  padding:.18rem .45rem; font-size:.75rem; color:var(--ink-2); font-weight:600; line-height:1.5;
  transition:background .12s, color .12s, border-color .12s;
}
.pcard .acts button:hover{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.pcard .acts button.x:hover{background:var(--neg); border-color:transparent; color:#fff}

/* ---------- detail lists ---------- */
.dl{display:grid; grid-template-columns:auto minmax(0,1fr); gap:.55rem 1.1rem; font-size:.9375rem; margin:0}
.dl dt{color:var(--muted); font-weight:500}
.dl dd{margin:0; font-weight:600; letter-spacing:-.01em; min-width:0}
.note{
  background:var(--surface-2); padding:.7rem .85rem; font-size:.9375rem;
  color:var(--ink-2); border-radius:10px; margin-bottom:.5rem;
}
.note .w{display:block; font-size:.75rem; font-weight:600; color:var(--faint); margin-bottom:.2rem}
.hist{list-style:none; margin:0; padding:0; font-size:.875rem}
.hist li{display:flex; gap:.7rem; padding:.35rem 0; border-bottom:1px solid var(--line-soft)}
.hist li:last-child{border:0}
.hist .w{font-family:"JetBrains Mono",monospace; color:var(--faint); font-size:.8125rem; flex-shrink:0; width:6.5rem}

/* ---------- search ---------- */
.search{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:1.1rem}
.search input[type=search],.search input[type=text]{
  flex:1; min-width:200px; padding:.6rem .85rem; border:1px solid var(--line-strong);
  border-radius:11px; background:var(--surface); color:var(--ink); box-shadow:var(--sh-xs);
}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
.search select{
  padding:.6rem .7rem; border:1px solid var(--line-strong); border-radius:11px;
  background:var(--surface); color:var(--ink); box-shadow:var(--sh-xs); font-weight:600;
}

/* ---------- modal ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(12,12,16,.5); z-index:100;
  display:flex; align-items:flex-start; justify-content:center; padding:2.5rem 1rem;
  overflow-y:auto; backdrop-filter:blur(3px);
}
.modal{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--sh-md); width:100%; max-width:640px; margin:auto;
}
.modal-h{padding:1.15rem 1.3rem .5rem; display:flex; align-items:center; gap:.7rem}
.modal-h h2{margin:0; font-size:1.25rem; font-weight:700; letter-spacing:-.03em}
.modal-h .x{
  margin-left:auto; border:0; background:transparent; color:var(--muted);
  font-size:1.35rem; line-height:1; padding:.15rem .4rem; border-radius:8px;
}
.modal-h .x:hover{background:var(--surface-2); color:var(--ink)}
.modal-b{padding:.8rem 1.3rem 1.2rem}
.modal-f{padding:1rem 1.3rem 1.2rem; display:flex; gap:.6rem; align-items:center; border-top:1px solid var(--line-soft)}
.modal-f .sp{margin-left:auto; display:flex; gap:.6rem}
.fg{display:grid; gap:1rem}
.fr{display:grid; gap:1rem; grid-template-columns:minmax(0,1fr)}
@media (min-width:540px){
  .fr.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fr.three{grid-template-columns:repeat(3,minmax(0,1fr))}
}
label.f{display:grid; gap:.3rem; min-width:0}
label.f>span{font-size:.875rem; color:var(--ink-2); font-weight:600; letter-spacing:-.01em}
label.f>span .req{color:var(--neg)}
label.f input,label.f select,label.f textarea{
  padding:.55rem .75rem; border:1px solid var(--line-strong); border-radius:10px;
  background:var(--bg); color:var(--ink); width:100%; transition:border-color .12s;
}
label.f input:focus,label.f select:focus,label.f textarea:focus{
  outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent;
}
label.f textarea{resize:vertical; min-height:72px; font-family:inherit; line-height:1.5}
label.f .hint{font-size:.8125rem; color:var(--faint); font-weight:500}
.ferr{color:var(--neg); font-size:.875rem; margin:0 0 .8rem; font-weight:600}
.fwarn{
  background:var(--warn-soft); padding:.8rem .95rem; border-radius:11px;
  font-size:.9375rem; margin-bottom:1rem; color:var(--ink-2);
}
.fwarn b{color:var(--ink); font-weight:700}
.calc{background:var(--surface-2); border-radius:12px; padding:.9rem 1rem; display:grid; gap:.45rem}
.calc .row{display:flex; gap:.7rem; font-size:.9375rem; align-items:baseline}
.calc .row .k{color:var(--muted); font-weight:500}
.calc .row .v{
  margin-left:auto; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-weight:600; letter-spacing:-.02em;
}
.calc .row.big{padding:.15rem 0}
.calc .row.big .k{color:var(--ink); font-weight:700}
.calc .row.big .v{font-size:1.375rem; color:var(--pos); font-weight:700}
.calc .hint{font-size:.8125rem; color:var(--muted); border-top:1px solid var(--line); padding-top:.55rem; font-weight:500}


/* ---------- assistant ---------- */
.chat{display:flex; flex-direction:column; gap:1rem; max-width:940px}
.askintro{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:1.4rem 1.5rem; box-shadow:var(--sh-sm);
}
.askintro h2{margin:0 0 .4rem; font-size:1.375rem; font-weight:700; letter-spacing:-.03em}
.askintro p{margin:0 0 1rem; color:var(--muted); max-width:62ch}
.askintro .askhint{margin:.9rem 0 0; font-size:.8125rem; color:var(--faint)}
.askintro .askhint b{color:var(--ink-2)}
.msgs{display:flex; flex-direction:column; gap:.9rem}
.msg{display:flex; gap:.7rem; align-items:flex-start}
.msg.me{justify-content:flex-end}
.msg .dot{

"use strict";

/* ---------- tiny helpers ---------- */
let _seq = 0;
const uid = p => p + "_" + Date.now().toString(36) + (_seq++).toString(36) + Math.floor(Math.random()*1e4).toString(36);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + (Math.round((+n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => "$" + Math.round(+n||0).toLocaleString("en-US");
const pct = n => (Math.round((+n||0)*10)/10).toFixed(1) + "%";
const todayISO = () => new Date().toISOString().slice(0,10);
const nowISO = () => new Date().toISOString();
function addDays(iso, d){ const x = new Date((iso||todayISO())+"T00:00:00"); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); }
function daysAgo(ts){ if(!ts) return 0; return Math.floor((Date.now() - new Date(ts).getTime())/86400000); }
function daysUntil(iso){ if(!iso) return null; return Math.ceil((new Date(iso+"T00:00:00").getTime() - Date.now())/86400000); }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(String(iso).length>10 ? iso : iso+"T00:00:00");
  if(isNaN(d)) return "—";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function fmtAgo(ts){
  if(!ts) return "—";
  const d = daysAgo(ts);
  return d<=0 ? "today" : d===1 ? "1 day ago" : d + " days ago";
}
const digits = s => String(s||"").replace(/\D/g,"");
const normEmail = s => String(s||"").trim().toLowerCase();

/* ---------- the margin engine: defined exactly once ---------- */
function margin(pay, bill, burdenPct){
  const p = +pay||0, b = +bill||0, bp = +burdenPct||0;
  const burden = p * bp/100;
  const gm = b - p - burden;
  return { burden, gm, gmPct: b ? gm/b*100 : 0, markupPct: p ? ((b/p)-1)*100 : 0, spread: b-p };
}
/* bill rate needed to hold a target GM% given pay + burden */
function billToHold(pay, burdenPct, targetGmPct){
  const cost = (+pay||0) * (1 + (+burdenPct||0)/100);
  const t = (+targetGmPct||0)/100;
  return t >= 1 ? 0 : cost/(1-t);
}

  const j2 = { id:uid("j"), orgId:o1.id, endClientOrgId:null, title:"Engineering Manager", type:"Direct hire", status:"Open", openings:1, city:"Chicago, IL", billMax:null, payMax:null, salaryMin:175000, salaryMax:205000, hmId:c1.id, owner:"House desk", notes:"20% fee, 90-day guarantee.", createdAt:new Date(Date.now()-9*86400000).toISOString() };

function loadState(){
  try{
    const el = document.getElementById("app-state");
    const v = JSON.parse(el.textContent);
    if(v && typeof v === "object" && Array.isArray(v.people)) return v;

const isOpenStage = s => STAGES.indexOf(s) >= 0 && s !== "Placed";
function subLabel(s){
  const p = person(s.personId), j = job(s.jobId);
  return (p?p.name:"?") + " → " + (j?j.title:"?");
}
function everReached(s, stage){
  if(s.hist && s.hist.some(h => h.s===stage)) return true;
  const ci = STAGES.indexOf(s.stage), ti = STAGES.indexOf(stage);
  return ci>=0 && ti>=0 && ci>=ti;
}

/* ---------- metrics ---------- */
function metrics(){
  const openReqs = S.jobs.filter(j => j.status==="Open");
  const openings = openReqs.reduce((n,j) => n + (+j.openings||1), 0);
  const active = S.subs.filter(s => isOpenStage(s.stage));
  const activePl = S.placements.filter(p => p.status==="Active");
  let weeklyGM = 0, feeBooked = 0;
  activePl.forEach(p => {
    const s = sub(p.subId); const j = s ? job(s.jobId) : null;
    if(j && j.type==="Direct hire"){ feeBooked += (+p.fee||0); }
    else { weeklyGM += margin(p.payRate,p.billRate,p.burdenPct).gm * 40; }
  });
  const stale = active
    .filter(s => s.stage!=="Sourced" && daysAgo(s.stageSince) >= 5)
    .sort((a,b) => daysAgo(b.stageSince) - daysAgo(a.stageSince));
  const ending = activePl
    .filter(p => p.endsOn && daysUntil(p.endsOn)!==null && daysUntil(p.endsOn) <= 30)
    .sort((a,b) => daysUntil(a.endsOn) - daysUntil(b.endsOn));
  const nSubmitted = S.subs.filter(s => everReached(s,"Submitted")).length;
  const nInterview = S.subs.filter(s => everReached(s,"Interview")).length;
  const nPlaced = S.subs.filter(s => everReached(s,"Placed")).length;
  const fills = S.subs.filter(s => everReached(s,"Placed") && s.hist && s.hist.length);
  let ttf = null;
  if(fills.length){
    const tot = fills.reduce((n,s) => {
      const first = s.hist[0], last = s.hist.filter(h => h.s==="Placed").pop() || s.hist[s.hist.length-1];
      return n + Math.max(0, Math.round((new Date(last.at) - new Date(first.at))/86400000));
    }, 0);
    ttf = Math.round(tot/fills.length);
  }
  return { openReqs, openings, active, activePl, weeklyGM, feeBooked, stale, ending,
           nSubmitted, nInterview, nPlaced, ttf,
           subToInt: nSubmitted ? nInterview/nSubmitted*100 : 0,
           intToPlace: nInterview ? nPlaced/nInterview*100 : 0 };
}

  return '<span class="pill '+cls+'">'+esc(stage)+'</span>';
}
function statusPill(st){
  const cls = st==="Open"||st==="Active" ? "g" : st==="On hold" ? "w" : st==="Lost" ? "r" : "n";
  return '<span class="pill '+cls+'">'+esc(st)+'</span>';
}

function jobLine(j){

function rateRange(j){
  if(j.type==="Direct hire") return j.salaryMin ? money0(j.salaryMin)+"–"+money0(j.salaryMax) : "—";
  return j.billMax ? "bill ≤ "+money0(j.billMax)+" / pay ≤ "+money0(j.payMax||0) : "—";

function icon(k){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[k]||"")+'</svg>';
}
function initials(name){
  const parts = String(name||"?").replace(/[^\p{L}\p{N}\s]/gu, " ").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
function avClass(name){
  let h = 0;
  const t = String(name||"");
  for(let i=0;i<t.length;i++) h = (h*31 + t.charCodeAt(i)) % 997;
  return "av" + (h % 6 + 1);
}
function avatar(name, small){
  return '<span class="av '+(small?"s ":"")+avClass(name)+'" aria-hidden="true">'+esc(initials(name))+'</span>';
}
function who(name, second, small){
  return '<div class="who">'+avatar(name,small)+'<div class="t"><span class="nm">'+esc(name||"—")+'</span>'+
    (second?'<br><span class="sec">'+second+'</span>':"")+'</div></div>';
}

/* ---------- top bar ---------- */
function topBar(){
  const m = metrics();
  const tab = (k,label,count) =>
    '<button data-a="view" data-v="'+k+'"'+(UI.view===k?' aria-current="page"':'')+'>'+
      icon(k)+'<span class="lbl">'+esc(label)+'</span>'+
      (count!=null?'<span class="cnt">'+count+'</span>':'')+
    '</button>';
  return '<aside class="side">'+
    '<div class="brand"><span class="mark">TS</span>'+
      '<span class="nm"><b>TS Workspace</b><small>Technical Source</small></span></div>'+
    '<nav class="tabs">'+
      tab("ask","Assistant")+
      tab("desk","Desk")+
      tab("jobs","Jobs", S.jobs.filter(j=>j.status==="Open").length)+
      tab("cands","Candidates", candidates().length)+
      tab("orgs","Accounts", S.orgs.filter(o=>!o.archived).length)+
      tab("docs","Documents", (S.docs||[]).length)+
      tab("place","Placements", m.activePl.length)+
    '</nav>'+
    '<div class="sidefoot"><div class="status'+(SAVING?" busy":"")+'" id="status">'+esc(statusText())+'</div></div>'+
  '</aside>';
}
let STATUS = "";
function statusText(){ return STATUS || (READONLY ? "read-only view" : ""); }
function setStatus(t, bad){
  STATUS = t||"";
  const el = document.getElementById("status");
  if(el){ el.textContent = STATUS; el.className = "status" + (bad?" bad":SAVING?" busy":""); }
}

function banner(){
  let out = "";
  if(NOSAVE) out += '<div class="ro-note"><b>Preview mode.</b> Changes are not saved here — open the published page to use this with your team.</div>';
  if(READONLY){
    return out + '<div class="ro-note">You are viewing this desk read-only — you can browse everything, but changes cannot be saved. Ask the owner to share it with edit access.</div>';
  }
  if(!S.sample) return out;
  return out + '<div class="banner"><p><b>This is sample data</b> so you can try the workflow immediately. '+
    'Clear it when you are ready to enter your own candidates and jobs.</p>'+
    '<span class="sp"><button class="btn sm" data-a="clearSample">Clear sample data</button></span></div>';
}

/* ---------- DESK ---------- */
function viewDesk(){
  const m = metrics();
  const tiles =
    '<div class="tiles">'+
      tile("Open jobs", m.openReqs.length, m.openings+" openings to fill")+
      tile("Active submissions", m.active.length, m.stale.length+" need a nudge")+
      tile("Active placements", m.activePl.length, m.ending.length+" ending within 30 days")+
      tile("Weekly gross margin", money0(m.weeklyGM), "from hourly placements, at 40 hrs", true)+
      (m.feeBooked ? tile("Perm fees booked", money0(m.feeBooked), "direct hire placements", true) : "")+
    '</div>';

  const needs = m.stale.length ? '<div class="tw"><table><thead><tr>'+
      '<th>Candidate</th><th>Job</th><th>Stage</th><th class="num">Waiting</th><th></th>'+
    '</tr></thead><tbody>'+
    m.stale.slice(0,8).map(s => {
      const p = person(s.personId), j = job(s.jobId);
      const d = daysAgo(s.stageSince);
      return '<tr><td>'+who(p?p.name:"—", null, true)+'</td>'+
        '<td><span class="sec">'+esc(j?j.title:"—")+' · '+esc(j?orgName(j.orgId):"")+'</span></td>'+
        '<td>'+stagePill(s.stage)+'</td>'+
        '<td class="num" style="color:'+(d>=10?"var(--alert)":"var(--warn)")+'">'+d+'d</td>'+
        '<td class="num"><button class="btn sm" data-a="openSub" data-id="'+s.id+'">Open</button></td></tr>';
    }).join("")+'</tbody></table></div>'
    : emptyBox("Nothing stalled","Every active submission has moved in the last five days.");

  const ending = m.ending.length ? '<div class="tw"><table><thead><tr>'+
      '<th>Contractor</th><th>Client</th><th class="num">Ends</th><th class="num">GM/hr</th>'+
    '</tr></thead><tbody>'+
    m.ending.map(p => {
      const s = sub(p.subId), pe = s?person(s.personId):null, j = s?job(s.jobId):null;
      const d = daysUntil(p.endsOn);
      const mg = margin(p.payRate,p.billRate,p.burdenPct);
      return '<tr class="clk" data-a="openPlacement" data-id="'+p.id+'">'+
        '<td><span class="nm">'+esc(pe?pe.name:"—")+'</span></td>'+
        '<td><span class="sec">'+esc(j?orgName(j.orgId):"—")+'</span></td>'+
        '<td class="num" style="color:'+(d<=14?"var(--alert)":"var(--warn)")+'">'+d+'d</td>'+
        '<td class="num">'+money(mg.gm)+'</td></tr>';
    }).join("")+'</tbody></table></div>'
    : emptyBox("No assignments ending soon","Nothing wraps up in the next 30 days.");

  const funnel =
    '<div class="card-b"><div class="calc">'+
      row("Submitted to a client", m.nSubmitted)+
      row("Reached interview", m.nInterview + "  (" + pct(m.subToInt) + " of submitted)")+
      row("Placed", m.nPlaced + "  (" + pct(m.intToPlace) + " of interviewed)")+
      row("Average time to fill", m.ttf==null ? "—" : m.ttf + " days")+
      '<div class="hint">Measured from the recorded stage history, not from when a record was last edited — so these stay honest as your process changes.</div>'+
    '</div></div>';

  return tiles +
    '<div class="cols2">'+
      '<div class="grid">'+
        card("Needs your attention", '<span class="sec" style="color:var(--muted);font-size:.8125rem">no movement in 5+ days</span>', needs, true)+
        card("Ending within 30 days", '<span class="sec" style="color:var(--muted);font-size:.8125rem">redeployment is your cheapest revenue</span>', ending, true)+
      '</div>'+
      '<div class="grid">'+
        card("This desk, in numbers", "", funnel, false)+
        card("Quick actions","",
          '<div class="card-b" style="display:grid;gap:.5rem">'+
            btn("addCand","Add a candidate",true)+
            btn("addJob","Add a job")+
            btn("addOrg","Add a company")+
            btn("exportCsv","Export candidates to a spreadsheet")+
          '</div>', false)+
      '</div>'+
    '</div>';
}
function tile(lab,val,foot,mv){
  return '<div class="tile"><span class="lab">'+esc(lab)+'</span>'+
    '<span class="val'+(mv?" mv":"")+'">'+esc(String(val))+'</span>'+
    (foot?'<div class="foot">'+esc(foot)+'</div>':'')+'</div>';
}
function row(k,v){ return '<div class="row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(String(v))+'</span></div>'; }
function card(title, aside, body, flush){
  return '<section class="card"><div class="card-h"><h2>'+esc(title)+'</h2>'+(aside?'<span class="sp">'+aside+'</span>':'')+'</div>'+
    (flush?'<div class="card-b flush">'+body+'</div>':body)+'</section>';
}
function btn(a,label,pri){ return '<button class="btn'+(pri?" pri":"")+'" data-a="'+a+'">'+esc(label)+'</button>'; }

    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const opts = ["Open","On hold","Filled","Closed","Lost"].map(s =>
    '<option value="'+s+'"'+(f===s?" selected":"")+'>'+s+'</option>').join("");
  const body = list.length ? '<div class="tw"><table><thead><tr>'+
      '<th>Job</th><th>Company</th><th>Type</th><th class="num">Openings</th>'+
      '<th class="num">Pipeline</th><th>Rates</th><th>Status</th><th class="num">Age</th>'+
    '</tr></thead><tbody>'+

        '<td><span class="nm">'+esc(j.title)+'</span><br><span class="sec">'+esc(j.city||"")+'</span></td>'+
        '<td>'+esc(jobLine(j))+'</td>'+
        '<td><span class="pill n">'+esc(j.type)+'</span></td>'+
        '<td class="num">'+(j.openings||1)+'</td>'+
        '<td class="num">'+act+' active<br><span class="sec">'+ss.length+' total</span></td>'+
        '<td class="sec">'+esc(rateRange(j))+'</td>'+
        '<td>'+statusPill(j.status)+'</td>'+
        '<td class="num">'+daysAgo(j.createdAt)+'d</td></tr>';
    }).join("")+'</tbody></table></div>'
    : emptyBox("No jobs here","Nothing matches this filter.", btn("addJob","Add a job",true));

function viewJobDetail(j){
  const ss = jobSubs(j.id);
  const hm = j.hmId ? person(j.hmId) : null;
  const lanes = STAGES.map(st => {
    const inLane = ss.filter(s => s.stage===st);
    return '<div class="lane"><div class="lane-h">'+esc(st)+'<span class="c">'+inLane.length+'</span></div>'+
      '<div class="lane-b">'+ inLane.map(s => pipeCard(s,j)).join("") +'</div></div>';
  }).join("");
  const closed = ss.filter(s => CLOSED.indexOf(s.stage)>=0);
  const closedHtml = closed.length ? '<div class="card-b"><div class="chips">'+
    closed.map(s => { const p = person(s.personId);
      return '<span class="chip">'+esc(p?p.name:"—")+' · '+esc(s.stage)+(s.closedReason?' · '+esc(s.closedReason):'')+'</span>'; }).join("")+
    '</div></div>' : "";

  const details = '<div class="card-b"><dl class="dl">'+
    dd("Company", esc(orgName(j.orgId)) + (j.endClientOrgId ? ' <span class="pill m">work happens at '+esc(orgName(j.endClientOrgId))+'</span>' : ""))+
    dd("Type", esc(j.type))+
    dd("Openings", String(j.openings||1))+
    dd("Location", esc(j.city||"—"))+
    dd("Hiring manager", hm ? esc(hm.name)+(hm.title?' <span class="sec">· '+esc(hm.title)+'</span>':"") : "—")+
    dd(j.type==="Direct hire"?"Salary range":"Rate ceiling", esc(rateRange(j)))+
    dd("Status", statusPill(j.status))+
    dd("Opened", esc(fmtDate(j.createdAt))+' <span class="sec">('+daysAgo(j.createdAt)+' days ago)</span>')+
  '</dl>'+ (j.notes?'<div class="note" style="margin-top:.75rem">'+esc(j.notes)+'</div>':"") +'</div>';

  return '<button class="back" data-a="view" data-v="jobs">← All jobs</button>'+
    '<div class="ph"><h1>'+esc(j.title)+'</h1><span class="sub">'+esc(jobLine(j))+'</span>'+
    '<span class="sp">'+btn("addToPipeline","Add candidate to pipeline",true)+btn("editJob","Edit job")+'</span></div>'+
    '<div class="cols2">'+
      '<section class="card"><div class="card-h"><h2>Pipeline</h2><span class="sp"><span class="sec" style="color:var(--muted);font-size:.8125rem">'+
        ss.filter(s=>isOpenStage(s.stage)).length+' active</span></span></div>'+
        '<div class="card-b">'+(ss.length?'<div class="board">'+lanes+'</div>':emptyBox("Nobody in this pipeline yet","Add a candidate to get started.",btn("addToPipeline","Add candidate",true)))+'</div>'+
        closedHtml+
      '</section>'+
      card("Job details","",details,false)+
    '</div>';
}
function pipeCard(s,j){
  const p = person(s.personId);
  const i = STAGES.indexOf(s.stage);
  const acts = [];
  if(!READONLY){
    if(i >= 0 && i < STAGES.length-1){
      const next = STAGES[i+1];
      if(next === "Placed") acts.push('<button data-a="makePlacement" data-id="'+s.id+'">Place →</button>');
      else acts.push('<button data-a="advance" data-id="'+s.id+'">'+esc(next)+' →</button>');
    }
    if(i > 0) acts.push('<button data-a="back" data-id="'+s.id+'">←</button>');
    if(s.stage !== "Placed") acts.push('<button class="x" data-a="closeSub" data-id="'+s.id+'">✕</button>');
  }
  const rate = s.billRate ? money0(s.payRate)+" / "+money0(s.billRate) : "no rates yet";
  return '<div class="pcard"><div class="top">'+avatar(p?p.name:"?", true)+
    '<span class="nm">'+esc(p?p.name:"—")+'</span></div>'+
    '<span class="mt">'+esc(rate)+' · '+daysAgo(s.stageSince)+'d</span>'+
    (acts.length?'<div class="acts">'+acts.join("")+'</div>':"")+'</div>';
}
function dd(k,v){ return '<dt>'+esc(k)+'</dt><dd>'+v+'</dd>'; }

/* ---------- CANDIDATES ---------- */
function viewCands(){
  if(UI.sel){ const p = person(UI.sel); if(p) return viewPersonDetail(p); UI.sel = null; }
  const q = UI.q.trim().toLowerCase();
  let list = candidates().filter(p => !p.archived);
  if(q){
    const terms = q.split(/\s+/);
    list = list.filter(p => {
      const hay = [p.name,p.title,p.city,p.workAuth,(p.skills||[]).join(" "),p.notes].join(" ").toLowerCase();
      return terms.every(t => hay.indexOf(t) >= 0);
    });
  }
  list = list.sort((a,b) => new Date(b.lastContact||b.createdAt) - new Date(a.lastContact||a.createdAt));
  const body = list.length ? '<div class="tw"><table><thead><tr>'+
      '<th>Candidate</th><th>Title</th><th>Skills</th><th>Location</th>'+
      '<th>Work auth</th><th class="num">Wants</th><th class="num">Last contact</th><th class="num">Active</th>'+
    '</tr></thead><tbody>'+
    list.map(p => {
      const act = personSubs(p.id).filter(s => isOpenStage(s.stage)).length;
      const dc = daysAgo(p.lastContact);
      return '<tr class="clk" data-a="openPerson" data-id="'+p.id+'">'+
        '<td>'+who(p.name, esc(p.email||""))+'</td>'+
        '<td>'+esc(p.title||"—")+(p.years?'<br><span class="sec">'+p.years+' yrs</span>':"")+'</td>'+
        '<td><div class="chips">'+(p.skills||[]).slice(0,4).map(s=>'<span class="chip">'+esc(s)+'</span>').join("")+'</div></td>'+
        '<td class="sec">'+esc(p.city||"—")+'</td>'+
        '<td class="sec">'+esc(p.workAuth||"—")+'</td>'+
        '<td class="num">'+(p.desiredPay?money0(p.desiredPay)+"/hr":"—")+'</td>'+
        '<td class="num"'+(dc>30?' style="color:var(--alert)"':dc>14?' style="color:var(--warn)"':'')+'>'+(p.lastContact?dc+"d":"—")+'</td>'+
        '<td class="num">'+(act?'<span class="pill a">'+act+'</span>':'<span class="sec">—</span>')+
          (p.isContact?' <span class="pill m">manager</span>':"")+'</td></tr>';
    }).join("")+'</tbody></table></div>'
    : emptyBox(q?"No candidates match":"No candidates yet", q?"Try fewer words, or a single skill.":"Add your first candidate to start building the database.", btn("addCand","Add a candidate",true));
  return '<div class="ph"><h1>Candidates</h1><span class="sub">'+list.length+' of '+candidates().length+'</span>'+
    '<span class="sp">'+btn("exportCsv","Export")+btn("addCand","Add a candidate",true)+'</span></div>'+
    '<div class="search"><input type="search" id="q" data-a="q" placeholder="Search name, title, skill, city…" value="'+esc(UI.q)+'"></div>'+
    '<section class="card"><div class="card-b flush">'+body+'</div></section>';
}
function viewPersonDetail(p){
  const subs = personSubs(p.id).sort((a,b) => new Date(b.stageSince) - new Date(a.stageSince));
  const backTo = p.isContact ? "orgs" : "cands";
  const o = p.orgId ? org(p.orgId) : null;
  const details = '<div class="card-b"><dl class="dl">'+
    dd("Email", p.email?'<a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a>':"—")+
    dd("Phone", esc(p.phone||"—"))+
    dd("Location", esc(p.city||"—"))+
    dd("Title", esc(p.title||"—"))+
    (p.isCandidate?dd("Experience", p.years?p.years+" years":"—"):"")+
    (p.isCandidate?dd("Work authorization", esc(p.workAuth||"—")):"")+
    (p.isCandidate?dd("Wants", p.desiredPay?money0(p.desiredPay)+"/hr":"—"):"")+
    (p.isCandidate?dd("Available from", esc(fmtDate(p.availFrom))):"")+
    (o?dd("Company",'<a href="#" data-a="openOrg" data-id="'+o.id+'">'+esc(o.name)+'</a>'):"")+
    dd("Last contact", esc(fmtAgo(p.lastContact)))+
  '</dl>'+
  (p.skills&&p.skills.length?'<div style="margin-top:.75rem"><span class="eyebrow">Skills</span><div class="chips" style="margin-top:.3rem">'+p.skills.map(s=>'<span class="chip">'+esc(s)+'</span>').join("")+'</div></div>':"")+
  (p.notes?'<div class="note" style="margin-top:.75rem"><span class="w">Notes</span>'+esc(p.notes)+'</div>':"")+
  '</div>';

  const hist = subs.length ? '<div class="tw"><table><thead><tr><th>Job</th><th>Company</th><th>Stage</th><th class="num">Since</th><th></th></tr></thead><tbody>'+
    subs.map(s => { const j = job(s.jobId);
      return '<tr><td><span class="nm">'+esc(j?j.title:"—")+'</span></td>'+
        '<td class="sec">'+esc(j?orgName(j.orgId):"—")+'</td>'+
        '<td>'+stagePill(s.stage)+'</td>'+
        '<td class="num">'+daysAgo(s.stageSince)+'d</td>'+
        '<td class="num"><button class="btn sm" data-a="openSub" data-id="'+s.id+'">Open</button></td></tr>'; }).join("")+
    '</tbody></table></div>' : emptyBox("Not in any pipeline","This person has not been submitted anywhere yet.");

  const acts = READONLY ? "" : '<span class="sp">'+
    (p.isCandidate?btn("submitToJob","Submit to a job",true):"")+
    btn("logContact","Log contact")+ btn("editPerson","Edit")+'</span>';
  return '<button class="back" data-a="view" data-v="'+backTo+'">← Back</button>'+
    '<div class="ph"><h1>'+esc(p.name)+'</h1><span class="sub">'+esc(p.title||"")+(o?" · "+esc(o.name):"")+'</span>'+acts+'</div>'+
    '<div class="cols2"><div class="grid">'+
      card("Activity", '<span class="sub">logged against the role we were dealing with</span>', timelineCard(p), false)+
      card("Pipeline","",hist,true)+
    '</div><div class="grid">'+
      card("Roles","",rolesCard(p),false)+
      card("Details","",details,false)+
      card("Change history","",historyCard(p.id),false)+
    '</div></div>';
}

  const q = (UI.q||"").trim().toLowerCase();
  let list = S.orgs.filter(o => !o.archived);
  if(UI.orgOwner === "mine") list = list.filter(ownedByMe);
  else if(UI.orgOwner === "none") list = list.filter(o => !orgOwners(o).length);
  if(q) list = list.filter(o => (o.name+" "+o.kind+" "+(o.notes||"")+" "+orgOwners(o).join(" ")).toLowerCase().includes(q));
  const body = list.length ? '<div class="tw"><table><thead><tr>'+
      '<th>Account</th><th>Owners</th><th>Type</th><th class="num">Locations</th><th class="num">Open jobs</th><th class="num">Contacts</th><th class="num">Docs</th><th>Status</th>'+
    '</tr></thead><tbody>'+
    list.map(o => {
      const js = orgJobs(o.id), openJ = js.filter(j=>j.status==="Open").length;
      const pls = S.placements.filter(pl => { const s = sub(pl.subId); const j = s?job(s.jobId):null; return j && (j.orgId===o.id||j.endClientOrgId===o.id); });
      const ow = orgOwners(o);

/* ---------- PLACEMENTS ---------- */
function viewPlace(){
  const list = S.placements.slice().sort((a,b) => new Date(b.startsOn) - new Date(a.startsOn));
  let totGM = 0;
  list.forEach(p => { if(p.status==="Active"){ const s=sub(p.subId), j=s?job(s.jobId):null;
    if(!(j&&j.type==="Direct hire")) totGM += margin(p.payRate,p.billRate,p.burdenPct).gm*40; } });
  const body = list.length ? '<div class="tw"><table><thead><tr>'+
      '<th>Contractor</th><th>Client</th><th>Type</th><th class="num">Pay</th><th class="num">Bill</th>'+
      '<th class="num">Burden</th><th class="num">GM $/hr</th><th class="num">GM %</th><th class="num">Markup</th>'+
      '<th class="num">Ends</th><th>Status</th>'+
    '</tr></thead><tbody>'+
    list.map(p => {
      const s = sub(p.subId), pe = s?person(s.personId):null, j = s?job(s.jobId):null;
      const isPerm = j && j.type==="Direct hire";
      const m = margin(p.payRate,p.billRate,p.burdenPct);
      const d = p.endsOn ? daysUntil(p.endsOn) : null;
      return '<tr class="clk" data-a="openPlacement" data-id="'+p.id+'">'+
        '<td>'+who(pe?pe.name:"—", esc(j?j.title:""))+'</td>'+
        '<td class="sec">'+esc(j?orgName(j.orgId):"—")+'</td>'+
        '<td><span class="pill n">'+esc(j?j.type:"—")+'</span></td>'+
        (isPerm
          ? '<td class="num sec" colspan="6">fee '+money0(p.fee)+'</td>'
          : '<td class="num">'+money(p.payRate)+'</td><td class="num">'+money(p.billRate)+'</td>'+
            '<td class="num sec">'+pct(p.burdenPct)+'</td>'+
            '<td class="num" style="color:var(--money);font-weight:600">'+money(m.gm)+'</td>'+
            '<td class="num">'+pct(m.gmPct)+'</td><td class="num sec">'+pct(m.markupPct)+'</td>')+
        '<td class="num"'+(d!=null&&d<=30?' style="color:var(--warn)"':'')+'>'+(p.endsOn?fmtDate(p.endsOn):"—")+'</td>'+
        '<td>'+statusPill(p.status)+'</td></tr>';
    }).join("")+'</tbody></table></div>'
    : emptyBox("No placements yet","Move a candidate to Placed on a job and the placement is created here, with the margin worked out for you.");
  return '<div class="ph"><h1>Placements</h1><span class="sub">'+money0(totGM)+' weekly gross margin from active hourly placements</span>'+
    '<span class="sp">'+btn("exportPlacements","Export")+'</span></div>'+
    '<section class="card"><div class="card-b flush">'+body+'</div></section>';
}

/* ---------- form field helpers ---------- */
function fld(name,label,val,opts){
  opts = opts||{};
  const t = opts.type||"text";
  const req = opts.req?' <span class="req">*</span>':"";
  const hint = opts.hint?'<span class="hint">'+esc(opts.hint)+'</span>':"";
  const extra = (opts.step?' step="'+opts.step+'"':"") + (opts.min!=null?' min="'+opts.min+'"':"") +
                (opts.ph?' placeholder="'+esc(opts.ph)+'"':"") + (opts.calc?' data-calc="1"':"");
  if(t==="textarea") return '<label class="f"><span>'+esc(label)+req+'</span><textarea name="'+name+'"'+extra+'>'+esc(val==null?"":val)+'</textarea>'+hint+'</label>';
  if(t==="select"){
    const o = (opts.options||[]).map(x => {
      const v = typeof x==="object"?x.v:x, l = typeof x==="object"?x.l:x;
      return '<option value="'+esc(v)+'"'+(String(val)===String(v)?" selected":"")+'>'+esc(l)+'</option>';
    }).join("");
    return '<label class="f"><span>'+esc(label)+req+'</span><select name="'+name+'"'+(opts.calc?' data-calc="1"':"")+'>'+
      (opts.blank?'<option value="">'+esc(opts.blank)+'</option>':"")+o+'</select>'+hint+'</label>';
  }
  return '<label class="f"><span>'+esc(label)+req+'</span><input type="'+t+'" name="'+name+'" value="'+esc(val==null?"":val)+'"'+extra+'>'+hint+'</label>';
}
function modalShell(title, body, footer){
  return '<div class="scrim" data-a="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'+
    '<div class="modal-h"><h2>'+esc(title)+'</h2><button class="x" data-a="closeModal" aria-label="Close">×</button></div>'+
    '<form data-a="form"><div class="modal-b">'+(UI.err?'<p class="ferr">'+esc(UI.err)+'</p>':"")+body+'</div>'+
    '<div class="modal-f">'+footer+'</div></form></div></div>';
}
function stdFooter(label, extra){
  return (extra||"")+'<span class="sp"><button type="button" class="btn" data-a="closeModal">Cancel</button>'+
    '<button type="submit" class="btn pri">'+esc(label)+'</button></span>';
}

const TITLE_WORDS = ["engineer","developer","architect","administrator","analyst","manager","director","lead",
  "specialist","consultant","technician","scientist","designer","recruiter","coordinator","supervisor",
  "president","vp","officer","cto","cio","ceo","controller","accountant","nurse","programmer","devops",
  "sre","tester","qa","scrum master","product owner","head of","principal","staff","intern","associate"];

const RX_EMAIL = /[\w.+-]+@[\w-]+\.[\w.-]{2,}/;
const RX_PHONE = /(?:\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}\b/;
const RX_HOURLY = /\$\s?(\d{1,3}(?:\.\d{1,2})?)\s*(?:\/\s*|per\s+)?(?:hr|hour|hourly)\b/i;
const RX_SALARY_K = /\$\s?(\d{2,3})\s?k\b/i;
const RX_SALARY = /\$\s?(\d{2,3},\d{3}|\d{5,6})\b/;
const RX_CITY = /\b([A-Z][a-zA-Z.\-']+(?:\s+[A-Z][a-zA-Z.\-']+){0,2}),\s*([A-Z]{2})\b/;
const RX_YEARS = /(\d{1,2})\s*\+?\s*(?:years|yrs|yoe)\b/i;
const RX_BILL = /\bbill(?:\s*rate)?\s*(?:is|at|=|:)?\s*\$?\s?(\d{1,3}(?:\.\d{1,2})?)/i;
const RX_PAY = /\bpay(?:\s*rate)?\s*(?:is|at|=|:)?\s*\$?\s?(\d{1,3}(?:\.\d{1,2})?)/i;

function tidyPhone(s){
  const d = digits(s);
  const t = d.length === 11 && d[0] === "1" ? d.slice(1) : d;
  return t.length === 10 ? "("+t.slice(0,3)+") "+t.slice(3,6)+"-"+t.slice(6) : s.trim();
}
function titleCaseName(s){
  return String(s).split(/\s+/).map(w => w ? w[0].toUpperCase()+w.slice(1) : w).join(" ");
}
function looksLikeName(line){
  const t = line.trim().replace(/[,|].*$/, "");
  if(!t || t.length > 42) return false;
  if(/[@\d]/.test(t)) return false;
  const parts = t.split(/\s+/);
  if(parts.length < 2 || parts.length > 4) return false;
  if(TITLE_WORDS.some(w => t.toLowerCase().includes(w))) return false;
  return parts.every(w => /^[A-Z][a-zA-Z.\-']*$/.test(w) || /^[A-Z]\.$/.test(w));
}

/* ---------- resume text extraction ---------- */
async function inflateRaw(bytes){
  const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
function readZipEntries(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for(let i = buf.length - 22; i >= 0 && i > buf.length - 66000; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("not a zip");
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const out = {};
  for(let n = 0; n < count; n++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nlen = dv.getUint16(off + 28, true);
    const elen = dv.getUint16(off + 30, true);
    const clen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(buf.subarray(off + 46, off + 46 + nlen));
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lnlen + lelen;
    out[name] = { method, bytes: buf.subarray(start, start + csize) };
    off += 46 + nlen + elen + clen;
  }
  return out;
}
async function docxText(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const e = readZipEntries(buf);
  const doc = e["word/document.xml"];
  if(!doc) throw new Error("no document.xml");
  const raw = doc.method === 0 ? doc.bytes : await inflateRaw(doc.bytes);
  const xml = new TextDecoder().decode(raw);
  return xml
    .replace(/<\/w:p>/g, "\n")
    .replace(/<w:tab[^>]*\/>/g, "  ")
    .replace(/<w:br[^>]*\/>/g, "\n")
    .replace(/<[^>]+>/g, "")
    .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&apos;/g, "'");
}
function pdfDecodeTextOps(s){
  let out = "";
  const rx = /\((?:\\.|[^\\()])*\)|\[((?:\s*\((?:\\.|[^\\()])*\)\s*-?\d*\.?\d*)*)\]\s*TJ|(Td|TD|T\*|Tj|ET)/g;
  let m;
  while((m = rx.exec(s))){
    if(m[0][0] === "("){
      out += m[0].slice(1, -1).replace(/\\([nrt\\()])/g, (x, c) => ({n:"\n", r:"\n", t:"  ", "\\":"\\", "(":"(", ")":")"}[c]));
    }else if(m[1] != null){
      out += m[1].replace(/\((?:\\.|[^\\()])*\)/g, q => q.slice(1, -1)).replace(/\s*-?\d+\.?\d*\s*/g, "");
    }else if(m[3] === "Td" || m[3] === "TD" || m[3] === "T*" || m[3] === "ET"){
      out += "\n";
    }
  }
  return out;
}
async function pdfText(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const latin = new TextDecoder("latin1").decode(buf);
  let text = "";
  const rx = /stream\r?\n?/g;
  let m;
  while((m = rx.exec(latin))){
    const start = m.index + m[0].length;
    const end = latin.indexOf("endstream", start);
    if(end < 0) continue;
    const slice = buf.subarray(start, end);
    let decoded = null;
    if(slice[0] === 0x78){
      try{ decoded = new TextDecoder("latin1").decode(await inflateRaw(slice.subarray(2))); }catch(e){}
    }
    if(decoded == null){
      const asTxt = latin.slice(start, end);
      if(/\)\s*Tj|TJ\b/.test(asTxt)) decoded = asTxt;
    }
    if(decoded && /\)\s*Tj|TJ\b/.test(decoded)) text += pdfDecodeTextOps(decoded) + "\n";
    rx.lastIndex = end;
  }
  return text;
}
function textQuality(t){
  if(!t) return 0;
  const letters = (t.match(/[A-Za-z]/g) || []).length;
  return letters / Math.max(1, t.length);
}
function cleanText(t){
  return String(t || "")
    .replace(/\r\n?/g, "\n")
    .replace(/[ \t ]+/g, " ")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}
async function fileToText(file){
  const n = (file.name || "").toLowerCase();
  if(/\.docx$/.test(n)) return cleanText(await docxText(file));
  if(/\.pdf$/.test(n))  return cleanText(await pdfText(file));
  if(/\.(txt|md|markdown|csv|tsv|rtf|json|html?)$/.test(n)) return cleanText(await file.text());
  if(/\.doc$/.test(n)) throw new Error("legacy-doc");
  return cleanText(await file.text());
}

/* ---------- resume -> fields ---------- */
function findSkills(text){
  const low = " " + text.toLowerCase().replace(/[\n,;|/]+/g, " ") + " ";
  const hits = [];
  SKILL_VOCAB.forEach(v => {
    const clean = v.replace(/\\/g, "");
    const rx = new RegExp("(^|[^a-z0-9+#.])" + v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\\\\/g, "\\") + "([^a-z0-9+#]|$)", "i");
    if(rx.test(low)) hits.push(clean);
  });
  const sec = text.match(/(?:technical\s+)?skills?\s*[:\n]([\s\S]{0,400})/i);
  if(sec){
    sec[1].split("\n").slice(0, 6).join(",").split(/[,;|•·•]/).forEach(tok => {
      const t = tok.trim().replace(/^[-–\s]+/, "");
      if(t.length >= 2 && t.length <= 28 && /[a-zA-Z]/.test(t) && !/\s{2,}/.test(t) && t.split(/\s+/).length <= 3) hits.push(t);
    });
  }
  const seen = new Set(), out = [];
  hits.forEach(h => {
    const k = h.toLowerCase();
    if(!seen.has(k)){ seen.add(k); out.push(titleCaseSkill(h)); }
  });
  return out.slice(0, 14);
}
function titleCaseSkill(s){
  const upper = ["aws","gcp","sql","api","etl","qa","ux","ui","nlp","llm","sre","php","css","html","rest","grpc",
                 "cissp","pmp","itil","ccna","ccnp","soc","iam","siem","emr","ehr","rn","bls","acls","wms","osha",
                 "cpa","gaap","hl7","fhir","hipaa","cto","cio","ceo","vp","sap","erp","crm"];
  if(upper.includes(s.toLowerCase())) return s.toUpperCase();
  if(/^[a-z]/.test(s) && s.length > 2) return s[0].toUpperCase() + s.slice(1);
  return s;
}
function guessName(text, filename, email){
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean).slice(0, 12);
  for(const l of lines) if(looksLikeName(l)) return l.replace(/[,|].*$/, "").trim();
  if(email){
    const local = email.split("@")[0].replace(/\d+/g, "");
    const parts = local.split(/[._-]+/).filter(p => p.length > 1);
    if(parts.length >= 2) return titleCaseName(parts.slice(0, 2).join(" "));
  }
  if(filename){
    const base = filename.replace(/\.[a-z0-9]+$/i, "").replace(/[_-]+/g, " ")
      .replace(/\b(resume|cv|curriculum vitae|final|updated|\d{4})\b/gi, "").trim();
    if(base.split(/\s+/).length >= 2) return titleCaseName(base);
  }
  return "";
}
function guessTitle(text, name){
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean).slice(0, 18);
  for(const l of lines){
    if(name && l.toLowerCase() === name.toLowerCase()) continue;
    if(l.length > 72 || /[@]/.test(l)) continue;
    const low = l.toLowerCase();
    if(TITLE_WORDS.some(w => low.includes(w)) && !/^(summary|objective|experience|education|skills)\b/.test(low)){
      return l.replace(/[|•].*$/, "").replace(/^[-–\s]+/, "").trim();
    }
  }
  return "";
}
function parseResume(text, filename){
  const f = {};
  const em = text.match(RX_EMAIL); if(em) f.email = em[0];
  const ph = text.match(RX_PHONE); if(ph) f.phone = tidyPhone(ph[0]);
  const ct = text.match(RX_CITY);  if(ct) f.city = ct[1].trim() + ", " + ct[2];
  const yr = text.match(RX_YEARS); if(yr) f.years = +yr[1];
  const hr = text.match(RX_HOURLY); if(hr) f.desiredPay = +hr[1];
  f.skills = findSkills(text);
  f.name = guessName(text, filename, f.email);
  f.title = guessTitle(text, f.name);
  return f;
}

/* ---------- free-text field extraction ---------- */
function extractFields(rest, kind){
  const f = { skills: [] };
  let s = " " + rest + " ";

  const em = s.match(RX_EMAIL); if(em){ f.email = em[0]; s = s.replace(em[0], " "); }
  const ph = s.match(RX_PHONE); if(ph){ f.phone = tidyPhone(ph[0]); s = s.replace(ph[0], " "); }

  const bill = s.match(RX_BILL); if(bill){ f.billMax = +bill[1]; s = s.replace(bill[0], " "); }
  const pay  = s.match(RX_PAY);  if(pay){  f.payMax  = +pay[1];  s = s.replace(pay[0], " "); }
  const hr = s.match(RX_HOURLY); if(hr){ f.desiredPay = +hr[1]; s = s.replace(hr[0], " "); }
  const sk = s.match(RX_SALARY_K); if(sk){ f.salaryMin = +sk[1] * 1000; s = s.replace(sk[0], " "); }
  else { const sal = s.match(RX_SALARY); if(sal){ f.salaryMin = +String(sal[1]).replace(/,/g, ""); s = s.replace(sal[0], " "); } }

  const yr = s.match(RX_YEARS); if(yr){ f.years = +yr[1]; s = s.replace(yr[0], " "); }

  const skm = s.match(/\bskills?\s*(?:are|:|=)?\s*([^,;]*(?:,[^,;]*){0,12})/i);
  if(skm){ f.skills = skm[1].split(/[,/|]/).map(x => x.trim()).filter(x => x.length > 1).slice(0, 14).map(titleCaseSkill); s = s.replace(skm[0], " "); }

  const co = s.match(/\b(?:at|for|with|@)\s+([A-Z][\w&.'-]*(?:\s+[A-Z][\w&.'-]*){0,4})/);
  if(co){ f.company = co[1].trim().replace(/[.,]$/, ""); s = s.replace(co[0], " "); }

  const ct = s.match(RX_CITY); if(ct){ f.city = ct[1].trim() + ", " + ct[2]; s = s.replace(ct[0], " "); }
  else {
    const rem = s.match(/\b(?:in|based in|located in)\s+([A-Z][a-zA-Z.\-']+(?:\s+[A-Z][a-zA-Z.\-']+){0,2})/);
    if(rem){ f.city = rem[1].trim(); s = s.replace(rem[0], " "); }
  }
  if(/\bremote\b/i.test(s)){ f.city = f.city || "Remote"; }

  const jt = s.match(/\b(contract to hire|contract-to-hire|c2h|contract|direct hire|perm(?:anent)?|sow|project)\b/i);
  if(jt){
    const v = jt[1].toLowerCase();
    f.jobType = /c2h|contract to hire|contract-to-hire/.test(v) ? "Contract-to-hire"
      : /direct|perm/.test(v) ? "Direct hire"
      : /sow|project/.test(v) ? "SOW / project" : "Contract";
    s = s.replace(jt[0], " ");
  }

  const frags = s.split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
  frags.forEach(fr => {
    const low = fr.toLowerCase();
    if(!f.title && TITLE_WORDS.some(w => low.includes(w)) && fr.length <= 72){ f.title = fr; return; }
    if(!f.name && looksLikeName(fr)){ f.name = fr; return; }
  });
  if(!f.name){
    const lead = frags[0];
    if(lead && kind !== "company" && kind !== "job" && !/[@\d]/.test(lead) && lead.split(/\s+/).length <= 4) f.name = titleCaseName(lead);
  }
  if((kind === "company") && !f.name){
    const lead = frags[0]; if(lead) f.name = lead.trim();
  }
  if(kind === "job" && !f.title){
    const lead = frags[0]; if(lead && lead.length <= 72) f.title = lead.trim();
  }
  return f;
}

const KIND_LABEL = { cand:"candidate", contact:"contact", company:"company", job:"job" };

function nextMissing(kind, f){
  const rules = NEEDS[kind] || [];
  for(const r of rules) if(!r.ok(f)) return r;
  return null;
}
function askFor(kind, f, rule){
  CHAT.pending = { kind, fields: f, slot: rule.slot };
  const q = typeof rule.ask === "function" ? rule.ask(f) : rule.ask;
  say(q + (rule.hint ? "\n\n_" + rule.hint + "_" : ""), rule.chips ? rule.chips() : null);
  saveChat();
}
function offerDraft(kind, f, note){
  const id = "d" + (++CHAT.seq);
  CHAT.drafts[id] = { kind, fields: f };
  CHAT.pending = null;
  push("as", "draft", { id, kind, note: note || null });
  saveChat();
}
function startAdd(kind, fields, note){
  const f = Object.assign({ skills: [] }, fields || {});
  const miss = nextMissing(kind, f);
  if(miss) askFor(kind, f, miss);
  else offerDraft(kind, f, note);
}

/* ---------- searching ---------- */
function findOrgByName(q){
  const t = q.trim().toLowerCase();
  if(!t) return null;
  return S.orgs.find(o => o.name.toLowerCase() === t)
      || S.orgs.find(o => o.name.toLowerCase().indexOf(t) === 0)
      || S.orgs.find(o => o.name.toLowerCase().includes(t) && t.length >= 3)
      || null;
}
function searchAll(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = hay => { const h = hay.toLowerCase(); return terms.every(t => h.includes(t)); };
  return {
    cands: candidates().filter(p => hit([p.name, p.title, p.city, p.workAuth, (p.skills||[]).join(" "), p.notes].join(" "))),
    cons:  contacts().filter(p => hit([p.name, p.title, orgName(p.orgId), p.notes].join(" "))),
    orgs:  S.orgs.filter(o => hit([o.name, o.kind, o.notes].join(" "))),
    jobs:  S.jobs.filter(j => hit([j.title, orgName(j.orgId), j.city, j.type, j.notes].join(" ")))
  };
}

/* ---------- the command router ---------- */
function looksLikeCommand(t){
  return /^(add|new|create|find|search|show|list|who|help|clear|cancel|never ?mind|open|pull ?up|import|assign|unassign|remove|give|i am|i'm|my name is|call me|how many|count|what|display|get me)\b/i.test(t.trim());
}
function runAssistant(raw, quiet){
  const text = String(raw || "").trim();
  if(!text) return;
  if(!quiet) heard(text);

  if(/^(cancel|never ?mind|stop|forget it)$/i.test(text)){
    CHAT.pending = null;
    say("Cancelled — nothing was saved.");
    return finishTurn();
  }

  /* answering one of our own questions, for the flows with bespoke slots */
  if(CHAT.pending && CHAT.pending.kind === "identity"){
    const nm = text.replace(/^\s*(?:i am|i'm|im|my name is|call me|this is)\s+/i, "").trim();
    if(nm){
      setMe(titleCaseName(nm));
      const replay = CHAT.pending.replay;
      CHAT.pending = null;
      say("Thanks — you are **" + ME + "** on this device.");
      if(replay){ saveChat(); return runAssistant(replay, true); }
      return finishTurn();
    }
  }
  if(CHAT.pending && CHAT.pending.kind === "fileDoc"){
    const doc = CHAT.pending.fields.doc;
    const r = resolveOrg(text);
    const ls = orgLocations(r.org.id);
    if(ls.length){
      CHAT.pending = { kind:"docScope", fields:{ doc, orgId:r.org.id, created:r.created }, slot:"scope" };
      say("Is that agreement for **all of " + r.org.name + "**, or just one location?",
          ["All of " + r.org.name].concat(ls.map(l => l.name)));
      return finishTurn();
    }
    fileDocToOrg(doc, r.org, null, r.created);
    return;
  }
  if(CHAT.pending && CHAT.pending.kind === "docScope"){
    const fl = CHAT.pending.fields;
    const o = org(fl.orgId), ls = orgLocations(fl.orgId);
    const low = text.toLowerCase();
    const hit = ls.find(l => l.name.toLowerCase() === low.trim())
             || ls.find(l => low.includes(l.name.toLowerCase()));
    const wide = /\ball\b|whole|entire|account[- ]wide|holistic|everything/.test(low);
    fileDocToOrg(fl.doc, o, (wide || !hit) ? null : hit, fl.created);
    return;
  }
  if(CHAT.pending && CHAT.pending.kind === "actRole"){
    const fl = CHAT.pending.fields;
    const p = person(fl.personId);
    CHAT.pending = null;
    if(p){
      const choices = contextChoices(p);
      const low = text.toLowerCase();
      let pick = choices.find(c => c.label.toLowerCase() === low)
              || choices.find(c => low.includes(c.label.toLowerCase()))
              || choices.find(c => /manager|contact/.test(low) && c.role === "contact")
              || choices.find(c => /candidate/.test(low) && c.role === "candidate")
              || choices[0];
      const a = logActivity(p.id, pick, fl.actKind, fl.note);
      say("Logged a **" + fl.actKind.toLowerCase() + "** with **" + p.name + "** " +
          (a.role === "candidate" ? "as a **candidate**" : "as the **hiring manager**") +
          (a.orgId ? " on **" + orgName(a.orgId) + "**" : "") + ".");
      render(); save();
      return;
    }
    return finishTurn();
  }
  if(CHAT.pending && CHAT.pending.kind === "spOrg"){
    const fl = CHAT.pending.fields;
    const row = (CHAT.sp || {})[fl.rid];
    const r = resolveOrg(text);
    CHAT.pending = null;
    if(row){ spAttachTo(row, r.org.id, fl.alsoIndex, r.created); return; }
    return finishTurn();
  }
  if(CHAT.pending && CHAT.pending.kind === "roleOrg"){
    const p = person(CHAT.pending.fields.personId);
    const r = resolveOrg(text);
    CHAT.pending = null;
    if(p){
      grantRole(p, "contact", r.org.id);
      say("**" + p.name + "** is now a contact at **" + r.org.name + "**" +
          (p.isCandidate ? " as well as a candidate — one record, both roles." : ".") );
      render(); save();
      return;
    }
    return finishTurn();
  }
  if(CHAT.pending && CHAT.pending.kind === "locOrg"){
    const r = resolveOrg(text);
    const f = CHAT.pending.fields;
    f.orgId = r.org.id;
    if(!f.name){
      CHAT.pending = { kind:"locName", fields:f, slot:"name" };
      say("What should I call that location at **" + r.org.name + "**? For example “Chicago HQ”.");
      return finishTurn();
    }
    createLocation(r.org, f, r.created);
    return;
  }
  if(CHAT.pending && CHAT.pending.kind === "locName"){
    const f = CHAT.pending.fields;
    f.name = text.trim();
    const o = org(f.orgId);
    if(!o){ CHAT.pending = null; say("I lost track of the account — try again."); return finishTurn(); }
    createLocation(o, f, false);
    return;
  }

  /* answering a question we asked */
  if(CHAT.pending && (!looksLikeCommand(text) || /^(skip)$/i.test(text))){
    const { kind, fields, slot } = CHAT.pending;
    const rule = (NEEDS[kind] || []).find(r => r.slot === slot);
    if(rule){
      if(/^skip$/i.test(text)){
        if(rule.skippable){
          fields["_skip_" + slot] = true;
          rule.ok = rule.ok;
          const others = (NEEDS[kind] || []).filter(r => r.slot !== slot && !r.ok(fields));
          if(others.length) askFor(kind, fields, others[0]);
          else offerDraft(kind, fields, "Saved without a contact method — you can add one later.");
          return finishTurn();
        }
        say("I do need that one to create the "+KIND_LABEL[kind]+".");
        return finishTurn();
      }
      const merged = extractFields(text, kind);
      const filled = rule.fill(text, fields);
      ["email","phone","title","city","company","years","desiredPay","billMax","payMax","salaryMin","jobType"].forEach(k => {
        if(fields[k] == null && merged[k] != null) fields[k] = merged[k];
      });
      if(merged.skills && merged.skills.length && !(fields.skills||[]).length) fields.skills = merged.skills;
      if(!filled && !rule.ok(fields)){
        say("I could not read that as "+(rule.slot === "company" ? "a company name" : rule.slot === "contactWay" || rule.slot === "contact" ? "an email or phone number" : "a "+rule.slot)+". Try again?");
        return finishTurn();
      }
      const miss = nextMissing(kind, fields);
      if(miss) askFor(kind, fields, miss);
      else offerDraft(kind, fields);
      return finishTurn();
    }
    CHAT.pending = null;
  }

  const low = text.toLowerCase();

  if(/^help\b|^what can you do/.test(low)){ sayHelp(); return finishTurn(); }
  if(/^clear\b.*(chat|conversation|history)/.test(low)){
    CHAT.msgs = []; CHAT.pending = null; CHAT.drafts = {};
    say("Cleared. What next?");
    return finishTurn();
  }

  let m;
  if((m = low.match(/^(?:add|new|create|import)\s+(?:a\s+|an\s+)?(?:candidate|cand)\b[\s:,-]*/))){
    return startAdd("cand", extractFields(text.slice(m[0].length), "cand")), finishTurn();
  }
  if((m = low.match(/^(?:add|new|create)\s+(?:a\s+|an\s+)?(?:hiring\s+manager|manager|contact|client contact|hm)\b[\s:,-]*/))){
    return startAdd("contact", extractFields(text.slice(m[0].length), "contact")), finishTurn();
  }
  if((m = low.match(/^(?:add|new|create)\s+(?:a\s+|an\s+)?(?:company|client|account|organisation|organization|org)\b[\s:,-]*/))){
    const f = extractFields(text.slice(m[0].length), "company");
    if(!f.name && f.company) f.name = f.company;
    return startAdd("company", f), finishTurn();
  }
  if((m = low.match(/^(?:add|new|create)\s+(?:a\s+|an\s+)?(?:job|req|requisition|role|opening|position)\b[\s:,-]*/))){
    return startAdd("job", extractFields(text.slice(m[0].length), "job")), finishTurn();
  }

  if(tryIdentity(text)) return finishTurn();
  if(tryRoles(text)) return finishTurn();
  if(tryLogActivity(text)) return finishTurn();
  if(trySharePoint(text)) return finishTurn();
  if(tryLocations(text)) return finishTurn();
  if(tryOwnership(text)) return finishTurn();
  if(tryDocSearch(text)) return finishTurn();
  if(tryDocList(text)) return finishTurn();
  if(tryListQuery(text)) return finishTurn();

  /* contacts at a company */
  if((m = text.match(/(?:who do we know at|who works at|contacts? at|people at|team at|pull up|contacts? for)\s+(.+)$/i))){
    return companyCard(m[1].trim()), finishTurn();
  }
  if(/^(show|list)\b.*\b(open\s+)?jobs?\b/.test(low)){
    return push("as","results",{ q:"open jobs", ids:{ jobs:S.jobs.filter(j=>j.status==="Open").map(j=>j.id) } }), finishTurn();
  }
  if(/^(show|list)\b.*\bplacements?\b/.test(low)){
    UI.view = "place"; saveUI();
    say("Opening placements.");
    return finishTurn();
  }
  if(/needs? (my )?attention|stalled|stuck/.test(low)){
    UI.view = "desk"; saveUI();
    say("The desk shows everything with no movement in five or more days.");
    return finishTurn();
  }

  /* a bare company name */
  const asOrg = findOrgByName(text);
  if(asOrg && text.split(/\s+/).length <= 5){ return companyCard(text), finishTurn(); }

  /* otherwise: search */
  const q = text.replace(/^(find|search|search for|look for|show me|show|list|any|open)\s+/i, "").trim() || text;
  return doSearch(q), finishTurn();
}
function finishTurn(){ saveChat(); render(); }

  say("Ask in plain English. **Adding:**", [
    "add candidate Priya Raman, priya@example.com, senior java engineer in Chicago, $80/hr",
    "add manager Dana Whitfield at Northwind Health, director of engineering",
    "add job data engineer at Ardent Logistics, contract, bill 98 pay 66",

  ]);
  say("**Lists and searching:**", [
    "list of accounts",
    "my accounts",
    "unassigned accounts",
    "open jobs in dallas",
    "candidates with kubernetes",
    "who do we know at Northwind Health",
    "search documents for termination"
  ]);
  say("**Ownership:** an account can have several owners — “assign Northwind Health to me”, “who owns Ardent Logistics”, “unassign me from Northwind Health”.");
  say("**Logging:** “log call with Dana about Northwind”. If someone is both a candidate and a hiring manager, I work out which hat you were wearing from where you were working — and ask only when it is genuinely ambiguous. It never creates a second record.");
