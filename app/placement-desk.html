<title>Placement Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">
<style id="app-css">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --ground:#EEF1EA; --surface:#F9FAF6; --surface-2:#E6EBDF; --surface-3:#DCE3D3;
  --ink:#1A211D; --ink-2:#3D4741; --muted:#5B665E; --faint:#8B958C;
  --rule:#D3D9CB; --rule-strong:#BCC5B2;
  --accent:#1E5A4A; --accent-ink:#FFFFFF; --accent-soft:#DCE7DF;
  --money:#7D5F16; --money-soft:#EFE7CE;
  --warn:#8A6414; --warn-soft:#F3EBD5;
  --alert:#93372A; --alert-soft:#F2E1DC;
  --good:#1E5A4A; --good-soft:#DCE7DF;
  --shadow:0 1px 2px rgba(26,33,29,.06),0 8px 24px rgba(26,33,29,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131714; --surface:#1B211D; --surface-2:#232A25; --surface-3:#2C352E;
    --ink:#E3E8DF; --ink-2:#C4CCC1; --muted:#94A099; --faint:#6E7A72;
    --rule:#2C3630; --rule-strong:#3B4740;
    --accent:#6EBFA3; --accent-ink:#0E1512; --accent-soft:#1E2A25;
    --money:#C9A24B; --money-soft:#2A2517;
    --warn:#D9B85C; --warn-soft:#2A2417;
    --alert:#D97A63; --alert-soft:#2C1D19;
    --good:#6EBFA3; --good-soft:#1E2A25;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#131714; --surface:#1B211D; --surface-2:#232A25; --surface-3:#2C352E;
  --ink:#E3E8DF; --ink-2:#C4CCC1; --muted:#94A099; --faint:#6E7A72;
  --rule:#2C3630; --rule-strong:#3B4740;
  --accent:#6EBFA3; --accent-ink:#0E1512; --accent-soft:#1E2A25;
  --money:#C9A24B; --money-soft:#2A2517;
  --warn:#D9B85C; --warn-soft:#2A2417;
  --alert:#D97A63; --alert-soft:#2C1D19;
  --good:#6EBFA3; --good-soft:#1E2A25;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
}
body{
  background:var(--ground); color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button{font-family:inherit; font-size:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- chrome ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--rule-strong);
}
.top-in{
  max-width:1500px; margin:0 auto; padding:.6rem clamp(.75rem,2.5vw,1.5rem);
  display:flex; align-items:center; gap:1.25rem; flex-wrap:wrap;
}
.logo{display:flex; align-items:baseline; gap:.5rem; margin-right:.25rem}
.logo b{font-weight:700; letter-spacing:-.02em; font-size:1.0625rem}
.logo span{
  font-family:"IBM Plex Mono",monospace; font-size:.625rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint);
}
nav.tabs{display:flex; gap:.15rem; flex-wrap:wrap}
nav.tabs button{
  border:0; background:transparent; color:var(--muted); padding:.4rem .7rem;
  border-radius:5px; font-weight:500; display:flex; align-items:center; gap:.4rem;
}
nav.tabs button:hover{background:var(--surface-2); color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--accent); color:var(--accent-ink)}
nav.tabs .cnt{
  font-family:"IBM Plex Mono",monospace; font-size:.6875rem; opacity:.75;
  font-variant-numeric:tabular-nums;
}
.top-right{margin-left:auto; display:flex; align-items:center; gap:.6rem}
.status{
  font-family:"IBM Plex Mono",monospace; font-size:.6875rem; color:var(--muted);
  min-height:1rem; text-align:right;
}
.status.busy{color:var(--money)}
.status.bad{color:var(--alert)}

.wrap{max-width:1500px; margin:0 auto; padding:1.25rem clamp(.75rem,2.5vw,1.5rem) 5rem}

/* ---------- banner ---------- */
.banner{
  display:flex; gap:.85rem; align-items:flex-start; background:var(--warn-soft);
  border:1px solid var(--rule); border-left:3px solid var(--warn);
  padding:.7rem .9rem; margin-bottom:1.25rem; border-radius:4px; font-size:.875rem;
}
.banner p{margin:0; color:var(--ink-2)}
.banner b{color:var(--ink)}
.banner .sp{margin-left:auto; display:flex; gap:.4rem; flex-shrink:0}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--rule-strong); background:var(--surface); color:var(--ink);
  padding:.4rem .75rem; border-radius:5px; font-weight:500; white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:.22rem .5rem; font-size:.8125rem}
.btn.dgr{color:var(--alert); border-color:var(--rule-strong)}
.btn.dgr:hover{background:var(--alert-soft)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.gh{border-color:transparent; background:transparent; color:var(--muted)}
.btn.gh:hover{background:var(--surface-2); color:var(--ink)}

/* ---------- headings / layout ---------- */
.ph{display:flex; align-items:flex-end; gap:1rem; margin:0 0 1rem; flex-wrap:wrap}
.ph h1{font-size:1.375rem; font-weight:600; letter-spacing:-.02em; margin:0}
.ph .sub{color:var(--muted); font-size:.875rem}
.ph .sp{margin-left:auto; display:flex; gap:.5rem; flex-wrap:wrap}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:.625rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--faint); font-weight:500;
}
.grid{display:grid; gap:1rem}
.cols2{display:grid; gap:1rem; grid-template-columns:1fr; align-items:start}
@media (min-width:960px){.cols2{grid-template-columns:1.35fr 1fr}}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:6px}
.card-h{
  padding:.6rem .9rem; border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:.6rem;
}
.card-h h2{font-size:.9375rem; font-weight:600; margin:0; letter-spacing:-.01em}
.card-h .sp{margin-left:auto; display:flex; gap:.4rem}
.card-b{padding:.9rem}
.card-b.flush{padding:0}

/* ---------- stat tiles ---------- */
.tiles{display:grid; gap:.75rem; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); margin-bottom:1.25rem}
.tile{background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:.8rem .9rem}
.tile .lab{
  font-family:"IBM Plex Mono",monospace; font-size:.625rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint); display:block; margin-bottom:.3rem;
}
.tile .val{
  font-size:1.75rem; font-weight:600; letter-spacing:-.03em; line-height:1.05;
  font-variant-numeric:tabular-nums; display:block;
}
.tile .val.mv{color:var(--money)}
.tile .foot{font-size:.75rem; color:var(--muted); margin-top:.25rem}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.875rem}
th,td{text-align:left; padding:.5rem .7rem; border-bottom:1px solid var(--rule); vertical-align:middle}
thead th{
  font-family:"IBM Plex Mono",monospace; font-size:.625rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); font-weight:500;
  background:var(--surface-2); white-space:nowrap; position:sticky; top:0;
}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--surface-2)}
td.num,th.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right}
td .nm{font-weight:600}
td .sec{color:var(--muted); font-size:.8125rem}
.empty{padding:2rem 1rem; text-align:center; color:var(--muted); font-size:.875rem}
.empty b{display:block; color:var(--ink); font-weight:600; margin-bottom:.25rem; font-size:.9375rem}

/* ---------- pills / chips ---------- */
.pill{
  display:inline-flex; align-items:center; gap:.3rem; padding:.14rem .45rem;
  border-radius:3px; font-family:"IBM Plex Mono",monospace; font-size:.6875rem;
  font-weight:500; white-space:nowrap; border:1px solid transparent;
}
.pill.n{background:var(--surface-2); color:var(--muted)}
.pill.a{background:var(--accent-soft); color:var(--accent)}
.pill.g{background:var(--good-soft); color:var(--good)}
.pill.w{background:var(--warn-soft); color:var(--warn)}
.pill.r{background:var(--alert-soft); color:var(--alert)}
.pill.m{background:var(--money-soft); color:var(--money)}
.chips{display:flex; flex-wrap:wrap; gap:.3rem}
.chip{
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule);
  padding:.1rem .4rem; border-radius:3px; font-size:.75rem;
}

/* ---------- pipeline board ---------- */
.board{display:grid; gap:.6rem; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.lane{background:var(--surface-2); border:1px solid var(--rule); border-radius:5px; min-height:90px; display:flex; flex-direction:column}
.lane-h{
  padding:.4rem .55rem; border-bottom:1px solid var(--rule); display:flex; gap:.4rem;
  align-items:center; font-size:.75rem; font-weight:600;
}
.lane-h .c{
  margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.6875rem;
  color:var(--muted); font-variant-numeric:tabular-nums;
}
.lane-b{padding:.4rem; display:flex; flex-direction:column; gap:.4rem}
.pcard{background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:.45rem .5rem; font-size:.8125rem}
.pcard .nm{font-weight:600; display:block; line-height:1.3}
.pcard .mt{color:var(--muted); font-size:.75rem; font-family:"IBM Plex Mono",monospace}
.pcard .acts{display:flex; gap:.25rem; margin-top:.4rem; flex-wrap:wrap}
.pcard .acts button{
  border:1px solid var(--rule-strong); background:var(--surface-2); border-radius:3px;
  padding:.1rem .35rem; font-size:.6875rem; color:var(--ink-2); line-height:1.4;
}
.pcard .acts button:hover{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.pcard .acts button.x:hover{background:var(--alert); border-color:var(--alert); color:#fff}

/* ---------- detail ---------- */
.dl{display:grid; grid-template-columns:auto 1fr; gap:.3rem .9rem; font-size:.875rem; margin:0}
.dl dt{color:var(--muted); font-size:.8125rem}
.dl dd{margin:0; font-weight:500}
.back{
  border:0; background:transparent; color:var(--muted); padding:.2rem 0; margin-bottom:.4rem;
  font-size:.8125rem; display:flex; align-items:center; gap:.35rem;
}
.back:hover{color:var(--accent)}
.note{
  background:var(--surface-2); border-left:2px solid var(--rule-strong); padding:.45rem .6rem;
  font-size:.8125rem; color:var(--ink-2); border-radius:0 3px 3px 0; margin-bottom:.4rem;
}
.note .w{
  display:block; font-family:"IBM Plex Mono",monospace; font-size:.6875rem;
  color:var(--faint); margin-bottom:.15rem;
}
.hist{list-style:none; margin:0; padding:0; font-size:.8125rem}
.hist li{display:flex; gap:.6rem; padding:.25rem 0; border-bottom:1px dashed var(--rule)}
.hist li:last-child{border:0}
.hist .w{
  font-family:"IBM Plex Mono",monospace; color:var(--faint); font-size:.75rem;
  flex-shrink:0; width:6.5rem;
}

/* ---------- search ---------- */
.search{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-bottom:.9rem}
.search input[type=search],.search input[type=text]{
  flex:1; min-width:180px; padding:.45rem .65rem; border:1px solid var(--rule-strong);
  border-radius:5px; background:var(--surface); color:var(--ink);
}
.search select{
  padding:.45rem .5rem; border:1px solid var(--rule-strong); border-radius:5px;
  background:var(--surface); color:var(--ink);
}

/* ---------- modal ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(16,22,18,.55); z-index:100;
  display:flex; align-items:flex-start; justify-content:center; padding:2rem 1rem; overflow-y:auto;
}
.modal{
  background:var(--surface); border:1px solid var(--rule-strong); border-radius:8px;
  box-shadow:var(--shadow); width:100%; max-width:620px; margin:auto;
}
.modal-h{padding:.85rem 1rem; border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:.6rem}
.modal-h h2{margin:0; font-size:1.0625rem; font-weight:600; letter-spacing:-.015em}
.modal-h .x{margin-left:auto; border:0; background:transparent; color:var(--muted); font-size:1.25rem; line-height:1; padding:.1rem .3rem; border-radius:4px}
.modal-h .x:hover{background:var(--surface-2); color:var(--ink)}
.modal-b{padding:1rem}
.modal-f{padding:.85rem 1rem; border-top:1px solid var(--rule); display:flex; gap:.5rem; align-items:center}
.modal-f .sp{margin-left:auto; display:flex; gap:.5rem}
.fg{display:grid; gap:.9rem}
.fr{display:grid; gap:.9rem; grid-template-columns:1fr}
@media (min-width:520px){.fr.two{grid-template-columns:1fr 1fr} .fr.three{grid-template-columns:1fr 1fr 1fr}}
label.f{display:grid; gap:.25rem}
label.f>span{font-size:.8125rem; color:var(--muted); font-weight:500}
label.f>span .req{color:var(--alert)}
label.f input,label.f select,label.f textarea{
  padding:.45rem .6rem; border:1px solid var(--rule-strong); border-radius:5px;
  background:var(--ground); color:var(--ink); width:100%;
}
label.f textarea{resize:vertical; min-height:64px; font-family:inherit}
label.f .hint{font-size:.75rem; color:var(--faint)}
.ferr{color:var(--alert); font-size:.8125rem; margin:0 0 .6rem}
.fwarn{
  background:var(--warn-soft); border:1px solid var(--rule); border-left:3px solid var(--warn);
  padding:.6rem .75rem; border-radius:4px; font-size:.8125rem; margin-bottom:.9rem; color:var(--ink-2);
}
.fwarn b{color:var(--ink)}
.calc{
  background:var(--surface-2); border:1px solid var(--rule); border-radius:5px;
  padding:.7rem .8rem; display:grid; gap:.4rem;
}
.calc .row{display:flex; gap:.6rem; font-size:.875rem; align-items:baseline}
.calc .row .k{color:var(--muted)}
.calc .row .v{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:600}
.calc .row.big .v{font-size:1.0625rem; color:var(--money)}
.calc .hint{font-size:.75rem; color:var(--muted); border-top:1px solid var(--rule); padding-top:.4rem}
.ro-note{
  background:var(--surface-2); border:1px solid var(--rule); padding:.6rem .8rem;
  border-radius:5px; font-size:.8125rem; color:var(--muted); margin-bottom:1rem;
}
footer.ft{
  border-top:1px solid var(--rule); margin-top:2rem; padding:1rem 0; color:var(--faint);
  font-size:.75rem; max-width:80ch;
}
</style>

<script id="app-src">
/* ============================================================
   Placement Desk — a working ATS + CRM for a staffing desk.
   State lives in the published page; every save publishes a new
   version, so the whole team sees the same records.
   ============================================================ */
"use strict";

const STAGES = ["Sourced","Submitted","Client review","Interview","Offer","Placed"];
const CLOSED = ["Rejected","Withdrawn"];
const JOBTYPES = ["Contract","Direct hire","Contract-to-hire","SOW / project"];
const JOBSTATUS = ["Open","On hold","Filled","Closed","Lost"];
const ORGKINDS = ["Client","Prospect","MSP / VMS"];
const WORKAUTH = ["US citizen","Green card","H-1B","EAD","TN","Needs sponsorship","Other"];
const DEFAULT_BURDEN = 22;

/* ---------- tiny helpers ---------- */
let _seq = 0;
const uid = p => p + "_" + Date.now().toString(36) + (_seq++).toString(36) + Math.floor(Math.random()*1e4).toString(36);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + (Math.round((+n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => "$" + Math.round(+n||0).toLocaleString("en-US");
const pct = n => (Math.round((+n||0)*10)/10).toFixed(1) + "%";
const todayISO = () => new Date().toISOString().slice(0,10);
const nowISO = () => new Date().toISOString();
function addDays(iso, d){ const x = new Date((iso||todayISO())+"T00:00:00"); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); }
function daysAgo(ts){ if(!ts) return 0; return Math.floor((Date.now() - new Date(ts).getTime())/86400000); }
function daysUntil(iso){ if(!iso) return null; return Math.ceil((new Date(iso+"T00:00:00").getTime() - Date.now())/86400000); }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(String(iso).length>10 ? iso : iso+"T00:00:00");
  if(isNaN(d)) return "—";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function fmtAgo(ts){
  if(!ts) return "—";
  const d = daysAgo(ts);
  return d<=0 ? "today" : d===1 ? "1 day ago" : d + " days ago";
}
const digits = s => String(s||"").replace(/\D/g,"");
const normEmail = s => String(s||"").trim().toLowerCase();

/* ---------- the margin engine: defined exactly once ---------- */
function margin(pay, bill, burdenPct){
  const p = +pay||0, b = +bill||0, bp = +burdenPct||0;
  const burden = p * bp/100;
  const gm = b - p - burden;
  return { burden, gm, gmPct: b ? gm/b*100 : 0, markupPct: p ? ((b/p)-1)*100 : 0, spread: b-p };
}
/* bill rate needed to hold a target GM% given pay + burden */
function billToHold(pay, burdenPct, targetGmPct){
  const cost = (+pay||0) * (1 + (+burdenPct||0)/100);
  const t = (+targetGmPct||0)/100;
  return t >= 1 ? 0 : cost/(1-t);
}

/* ---------- state ---------- */
function emptyState(){
  return { v:1, sample:false, people:[], orgs:[], jobs:[], subs:[], placements:[] };
}
function seedState(){
  const S = emptyState();
  S.sample = true;
  const o1 = { id:uid("o"), name:"Northwind Health", kind:"Client", status:"Active", notes:"Master agreement signed. Net 45. Two approved suppliers.", createdAt:nowISO() };
  const o2 = { id:uid("o"), name:"Ardent Logistics", kind:"Client", status:"Active", notes:"New account, first req came through referral.", createdAt:nowISO() };
  const o3 = { id:uid("o"), name:"Fieldglass (MSP)", kind:"MSP / VMS", status:"Active", notes:"Reqs arrive through the portal. End client is Ardent.", createdAt:nowISO() };
  S.orgs.push(o1,o2,o3);

  const c1 = { id:uid("p"), name:"Dana Whitfield", email:"dana.whitfield@northwind.example", phone:"(312) 555-0148", city:"Chicago, IL", title:"Director of Engineering", isContact:true, isCandidate:false, orgId:o1.id, notes:"Prefers a shortlist of three. Moves fast on senior backend.", lastContact:nowISO(), createdAt:nowISO(), skills:[] };
  const c2 = { id:uid("p"), name:"Marcus Reyes", email:"m.reyes@ardent.example", phone:"(214) 555-0102", city:"Dallas, TX", title:"VP Operations", isContact:true, isCandidate:false, orgId:o2.id, notes:"Budget owner. Wants weekly status.", lastContact:nowISO(), createdAt:nowISO(), skills:[] };
  S.people.push(c1,c2);

  const cands = [
    ["Priya Raman","priya.raman@example.com","(773) 555-0191","Chicago, IL","Senior Backend Engineer",9,["Java","Spring Boot","Kubernetes","PostgreSQL"],"US citizen",78,"Strong Northwind fit. Answers texts within the hour.",2],
    ["Tomas Novak","t.novak@example.com","(312) 555-0173","Chicago, IL","Platform Engineer",7,["Go","Kubernetes","Terraform","AWS"],"Green card",72,"Currently on assignment ending soon — redeployment candidate.",5],
    ["Aisha Bello","aisha.bello@example.com","(469) 555-0128","Dallas, TX","Data Engineer",6,["Python","dbt","Snowflake","Airflow"],"US citizen",68,"Open to contract or perm. Wants hybrid.",1],
    ["Grant Mueller","grant.mueller@example.com","(214) 555-0155","Fort Worth, TX","Warehouse Operations Lead",11,["WMS","Lean","Forklift cert","Team lead"],"US citizen",34,"Two prior assignments with us, both extended.",9],
    ["Lena Ortiz","lena.ortiz@example.com","(872) 555-0117","Remote",  "Senior React Engineer",8,["React","TypeScript","GraphQL","Node"],"US citizen",75,"Ghosted once in 2024 — confirm interest before submitting.",41]
  ];
  const cp = cands.map(a => ({
    id:uid("p"), name:a[0], email:a[1], phone:a[2], city:a[3], title:a[4], years:a[5],
    skills:a[6], workAuth:a[7], desiredPay:a[8], notes:a[9], isCandidate:true, isContact:false,
    orgId:null, availFrom:addDays(todayISO(), 14), lastContact:new Date(Date.now()-a[10]*86400000).toISOString(), createdAt:nowISO()
  }));
  S.people.push.apply(S.people, cp);

  const j1 = { id:uid("j"), orgId:o1.id, endClientOrgId:null, title:"Senior Backend Engineer", type:"Contract", status:"Open", openings:2, city:"Chicago, IL (hybrid)", billMax:145, payMax:95, salaryMin:null, salaryMax:null, hmId:c1.id, owner:"House desk", notes:"Java/Spring. 12-month contract, likely extension.", createdAt:new Date(Date.now()-18*86400000).toISOString() };

function everReached(s, stage){
  if(s.hist && s.hist.some(h => h.s===stage)) return true;
  const ci = STAGES.indexOf(s.stage), ti = STAGES.indexOf(stage);
  return ci>=0 && ti>=0 && ci>=ti;

/* ---------- metrics ---------- */
function metrics(){
  const openReqs = S.jobs.filter(j => j.status==="Open");
  const openings = openReqs.reduce((n,j) => n + (+j.openings||1), 0);
  const active = S.subs.filter(s => isOpenStage(s.stage));
  const activePl = S.placements.filter(p => p.status==="Active");
  let weeklyGM = 0, feeBooked = 0;
  activePl.forEach(p => {
    const s = sub(p.subId); const j = s ? job(s.jobId) : null;
    if(j && j.type==="Direct hire"){ feeBooked += (+p.fee||0); }
    else { weeklyGM += margin(p.payRate,p.billRate,p.burdenPct).gm * 40; }
  });
  const stale = active
    .filter(s => s.stage!=="Sourced" && daysAgo(s.stageSince) >= 5)
    .sort((a,b) => daysAgo(b.stageSince) - daysAgo(a.stageSince));
  const ending = activePl
    .filter(p => p.endsOn && daysUntil(p.endsOn)!==null && daysUntil(p.endsOn) <= 30)
    .sort((a,b) => daysUntil(a.endsOn) - daysUntil(b.endsOn));
  const nSubmitted = S.subs.filter(s => everReached(s,"Submitted")).length;
  const nInterview = S.subs.filter(s => everReached(s,"Interview")).length;
  const nPlaced = S.subs.filter(s => everReached(s,"Placed")).length;
  const fills = S.subs.filter(s => everReached(s,"Placed") && s.hist && s.hist.length);
  let ttf = null;
  if(fills.length){
    const tot = fills.reduce((n,s) => {
      const first = s.hist[0], last = s.hist.filter(h => h.s==="Placed").pop() || s.hist[s.hist.length-1];
      return n + Math.max(0, Math.round((new Date(last.at) - new Date(first.at))/86400000));
    }, 0);
    ttf = Math.round(tot/fills.length);
  }
  return { openReqs, openings, active, activePl, weeklyGM, feeBooked, stale, ending,
           nSubmitted, nInterview, nPlaced, ttf,
           subToInt: nSubmitted ? nInterview/nSubmitted*100 : 0,
           intToPlace: nInterview ? nPlaced/nInterview*100 : 0 };
}

}

/* ---------- form field helpers ---------- */
function fld(name,label,val,opts){
  opts = opts||{};
  const t = opts.type||"text";
  const req = opts.req?' <span class="req">*</span>':"";
  const hint = opts.hint?'<span class="hint">'+esc(opts.hint)+'</span>':"";
  const extra = (opts.step?' step="'+opts.step+'"':"") + (opts.min!=null?' min="'+opts.min+'"':"") +
                (opts.ph?' placeholder="'+esc(opts.ph)+'"':"") + (opts.calc?' data-calc="1"':"");
  if(t==="textarea") return '<label class="f"><span>'+esc(label)+req+'</span><textarea name="'+name+'"'+extra+'>'+esc(val==null?"":val)+'</textarea>'+hint+'</label>';
  if(t==="select"){
    const o = (opts.options||[]).map(x => {
      const v = typeof x==="object"?x.v:x, l = typeof x==="object"?x.l:x;
      return '<option value="'+esc(v)+'"'+(String(val)===String(v)?" selected":"")+'>'+esc(l)+'</option>';
    }).join("");
    return '<label class="f"><span>'+esc(label)+req+'</span><select name="'+name+'"'+(opts.calc?' data-calc="1"':"")+'>'+
      (opts.blank?'<option value="">'+esc(opts.blank)+'</option>':"")+o+'</select>'+hint+'</label>';
  }
  return '<label class="f"><span>'+esc(label)+req+'</span><input type="'+t+'" name="'+name+'" value="'+esc(val==null?"":val)+'"'+extra+'>'+hint+'</label>';
}
function modalShell(title, body, footer){
  return '<div class="scrim" data-a="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'+
    '<div class="modal-h"><h2>'+esc(title)+'</h2><button class="x" data-a="closeModal" aria-label="Close">×</button></div>'+
    '<form data-a="form"><div class="modal-b">'+(UI.err?'<p class="ferr">'+esc(UI.err)+'</p>':"")+body+'</div>'+
    '<div class="modal-f">'+footer+'</div></form></div></div>';
}
function stdFooter(label, extra){

        fld("notes","Notes",p.notes,{type:"textarea",ph:"How they buy, what they want to see…"})+
      '</div>', stdFooter(d.id?"Save changes":"Add contact"));
  }

  case "job": {
    const j = d.id?job(d.id):{};
    const oid = d.orgId || j.orgId || (S.orgs[0]&&S.orgs[0].id);
    const type = d.type || j.type || "Contract";
    const isPerm = type==="Direct hire";
    const hmOpts = S.people.filter(p=>p.isContact).map(p=>({v:p.id,l:p.name+" — "+orgName(p.orgId)}));
    if(!S.orgs.length) return modalShell("Add a job",
      '<div class="fwarn"><b>Add a company first.</b> Every job belongs to the company you are filling it for.</div>',
      '<span class="sp"><button type="button" class="btn" data-a="closeModal">Cancel</button><button type="button" class="btn pri" data-a="addOrg">Add a company</button></span>');
    return modalShell(d.id?"Edit job":"Add a job",

        '<div class="fr two">'+fld("orgId","Company you invoice",oid,{type:"select",req:true,options:S.orgs.map(o=>({v:o.id,l:o.name}))})+
          fld("endClientOrgId","End client (if via an MSP)",j.endClientOrgId,{type:"select",blank:"— same as above —",options:S.orgs.map(o=>({v:o.id,l:o.name})),hint:"Set this when work happens somewhere other than who you bill."})+'</div>'+
        '<div class="fr three">'+fld("city","Location",j.city,{ph:"Chicago, IL (hybrid)"})+
          fld("openings","Openings",j.openings||1,{type:"number",min:1})+
          fld("status","Status",j.status||"Open",{type:"select",options:JOBSTATUS})+'</div>'+
        '<div class="fr two">'+
          fld("billMax","Max bill rate ($/hr)",j.billMax,{type:"number",step:"0.5",min:0,hint:isPerm?"For hourly work — leave blank on a perm role.":"Your ceiling. Submissions above it get flagged."})+
          fld("payMax","Max pay rate ($/hr)",j.payMax,{type:"number",step:"0.5",min:0})+
        '</div>'+
        '<div class="fr two">'+
          fld("salaryMin","Salary from",j.salaryMin,{type:"number",min:0,ph:"175000",hint:isPerm?"Required in CO, CA, NY, WA and IL postings.":"For perm roles — leave blank on contract."})+
          fld("salaryMax","Salary to",j.salaryMax,{type:"number",min:0,ph:"205000"})+
        '</div>'+
        (hmOpts.length?fld("hmId","Hiring manager",j.hmId,{type:"select",blank:"— none —",options:hmOpts}):"")+
        fld("notes","Notes",j.notes,{type:"textarea",ph:"Must-haves, interview process, fee terms…"})+
      '</div>', stdFooter(d.id?"Save changes":"Add job"));
  }

  case "submit": {
    /* submit a candidate to a job, or add a candidate to a job's pipeline */
    const fixedJob = d.jobId?job(d.jobId):null;

    const openJobs = S.jobs.filter(j => j.status==="Open");

          fld("payRate","Pay rate ($/hr)",d.payRate,{type:"number",step:"0.5",min:0,hint:"Optional now — required to place."})+'</div>'+
        fld("billRate","Bill rate ($/hr)",d.billRate,{type:"number",step:"0.5",min:0})+

      '</div>', stdFooter(fixedJob?"Add to pipeline":"Submit"));
  }

  case "placement": {
    const s = sub(d.subId); if(!s) return "";

            fld("burdenPct","Burden (%)",burden,{type:"number",step:"0.5",min:0,calc:true,hint:"Taxes, WC, benefits."})+'</div>'+
          '<div id="calc">'+calcBox(pay,bill,burden,j)+'</div>'+
        '</div>';
    return modalShell(d.id?"Edit placement":"Create placement", body, stdFooter(d.id?"Save placement":"Create placement",
      d.id&&!READONLY?'<button type="button" class="btn dgr" data-a="endPlacement" data-id="'+d.id+'">End assignment</button>':""));
  }

  case "closeSub": {
    const s = sub(d.id); if(!s) return "";

      '<div class="fg">'+
        '<div class="note"><span class="w">Submission</span>'+esc(subLabel(s))+'</div>'+
        fld("stage","Outcome",d.stage||"Rejected",{type:"select",options:CLOSED})+
        fld("closedReason","Reason",d.closedReason,{type:"select",req:true,options:[
          "Rate too high","Skills gap","Lost to another supplier","Candidate withdrew",
          "Candidate unresponsive","Counter-offer accepted","Req cancelled","Client never responded","Other"],
          hint:'"Client passed" tells you nothing later. These reasons tell you where money leaks.'})+
        fld("notes","Note",d.notes,{type:"textarea"})+
      '</div>', stdFooter("Close submission"));
  }

  case "logContact": {
    const p = person(d.id); if(!p) return "";
    return modalShell("Log contact",
      '<div class="fg">'+
        '<div class="note"><span class="w">Person</span>'+esc(p.name)+' · last contact '+esc(fmtAgo(p.lastContact))+'</div>'+
        fld("when","When",todayISO(),{type:"date"})+
        fld("note","What happened",d.note,{type:"textarea",req:true,ph:"Called about the Northwind role — interested, available in 2 weeks."})+
      '</div>', stdFooter("Log it"));
  }

  case "confirm":
    return modalShell(d.title||"Are you sure?",
      '<p style="margin:0">'+esc(d.body||"")+'</p>',
      '<span class="sp"><button type="button" class="btn" data-a="closeModal">Cancel</button>'+
      '<button type="submit" class="btn '+(d.danger?"dgr":"pri")+'">'+esc(d.ok||"Confirm")+'</button></span>');
  }
  return "";
}
function calcBox(pay,bill,burden,j){
  const m = margin(pay,bill,burden);
  const hold = billToHold(pay,burden,m.gmPct);
  const warn = m.gm <= 0
    ? '<div class="hint" style="color:var(--alert)">This placement loses money at these rates.</div>'
    : (j && j.billMax && +bill > +j.billMax
      ? '<div class="hint" style="color:var(--alert)">Bill rate is above this job\'s ceiling of '+money0(j.billMax)+'.</div>'
      : '<div class="hint">Burden is '+money(m.burden)+'/hr on top of pay. Raising pay by $1 needs bill up '+money(1+ (+burden||0)/100)+' just to hold this margin.</div>');
  return '<div class="calc">'+
    row("Spread (bill − pay)", money(m.spread))+
    row("Burden", money(m.burden)+"/hr")+
    '<div class="row big"><span class="k">Gross margin</span><span class="v">'+money(m.gm)+'/hr</span></div>'+
    row("Gross margin %", pct(m.gmPct))+
    row("Markup %", pct(m.markupPct))+
    row("Per week at 40 hrs", money0(m.gm*40))+
    warn+
  '</div>';
}

/* ---------- render ---------- */
function viewHtml(){
  switch(UI.view){
    case "jobs": return viewJobs();
    case "cands": return viewCands();
    case "orgs": return viewOrgs();
    case "place": return viewPlace();
    default: return viewDesk();
  }
}
function footerHtml(){
  return '<footer class="ft">Placement Desk keeps the whole team on one set of records — every change you save publishes a new version everyone sees. '+
    'It covers the recruiting workflow: candidates, companies, jobs, pipeline, placements and margin. '+
    'It is deliberately not a payroll, tax or invoicing system.</footer>';
}
function render(){
  const r = document.getElementById("root");
  if(!r) return;
  r.innerHTML = topBar() + '<div class="wrap">' + banner() + viewHtml() + footerHtml() + '</div>' + modalHtml();
  const el = UI.focusId ? document.getElementById(UI.focusId) : null;
  if(el){ el.focus(); if(el.setSelectionRange && el.value!=null){ const n=el.value.length; try{el.setSelectionRange(n,n)}catch(e){} } }
  const first = document.querySelector('.modal input:not([type=hidden]), .modal select, .modal textarea');
  if(first && !UI.focusId) first.focus();
}
function go(view){ UI.view=view; UI.sel=null; UI.q=""; UI.focusId=null; saveUI(); render(); }
function openRec(view,id){ UI.view=view; UI.sel=id; UI.focusId=null; saveUI(); render(); }
function modal(kind,data){ UI.modal=kind; UI.md=data||{}; UI.err=null; UI.focusId=null; render(); }
function closeModal(){ UI.modal=null; UI.md=null; UI.err=null; UI.focusId=null; render(); }

/* ---------- persistence ---------- */
function renderDoc(state){
  const css = document.getElementById("app-css").textContent;
  const src = document.getElementById("app-src").textContent;
  const json = JSON.stringify(state)
    .replace(/</g, "\\u003c")
    .replace(/\u2028/g, "\\u2028")
    .replace(/\u2029/g, "\\u2029");
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<title>Placement Desk</title>'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">'+
    '<style id="app-css">'+css+'</style></head><body>'+
    '<div id="root"></div>'+
    '<script type="application/json" id="app-state">'+json+'<\/script>'+
    '<script id="app-src">'+src+'<\/script>'+
    '</body></html>';
}
let apiPromise = null;
function getApi(){
  if(!apiPromise) apiPromise = (window.claude && window.claude.use) ? window.claude.use("artifact") : Promise.resolve(null);
  return apiPromise;
}
async function save(){
  if(READONLY) return;
  SAVING = true; setStatus("Saving…");
  saveUI();
  let html;
  try{ html = renderDoc(S); }
  catch(e){ SAVING=false; setStatus("Could not prepare the save", true); return; }
  const api = await getApi();
  if(!api){
    SAVING = false;
    setStatus("Preview only — changes are not saved", true);
    return;
  }
  try{
    await api.publish(html);   /* this view reloads to the new version */
    setStatus("Saved");
  }catch(e){
    SAVING = false;
    const code = e && e.code;
    if(code === "conflict"){
      setStatus("Someone else saved first — reloading");
    }else if(code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required" || code === "capability_disabled" || code === "capability_removed"){
      READONLY = true; setStatus("Read-only view", true); render();
    }else if(code === "rate_limited"){
      setStatus("Saving too often — wait a few seconds and try again", true);
    }else if(code === "too_large"){
      setStatus("Too much data to save in one page", true);
    }else{
      setStatus("Save failed — your change is still on screen, try again", true);
    }
  }
}

/* ---------- mutations ---------- */
function advance(sid, dir){
  const s = sub(sid); if(!s) return;
  const i = STAGES.indexOf(s.stage);
  if(i < 0) return;
  const ni = i + dir;
  if(ni < 0 || ni >= STAGES.length) return;
  if(STAGES[ni] === "Placed"){ modal("placement",{subId:sid}); return; }
  s.stage = STAGES[ni];
  s.stageSince = nowISO();
  s.hist = s.hist||[]; s.hist.push({ s:s.stage, at:s.stageSince, by:"me" });
  const p = person(s.personId); if(p) p.lastContact = nowISO();
  render(); save();
}
function fd(form){
  const o = {}; new FormData(form).forEach((v,k) => { o[k] = typeof v==="string" ? v.trim() : v; });
  return o;
}
const numOrNull = v => (v===""||v==null||isNaN(+v)) ? null : +v;

function handleSubmitForm(form){
  const v = fd(form);
  const d = UI.md||{};
  switch(UI.modal){

  case "cand": {
    if(!v.name){ UI.err="A name is required."; render(); return; }
    const skills = v.skills ? v.skills.split(",").map(s=>s.trim()).filter(Boolean) : [];
    if(!d.id && !d.dupeAck){
      const e = normEmail(v.email), ph = digits(v.phone);
      const hit = S.people.find(p => (e && normEmail(p.email)===e) || (ph && ph.length>=10 && digits(p.phone)===ph));
      if(hit){ UI.md = Object.assign({}, d, {dupe:hit.name, dupeAck:true, keep:v}); render(); return; }
    }
    if(d.id){
      const p = person(d.id);
      Object.assign(p,{ name:v.name, title:v.title, email:v.email, phone:v.phone, city:v.city,
        years:numOrNull(v.years), workAuth:v.workAuth, desiredPay:numOrNull(v.desiredPay),
        availFrom:v.availFrom||null, skills, notes:v.notes });
    }else{
      const p = { id:uid("p"), name:v.name, title:v.title, email:v.email, phone:v.phone, city:v.city,
        years:numOrNull(v.years), workAuth:v.workAuth, desiredPay:numOrNull(v.desiredPay),
        availFrom:v.availFrom||null, skills, notes:v.notes, isCandidate:true, isContact:false,
        orgId:null, lastContact:nowISO(), createdAt:nowISO() };
      S.people.push(p);
      UI.view="cands"; UI.sel=p.id;
    }
    break;
  }

  case "org": {
    if(!v.name){ UI.err="A company name is required."; render(); return; }
    if(d.id) Object.assign(org(d.id), { name:v.name, kind:v.kind, status:v.status, notes:v.notes });
    else { const o = { id:uid("o"), name:v.name, kind:v.kind, status:v.status, notes:v.notes, createdAt:nowISO() };
      S.orgs.push(o); UI.view="orgs"; UI.sel=o.id; }
    break;
  }

  case "contact": {
    if(!v.name){ UI.err="A name is required."; render(); return; }
    if(!v.orgId){ UI.err="Pick the company this person works for."; render(); return; }
    if(d.id) Object.assign(person(d.id), { name:v.name, title:v.title, orgId:v.orgId, email:v.email, phone:v.phone, notes:v.notes });
    else S.people.push({ id:uid("p"), name:v.name, title:v.title, orgId:v.orgId, email:v.email, phone:v.phone,
      notes:v.notes, isContact:true, isCandidate:false, skills:[], lastContact:nowISO(), createdAt:nowISO() });
    break;
  }

  case "job": {
    if(!v.title){ UI.err="A job title is required."; render(); return; }
    if(!v.orgId){ UI.err="Pick the company you are filling this for."; render(); return; }
    const patch = { title:v.title, type:v.type, orgId:v.orgId,
      endClientOrgId:(v.endClientOrgId && v.endClientOrgId!==v.orgId) ? v.endClientOrgId : null,
      city:v.city, openings:Math.max(1, +v.openings||1), status:v.status,
      billMax:numOrNull(v.billMax), payMax:numOrNull(v.payMax),
      salaryMin:numOrNull(v.salaryMin), salaryMax:numOrNull(v.salaryMax),
      hmId:v.hmId||null, notes:v.notes };
    if(d.id) Object.assign(job(d.id), patch);
    else { const j = Object.assign({ id:uid("j"), owner:"me", createdAt:nowISO() }, patch);
      S.jobs.push(j); UI.view="jobs"; UI.sel=j.id; }
    break;
  }

  case "submit": {
    const jid = d.jobId || v.jobId, pid = d.personId || v.personId;
    if(!jid || !pid){ UI.err="Pick both a job and a candidate."; render(); return; }
    if(S.subs.some(s => s.jobId===jid && s.personId===pid)){
      UI.err="That candidate is already in this job's pipeline."; render(); return;
    }
    if(!d.rtrAck){
      const j = job(jid);
      const clash = S.subs.find(s => {
        if(s.personId!==pid) return false;
        const oj = job(s.jobId); if(!oj || oj.id===jid) return false;
        const sameCo = oj.orgId===j.orgId || (j.endClientOrgId && oj.endClientOrgId===j.endClientOrgId) ||
                       (j.endClientOrgId && oj.orgId===j.endClientOrgId) || (oj.endClientOrgId && oj.endClientOrgId===j.orgId);
        return sameCo && CLOSED.indexOf(s.stage)<0;
      });
      if(clash){
        const oj = job(clash.jobId);
        UI.md = Object.assign({}, d, { jobId:jid, personId:pid, rtrAck:true,
          rtr:"Already in the pipeline for “"+(oj?oj.title:"another role")+"” at this client, at stage "+clash.stage+".",
          stage:v.stage, payRate:v.payRate, billRate:v.billRate, notes:v.notes });
        render(); return;
      }
    }
    const stage = v.stage || "Submitted";
    const s = { id:uid("s"), jobId:jid, personId:pid, stage, stageSince:nowISO(),
      hist:[{ s:stage, at:nowISO(), by:"me" }],
      payRate:numOrNull(v.payRate), billRate:numOrNull(v.billRate), notes:v.notes, closedReason:null };
    S.subs.push(s);
    const p = person(pid); if(p) p.lastContact = nowISO();
    UI.view="jobs"; UI.sel=jid;
    break;
  }

  case "placement": {
    const s = sub(d.subId); if(!s){ closeModal(); return; }
    const j = job(s.jobId);
    const isPerm = j && j.type==="Direct hire";
    if(!v.startsOn){ UI.err="A start date is required."; render(); return; }
    if(!isPerm && (numOrNull(v.payRate)==null || numOrNull(v.billRate)==null)){
      UI.err="Pay and bill rates are both required to place someone."; render(); return;
    }
    const patch = isPerm
      ? { startsOn:v.startsOn, endsOn:null, payRate:null, billRate:null, burdenPct:null,
          fee:numOrNull(v.fee), guarantee:numOrNull(v.guarantee), status:"Active" }
      : { startsOn:v.startsOn, endsOn:v.endsOn||null, payRate:+v.payRate, billRate:+v.billRate,
          burdenPct:numOrNull(v.burdenPct)==null?DEFAULT_BURDEN:+v.burdenPct, fee:null, status:"Active" };
    if(d.id) Object.assign(byId(S.placements,d.id), patch);
    else{
      S.placements.push(Object.assign({ id:uid("pl"), subId:s.id, createdAt:nowISO() }, patch));
      if(s.stage !== "Placed"){
        s.stage = "Placed"; s.stageSince = nowISO();
        s.hist = s.hist||[]; s.hist.push({ s:"Placed", at:s.stageSince, by:"me" });
      }
      if(!isPerm){ s.payRate = +v.payRate; s.billRate = +v.billRate; }
      const openLeft = (j?(+j.openings||1):1) - jobSubs(s.jobId).filter(x=>x.stage==="Placed").length;
      if(j && openLeft <= 0) j.status = "Filled";
      UI.view="place"; UI.sel=null;
    }
    break;
  }

  case "closeSub": {
    const s = sub(d.id); if(!s){ closeModal(); return; }
    if(!v.closedReason){ UI.err="Pick a reason — this is what makes your funnel useful later."; render(); return; }
    s.stage = v.stage||"Rejected"; s.stageSince = nowISO(); s.closedReason = v.closedReason;
    if(v.notes) s.notes = ((s.notes?s.notes+"\n":"")+v.notes);
    s.hist = s.hist||[]; s.hist.push({ s:s.stage, at:s.stageSince, by:"me", why:v.closedReason });
    break;
  }

  case "logContact": {
    const p = person(d.id); if(!p){ closeModal(); return; }
    if(!v.note){ UI.err="Say what happened."; render(); return; }
    p.lastContact = (v.when||todayISO()) + "T12:00:00.000Z";
    p.notes = "[" + fmtDate(v.when||todayISO()) + "] " + v.note + (p.notes ? "\n" + p.notes : "");
    break;
  }

  case "confirm": {
    const fn = CONFIRM_FN; CONFIRM_FN = null;
    closeModal();
    if(fn) fn();
    return;
  }
  }
  UI.modal=null; UI.md=null; UI.err=null;
  render(); save();
}
let CONFIRM_FN = null;
function confirmThen(title, body, ok, danger, fn){
  CONFIRM_FN = fn; modal("confirm",{title,body,ok,danger});
}

/* ---------- CSV export ---------- */
function csv(rows){
  return rows.map(r => r.map(c => {
    const s = c==null?"":String(c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join("\r\n");
}
async function download(filename, text){
  setStatus("Preparing file…");
  let dl = null;
  try{ dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }catch(e){}
  if(!dl){ setStatus("Download is not available in this view", true); return; }
  try{ await dl.save({ filename, data:text }); setStatus("File ready"); }
  catch(e){ setStatus("Download cancelled", true); }
}
function exportCandidates(){
  const rows = [["Name","Title","Email","Phone","Location","Years","Work auth","Wants $/hr","Available","Skills","Last contact","Active submissions","Notes"]];
  candidates().forEach(p => rows.push([p.name,p.title,p.email,p.phone,p.city,p.years,p.workAuth,p.desiredPay,p.availFrom,
    (p.skills||[]).join("; "), p.lastContact?p.lastContact.slice(0,10):"",
    personSubs(p.id).filter(s=>isOpenStage(s.stage)).length, p.notes]));
  download("candidates.csv", csv(rows));
}
function exportPlacements(){
  const rows = [["Contractor","Job","Client","End client","Type","Start","End","Pay","Bill","Burden %","GM $/hr","GM %","Markup %","Fee","Status"]];
  S.placements.forEach(pl => {
    const s = sub(pl.subId), pe = s?person(s.personId):null, j = s?job(s.jobId):null;
    const m = margin(pl.payRate,pl.billRate,pl.burdenPct);
    rows.push([pe?pe.name:"", j?j.title:"", j?orgName(j.orgId):"", j&&j.endClientOrgId?orgName(j.endClientOrgId):"",
      j?j.type:"", pl.startsOn, pl.endsOn, pl.payRate, pl.billRate, pl.burdenPct,
      pl.payRate?m.gm.toFixed(2):"", pl.payRate?m.gmPct.toFixed(1):"", pl.payRate?m.markupPct.toFixed(1):"",
      pl.fee, pl.status]);
  });
  download("placements.csv", csv(rows));
}

/* ---------- live margin recalculation ---------- */
function updateCalc(){
  const box = document.getElementById("calc");
  if(!box) return;
  const form = box.closest("form");
  if(!form) return;
  const v = fd(form);
  const s = sub((UI.md||{}).subId);
  const j = s ? job(s.jobId) : null;
  box.innerHTML = calcBox(v.payRate, v.billRate, v.burdenPct, j);
}

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  const t = e.target.closest("[data-a]");
  if(!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  if(a === "scrim" && e.target !== t) return;      /* only the backdrop itself closes */
  if(t.tagName === "A") e.preventDefault();

  switch(a){
    case "view":        go(t.dataset.v); return;
    case "jobFilter":   return;                     /* handled on change */
    case "q":           return;
    case "scrim":
    case "closeModal":  closeModal(); return;

    case "openJob":     openRec("jobs", id); return;
    case "openPerson":  { const p = person(id); openRec(p && p.isContact ? "orgs" : "cands", id); return; }
    case "openOrg":     openRec("orgs", id); return;
    case "openSub":     { const s = sub(id); if(s) openRec("jobs", s.jobId); return; }
    case "openPlacement": {
      const pl = byId(S.placements, id);
      if(pl) modal("placement", { id:pl.id, subId:pl.subId });
      return;
    }

    case "addCand":     modal("cand", {}); return;
    case "editPerson":  { const p = person(UI.sel); if(p) modal(p.isContact ? "contact" : "cand", { id:p.id }); return; }
    case "addOrg":      modal("org", {}); return;
    case "editOrg":     modal("org", { id:UI.sel }); return;
    case "addContact":  modal("contact", { orgId:UI.sel }); return;
    case "addJob":      modal("job", { orgId:(UI.view==="orgs" && UI.sel) ? UI.sel : null }); return;
    case "editJob":     modal("job", { id:UI.sel }); return;
    case "addToPipeline": modal("submit", { jobId:UI.sel }); return;
    case "submitToJob": modal("submit", { personId:UI.sel }); return;
    case "logContact":  modal("logContact", { id:UI.sel }); return;
    case "closeSub":    modal("closeSub", { id:id }); return;
    case "makePlacement": modal("placement", { subId:id }); return;

    case "advance":     advance(id, 1); return;
    case "back":        advance(id, -1); return;

    case "endPlacement": {
      const pl = byId(S.placements, id);
      if(!pl) return;
      confirmThen("End this assignment?",
        "The placement stays on the record with its margin history — it just stops counting as active.",
        "End assignment", true, function(){
          pl.status = "Ended"; pl.actualEnd = todayISO();
          const s = sub(pl.subId); const j = s ? job(s.jobId) : null;
          if(j && j.status === "Filled") j.status = "Open";
          UI.view = "place"; render(); save();
        });
      return;
    }

    case "clearSample": {
      confirmThen("Clear the sample data?",
        "Every sample candidate, company, job and placement is removed so you can start entering your own. This cannot be undone.",
        "Clear it", true, function(){
          S = emptyState();
          UI.view = "desk"; UI.sel = null; UI.q = "";
          render(); save();
        });
      return;
    }

    case "exportCsv":        exportCandidates(); return;
    case "exportPlacements": exportPlacements(); return;
  }
});

document.addEventListener("input", function(e){
  const el = e.target;
  if(!el.dataset) return;
  if(el.dataset.a === "q"){ UI.q = el.value; UI.focusId = "q"; saveUI(); render(); return; }
  if(el.dataset.calc){ updateCalc(); return; }
});

document.addEventListener("change", function(e){
  const el = e.target;
  if(el.dataset && el.dataset.a === "jobFilter"){ UI.jobFilter = el.value; saveUI(); render(); return; }
  if(el.dataset && el.dataset.calc) updateCalc();
});

document.addEventListener("submit", function(e){
  const f = e.target.closest("form[data-a=form]");
  if(!f) return;
  e.preventDefault();
  if(READONLY){ setStatus("Read-only view", true); return; }
  handleSubmitForm(f);
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && UI.modal){ e.preventDefault(); closeModal(); }
});

/* ---------- boot ---------- */
render();
getApi().then(function(api){
  if(!api){ NOSAVE = true; render(); }
}).catch(function(){ NOSAVE = true; render(); });
</script>
