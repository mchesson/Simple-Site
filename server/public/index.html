<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TS Workspace</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="nav">
    <div class="brand"><div class="mark">TS</div><h1>TS Workspace</h1></div>

    <div class="navsec">Assistant</div>
    <button class="item on" data-view="chat">Project Assistant</button>
    <button class="item" id="newchat">New chat</button>
    <div id="convs"></div>

    <div class="navsec">Records</div>
    <button class="item" data-view="accounts">Accounts</button>
    <button class="item" data-view="projects">Projects</button>
    <button class="item" data-view="contacts">Contacts</button>
    <button class="item" data-view="documents">Documents</button>
    <button class="item" data-view="pos">Purchase orders</button>

    <div class="spacer"></div>
    <div class="navsec">System</div>
    <a class="item" href="/inspect.html">Inspector</a>
    <div class="foot" id="whoami">…</div>
  </aside>

  <main>
    <div class="topbar">
      <h2 id="title">Project Assistant</h2>
      <span class="sub" id="subtitle"></span>
      <span class="grow"></span>
      <span class="pill" id="keystate"></span>
    </div>
    <div id="body" class="chatwrap"></div>
  </main>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
